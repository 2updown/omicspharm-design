        showBiz();
      } else if (t.closest('#bizReset')) {
        F.bizReset(r); OP.toast(s.st === 'review' ? '사업자등록증 확인과 의뢰 승인을 처음 상태로 되돌렸습니다.' : '사업자등록증 확인을 처음 상태로 되돌렸습니다.'); render();
      } else if (t.closest('#bizOk')) {
        if (!F.bizSeen(id)) { OP.toast('사업자등록증을 열어 확인한 뒤 눌러주세요.'); $('#bizView').focus(); return; }
        bizOkDo();
      } else if (t.closest('#bizAsk')) {
        bizAskDo();
      } else if (t.closest('#approve')) {
        if (!F.bizOk(r)) return; // 사업자등록증 미제출·확인 전: 버튼 비활성
        if ((s.biz || {}).st === 'ask') { OP.toast('사업자등록증 재제출을 기다리고 있습니다.'); return; }
        if (F.bizName(r) && !F.bizOk(r)) { OP.toast('사업자등록증 확인 완료 후 승인할 수 있습니다.'); var bv = $('#bizView'); if (bv) bv.focus(); return; }
        F.ask({ title: '의뢰를 승인할까요?', desc: '"' + r.title + '" 의뢰가 프로젝트로 등록되고, 의뢰사(' + (r.org || '-') + ')에게 승인 알림이 갑니다.', label: false, yes: '승인' }, function () {
          F.approve(id); OP.toast('의뢰를 승인했습니다.'); render();
        });
      } else if (t.closest('[data-svcask]')) {
        var sk = t.closest('[data-svcask]').dataset.svcask;
        F.ask({ title: F.partner(sk).org + '에 분석 서비스 정보 입력을 요청할까요?', desc: '분석파트너에게 알림이 가고, 회원정보 > 분석 서비스 정보 화면에 입력 안내가 표시됩니다. 입력하지 않아도 견적 전달은 그대로 할 수 있습니다.', label: false, yes: '요청하기' }, function () {
          F.svcAsk(sk); OP.toast(F.partner(sk).org + '에 분석 서비스 정보 입력을 요청했습니다.'); render();
        });
      } else if (t.closest('#more')) {
        mailModal(s);
      } else if (t.closest('[data-doc]')) {
        var k = t.closest('[data-doc]').dataset.doc; F.showDoc(r, s.P[k].quote, k, F.partner(k).org + ' 견적서');
      } else if (t.closest('[data-rev]')) {
        var k2 = t.closest('[data-rev]').dataset.rev;
        F.ask({ title: F.partner(k2).org + '에 수정 요청', desc: '수정 요청한 견적은 파트너가 다시 제출할 때까지 클라이언트에게 전달할 수 없습니다.', html: F.itemsHTML(s.P[k2].quote), label: '수정 요청 내용', ph: '예) 전화로 협의한 대로 단가를 30만 원에서 28만 원으로 반영해 다시 제출해 주세요.', yes: '수정 요청', required: true }, function (v) {
          F.revise(id, k2, v); OP.toast('수정 요청을 보냈습니다.'); render();
        });
      } else if (t.closest('[data-mk]')) {
        cqEditor(s, t.closest('[data-mk]').dataset.mk);
      } else if (t.closest('#cqRe')) {
        var lb = F.cqLast(s); if (lb) cqEditor(s, lb.base);
      } else if (t.closest('[data-cqdoc]')) {
        var cv = F.cqList(s)[+t.closest('[data-cqdoc]').dataset.cqdoc]; F.showDoc(r, cv.quote, cv.base, cv.n + '차 클라이언트 견적서', { client: true, no: F.qno(s, cv.base) });
      } else if (t.closest('#fwd')) {
        var fk = [].map.call(card.querySelectorAll('input[name="fw"]:checked'), function (i) { return i.value; });
        F.ask({ title: '견적 ' + fk.length + '건을 클라이언트에게 전달할까요?', desc: fk.map(function (k) { return F.partner(k).org; }).join(', ') + ' 견적을 ㈜셀키에이아이 명의로 전달합니다.', label: false, yes: '전달하기' }, function () {
          F.forward(id, fk); // 클라이언트 화면의 '컨설턴트 의견' 박스는 없앰 (2026-10-21) OP.toast('클라이언트에게 견적을 전달했습니다.'); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    };
    syncFwd();
  }
  function syncFwd() {
    var b = $('#fwd'); if (!b) return;
    var n = card.querySelectorAll('input[name="fw"]:checked').length;
    b.disabled = !n; b.textContent = n ? '견적 ' + n + '건 클라이언트에게 ' + (F.state(id).st === 'sent' ? '추가 ' : '') + '전달' : '전달할 견적을 선택해주세요';
  }
  render();
  if (location.hash === '#quotes' && $('#quotes')) setTimeout(function () { $('#quotes').scrollIntoView({ block: 'start' }); }, 60); // 프로젝트 찾기 [견적서] 버튼으로 들어온 경우
})();
</script>
</body>
</html>
