<script>

  };

  // 프로젝트 관리 목록: 견적 중개 의뢰(flow.js) + 계약 이후 예시 프로젝트(mypage.js)
  if (!id) { listB(); return; }

  // ── 프로젝트 관리 목록 (기본) ──
  function listB() {
    var STG = F.ADMIN_STAGES, CATS = ['단백체 분석', '대사체 분석', '유전체 분석', '전사체 분석', 'Olink 분석', '바이오의약품·ADC', '기타 분석'];

    var DAY = 864e5, now = Date.now();

    var ITEMS = F.requests().map(function (r) {

    }).concat(OP.my.partnerProjects().filter(function (p) { return !p.flow; }).map(function (p) {

    card.classList.add('pmb');
    card.innerHTML =
      '<div class="card-head"><h3>프로젝트 관리</h3></div>' +
      '<form class="b-search" id="bq" role="search"><img src="assets/find/ic-search.svg" alt=""><input type="search" id="bqIn" placeholder="클라이언트/분석파트너명, 의뢰명, 키워드 입력" autocomplete="off"><button type="submit">검색</button></form>' +
      '<div class="b-tabw" id="bTabW"><button type="button" class="b-arr l" data-arr="-1" aria-label="이전 단계 보기" hidden><img src="assets/find/ic-caret-left.svg" alt=""></button><div class="b-tabs" id="bTabs" role="tablist"></div><button type="button" class="b-arr r" data-arr="1" aria-label="다음 단계 보기" hidden><img src="assets/find/ic-caret-right.svg" alt=""></button></div>' +
      '<div class="b-bar"><div class="b-dd" data-dd="cat"><button type="button" class="b-btn" id="ddCat">분석 서비스<i></i></button><div class="b-pop" hidden>' + CATS.map(function (c) { return '<label><input type="checkbox" value="' + c + '">' + c + '<span class="n" data-cn="' + c + '"></span></label>'; }).join('') + '</div></div>' +
        '<div class="b-dd" data-dd="rec"><button type="button" class="b-btn" id="ddRec">모집상태<i></i></button><div class="b-pop" hidden>' + [['', '전체'], ['open', '모집중'], ['closed', '모집완료']].map(function (o) { return '<label><input type="radio" name="rec" value="' + o[0] + '"' + (o[0] ? '' : ' checked') + '>' + o[1] + '</label>'; }).join('') + '</div></div>' +
        '<div class="b-dd" data-dd="date"><button type="button" class="b-btn" id="ddDate">등록일<i></i></button><div class="b-pop wide" hidden><div class="dr"><input type="date" id="dFrom"><span>~</span><input type="date" id="dTo"></div><div class="qd">' + [[7, '최근 1주'], [30, '최근 1개월'], [90, '최근 3개월']].map(function (d) { return '<button type="button" data-days="' + d[0] + '">' + d[1] + '</button>'; }).join('') + '</div></div></div>' +
        '<span class="b-sep"></span>' +
        '<button type="button" class="b-flag" data-flag="noQuote">장기 견적 미수신<b id="fnq"></b></button>' +
        '<button type="button" class="b-flag" data-flag="waitPick">견적 채택 대기<b id="fwp"></b></button></div>' +
      '<div class="b-applied" id="bApplied" hidden></div>' +
      '<div class="b-head"><span class="total" id="bTotal"></span><label class="b-sort"><select id="bSort" aria-label="정렬"><option value="new">최신등록순</option><option value="due">희망완료일순</option></select></label></div>' +
      '<div class="b-list" id="bList"></div>' +
      '<div class="demo-row"><span>※ 예시 프로젝트 + 이 브라우저에서 제출된 의뢰가 표시됩니다.</span><button type="button" id="reset">예시 데이터 초기화</button></div>';

    function base(skip) { // skip: 이 조건은 빼고 거름 (각 필터의 개수 계산용)
      var q = f.q.trim().toLowerCase();
      return ITEMS.filter(function (o) {
        if (q && [o.title, o.who, o.partner, o.id].join(' ').toLowerCase().indexOf(q) < 0) return false;
        if (skip !== 'st' && f.st !== '전체' && o.st !== f.st) return false;
        if (skip !== 'cat' && f.cat.length && f.cat.indexOf(o.cat) < 0) return false;
        if (skip !== 'rec' && f.rec && (f.rec === 'open') !== o.open) return false;
        if (f.from && o.at < new Date(f.from).getTime()) return false;
        if (f.to && o.at > new Date(f.to).getTime() + DAY) return false;
        if (skip !== 'flag' && f.noQuote && !o.noQuote) return false;
        if (skip !== 'flag' && f.waitPick && !o.waitPick) return false;
        return true;
      });
    }
    function draw() {
      var T = base('st');
      $('#bTabs').innerHTML = ['전체'].concat(STG).map(function (t) {
        var n = t === '전체' ? T.length : T.filter(function (o) { return o.st === t; }).length;
        return '<button type="button" role="tab" data-st="' + t + '"' + (f.st === t ? ' class="on" aria-selected="true"' : '') + (n ? '' : ' data-zero') + '>' + t + '<b>' + n + '</b></button>';
      }).join('');
      var C = base('cat'); [].forEach.call(card.querySelectorAll('[data-cn]'), function (e) { e.textContent = C.filter(function (o) { return o.cat === e.dataset.cn; }).length; });
      var G = base('flag');
      $('#fnq').textContent = G.filter(function (o) { return o.noQuote; }).length; $('#fwp').textContent = G.filter(function (o) { return o.waitPick; }).length;
      card.querySelector('[data-flag="noQuote"]').classList.toggle('on', f.noQuote); card.querySelector('[data-flag="waitPick"]').classList.toggle('on', f.waitPick);
      card.querySelector('[data-flag="noQuote"]').classList.toggle('hot', +$('#fnq').textContent > 0); card.querySelector('[data-flag="waitPick"]').classList.toggle('hot', +$('#fwp').textContent > 0);
      // 드롭다운 버튼에 고른 값 표시
      $('#ddCat').firstChild.textContent = f.cat.length ? (f.cat.length === 1 ? f.cat[0] : '분석 서비스 ' + f.cat.length) : '분석 서비스';
      $('#ddRec').firstChild.textContent = f.rec ? (f.rec === 'open' ? '모집중' : '모집완료') : '모집상태';
      $('#ddDate').firstChild.textContent = f.from || f.to ? dot(f.from) + ' ~ ' + dot(f.to) : '등록일';
      $('#ddCat').classList.toggle('set', !!f.cat.length); $('#ddRec').classList.toggle('set', !!f.rec); $('#ddDate').classList.toggle('set', !!(f.from || f.to));
      // 적용된 조건
      var A = f.cat.map(function (c) { return ['cat', c, c]; }).concat(f.rec ? [['rec', '', f.rec === 'open' ? '모집중' : '모집완료']] : []).concat(f.from || f.to ? [['date', '', '등록일 ' + dot(f.from) + ' ~ ' + dot(f.to)]] : [])
        .concat(f.noQuote ? [['noQuote', '', '장기 견적 미수신']] : []).concat(f.waitPick ? [['waitPick', '', '견적 채택 대기']] : []).concat(f.q ? [['q', '', '"' + f.q + '"']] : []);
      $('#bApplied').hidden = !A.length;
      $('#bApplied').innerHTML = A.map(function (a) { return '<button type="button" class="chip" data-rm="' + a[0] + '" data-v="' + esc(a[1]) + '">' + esc(a[2]) + '<i aria-label="삭제">✕</i></button>'; }).join('') + '<button type="button" class="tbtn xs" id="bReset">필터 초기화</button>';
      var L = base().sort(f.sort === 'due' ? function (a, b) { return new Date(a.due || '2100-01-01') - new Date(b.due || '2100-01-01'); } : function (a, b) { return b.at - a.at; });
      $('#bTotal').innerHTML = '총 <b>' + L.length + '</b>건';
      $('#bList').innerHTML = L.map(function (o) {
        return '<a class="lc" href="' + o.href + '"><div class="head"><div class="row1"><div class="badges"><span class="badge tag">' + esc(o.cat) + '</span><span class="badge stg">' + o.st + '</span>' + (o.open ? '<span class="badge open">모집중</span>' : '<span class="badge closed">모집완료</span>') + (o.priv ? '<span class="badge lock">비공개</span>' : '') + '</div>' +
            (o.next ? '<span class="nx' + (o.urgent ? ' hot' : '') + '">' + o.next + '</span>' : '') + '</div>' +
          '<h3>' + esc(o.title) + '</h3></div>' +
          '<div class="info"><div class="meta"><span><em>클라이언트</em>' + esc(o.who) + '</span>' + (o.partner ? '<span><em>분석파트너</em>' + esc(o.partner) + '</span>' : '') + '<span><em>샘플</em>' + (o.samples ? esc(o.samples) + '개' : '-') + '</span><span><em>희망완료일</em>' + dot(o.due) + '</span>' + (o.period !== '-' ? '<span><em>모집기한</em>' + o.period + '</span>' : '') + '</div>' +
          '<div class="foot"><p class="reg">등록일 ' + F.ymd(o.at) + ' · ' + esc(o.id) + '</p><span class="cbtns"><span class="qb">견적서 (' + o.quotes + ')</span><span class="qb">Q&amp;A (0 / 0)</span></span></div></div></a>';
      }).join('') || '<div class="empty"><b>조건에 맞는 프로젝트가 없습니다</b><p>필터를 바꾸거나 초기화해보세요.</p></div>';
    }
    var closePops = function (except) { [].forEach.call(card.querySelectorAll('.b-pop'), function (p) { if (p !== except) p.hidden = true; }); };
    card.addEventListener('click', function (e) {
      var t = e.target, dd = t.closest('.b-btn'), d;
      if (dd) { var pop = dd.nextElementSibling; closePops(pop); pop.hidden = !pop.hidden; return; }
      if ((d = t.closest('[data-st]'))) { f.st = d.dataset.st; draw(); return; }
      if ((d = t.closest('[data-flag]'))) { f[d.dataset.flag] = !f[d.dataset.flag]; draw(); return; }
      if ((d = t.closest('[data-days]'))) { f.from = F.iso(now - DAY * +d.dataset.days); f.to = F.iso(now); $('#dFrom').value = f.from; $('#dTo').value = f.to; draw(); return; }
      if ((d = t.closest('[data-rm]'))) {

      }
      if (t.closest('#bReset')) { f = { q: '', st: f.st, cat: [], rec: '', from: '', to: '', noQuote: false, waitPick: false, sort: f.sort }; $('#bqIn').value = ''; sync(); draw(); return; }
      if (!t.closest('.b-pop')) closePops();

    document.addEventListener('click', function (e) { if (!e.target.closest('.b-dd')) closePops(); });
    function sync() { // 팝오버 입력값을 f에 맞춤

      [].forEach.call(card.querySelectorAll('[name="rec"]'), function (i) { i.checked = i.value === f.rec; });

      else if (t.name === 'rec') f.rec = t.value;

    });
    $('#bq').addEventListener('submit', function (e) { e.preventDefault(); f.q = $('#bqIn').value.trim(); draw(); });
    // 진행상태 탭 슬라이드: 양쪽 화살표 + 가장자리 흐림, 마우스 드래그·휠, 터치 스와이프
    var tabs = $('#bTabs'), tw = $('#bTabW');

    }

    tabs.addEventListener('scroll', edges, { passive: true });
    window.addEventListener('resize', edges);
    tabs.addEventListener('wheel', function (e) { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && tabs.scrollWidth > tabs.clientWidth) { e.preventDefault(); tabs.scrollLeft += e.deltaY; } }, { passive: false });
    var drag = null;
    tabs.addEventListener('mousedown', function (e) { drag = { x: e.clientX, l: tabs.scrollLeft, moved: false }; });

    window.addEventListener('mouseup', function () { if (drag && drag.moved) setTimeout(function () { tabs.classList.remove('drag'); }, 0); drag = drag && drag.moved ? { moved: true, end: 1 } : null; setTimeout(function () { drag = null; }, 0); });
    tabs.addEventListener('click', function (e) { if (drag && drag.moved) { e.stopPropagation(); e.preventDefault(); } }, true); // 드래그 끝의 클릭은 탭 선택으로 치지 않음

  // ── 상세 ──

    bind(s);
  }

  // 계약서 등록 (견적 확정 후): 클라이언트·분석파트너 계약서 각각 기본 양식 또는 기관 양식 파일
  function contractHTML(s) {

      '<div class="bar"><p>의뢰서의 분석 서비스 항목은 의뢰한 서비스(' + esc(r.svc) + ')에 맞춰 채워집니다.</p><div class="acts"><button type="button" class="btn primary lg" id="ctSave">계약서 등록 완료</button></div></div></div>';
  }
  function ctPick() {

      var f = row.querySelector('input[type=file]'); row.querySelector('.fn').textContent = f.files[0] ? f.files[0].name : '선택된 파일 없음';

  // 견적제안메일 발송 팝업: 공급사(분석파트너) 회원 리스트에서 골라 프로젝트 링크 + 메시지를 메일·알림으로 보냄
  function mailModal(s) {

    var svcName = function (x) { return x === '바이오의약품' ? '바이오의약품 특성 분석' : x === 'Olink' ? 'Olink 분석' : x + ' 분석'; };
    var orgs = F.PARTNERS.map(function (p) { return p.org; });
    var m = document.createElement('div');
    m.className = 'op-confirm qmail'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', '견적제안메일 발송');

        '<select id="qmOrg"><option value="">소속 전체</option>' + orgs.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select></div>' +
        '<form class="row" id="qmForm"><input type="search" id="qmQ" placeholder="키워드 입력 (성함, 소속, 이메일)"><button type="submit">검색</button></form></div>' +
      '<p class="qm-cnt" id="qmCnt"></p>' +
      '<div class="qm-tbl"><table><thead><tr><th class="ck"><input type="checkbox" id="qmAll" aria-label="전체 선택"></th><th>성함</th><th>소속</th><th>연락처</th><th>이메일</th><th>공급서비스</th><th>상태</th></tr></thead><tbody id="qmBody"></tbody></table></div>' +
      '<div class="qm-pg"><span class="on">1</span></div>' +
      '<textarea id="qmMsg" placeholder="해당 프로젝트의 링크와 함께 메시지가 전달됩니다. 발송할 메시지를 입력하세요."></textarea>' +
      '<div class="btns"><button type="button" class="no">닫기</button><button type="button" class="yes go" id="qmSend" disabled>견적제안발송</button></div></div>';
    document.body.appendChild(m); document.body.style.overflow = 'hidden';
    var q = { svc: '', org: '', kw: '' }; // 기본: 분석 서비스 전체
    var draw = function () {
      var L = F.PARTNERS.filter(function (p) {
        var kw = q.kw.toLowerCase();
        return (!q.svc || p.svc.indexOf(q.svc) > -1) && (!q.org || p.org === q.org) && (!kw || [p.name, p.org, p.mail].join(' ').toLowerCase().indexOf(kw) > -1);
      });

      m.querySelector('#qmBody').innerHTML = L.map(function (p) {
        var sent = s.P[p.key] && !s.P[p.key].self, applied = s.P[p.key] && s.P[p.key].self, off = sent || applied || !p.verified;
        // 상태: button_text (글자만 있는 버튼). 미발송을 누르면 그 행 선택
        var st = !p.verified ? '<button type="button" class="tbtn xs" disabled>미인증</button>' : applied ? '<span class="tbtn xs primary">직접 신청</span>' : sent ? '<span class="tbtn xs primary">발송</span>' : '<button type="button" class="tbtn xs" data-pickrow="' + p.key + '">미발송</button>';
        return '<tr' + (off ? ' class="off"' : '') + '><td class="ck"><input type="checkbox" value="' + p.key + '"' + (off ? ' disabled' : '') + ' aria-label="' + esc(p.org) + ' 선택"></td><td>' + esc(p.name) + '</td><td>' + esc(p.org) + '</td><td>' + esc(p.tel) + '</td><td class="mail">' + esc(p.mail) + '</td><td class="svc">' + p.svc.map(svcName).join(', ') + '</td><td>' + st + '</td></tr>';
      }).join('') || '<tr><td colspan="7" class="none">조건에 맞는 공급사 회원이 없습니다.</td></tr>';
      sync();
    };
    var picked = function () { return [].map.call(m.querySelectorAll('#qmBody input:checked'), function (i) { return i.value; }); };
    var sync = function () { var n = picked().length, b = m.querySelector('#qmSend'); b.disabled = !n; b.textContent = '견적제안발송' + (n ? ' (' + n + ')' : ''); };
    var close = function () { m.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', key); };
    var key = function (e) { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', key);
    m.querySelector('#qmSvc').onchange = function () { q.svc = this.value; draw(); };
    m.querySelector('#qmOrg').onchange = function () { q.org = this.value; draw(); };
    m.querySelector('#qmForm').onsubmit = function (e) { e.preventDefault(); q.kw = m.querySelector('#qmQ').value.trim(); draw(); };
    m.querySelector('#qmAll').onchange = function () { var on = this.checked; [].forEach.call(m.querySelectorAll('#qmBody input:not(:disabled)'), function (i) { i.checked = on; }); sync(); };
    m.querySelector('#qmBody').onchange = sync;
    m.addEventListener('click', function (e) {

      if (e.target === m || e.target.closest('.no') || e.target.closest('.qm-x')) close();
      else if (e.target.closest('#qmSend') && !e.target.closest('#qmSend').disabled) {
        var keys = picked();
        F.send(id, keys, null, m.querySelector('#qmMsg').value.trim());
        close(); OP.toast('견적제안메일을 발송했습니다. (' + keys.length + '곳)'); render();
      }
    });
    draw(); m.querySelector('#qmSvc').focus();
  }

  // 받은 견적
  function quotesHTML(s) {
    var keys = Object.keys(s.P).sort(function (a, b) { return order(s.P[a]) - order(s.P[b]) || s.P[a].at - s.P[b].at; });
    var subs = keys.filter(function (k) { return s.P[k].status === 'sub'; });
    var amt = function (k) { return F.total(s.P[k].quote).final; };
    var low = subs.length > 1 ? subs.reduce(function (a, b) { return amt(b) < amt(a) ? b : a; }) : null;
    var fast = subs.length > 1 ? subs.reduce(function (a, b) { return +s.P[b].quote.weeks < +s.P[a].quote.weeks ? b : a; }) : null;
    var edit = s.st === 'quoting' || s.st === 'sent'; // 클라이언트가 확정하기 전까지 견적 확인·추가 전달 가능
    var badge = function (k) {
      var t = F.pst(s, k);
      var cls = { '작성 대기': 'done', '임시저장': 'done', '제출 완료': 'state', '수정 요청': 'wait', '거절': 'red', '클라이언트 검토 중': 'state', '선정': 'ok', '미선정': 'done' }[t];
      if (s.st === 'matched' && s.P[k].status === 'sub' && !s.P[k].fwd) { t = '전달 안 함'; cls = 'done'; }
      return '<span class="badge ' + cls + '">' + t + '</span>';
    };
    var rows = keys.map(function (k) {
      var x = s.P[k], p = F.partner(k), q = x.quote, sub = x.status === 'sub';
      return '<div class="r' + (s.pick === k ? ' win' : '') + '">' +
        (edit && sub && !x.fwd ? '<input type="checkbox" name="fw" value="' + k + '" checked aria-label="' + esc(p.org) + ' 견적 전달">' : '<span title="' + (x.fwd ? '클라이언트에게 전달함' : '') + '">' + (x.fwd ? '✓' : '') + '</span>') +

        '<div class="st">' + badge(k) + '</div>' +
        '<div class="amt">' + (sub ? F.money(F.total(q).final) + (k === low ? '<span class="hl">최저가</span>' : '') + '<small>VAT 포함</small>' : '-') + (sub ? '<span class="mob">· ' + esc(q.weeks || '-') + '주</span>' : '') + '</div>' +
        '<div class="wk">' + (sub ? esc(q.weeks || '-') + '주' + (k === fast ? '<span class="hl">최단</span>' : '') : '-') + '</div>' +
        '<div class="dt">' + (x.subAt && sub ? md(x.subAt) + ' 제출' : x.status === 'dec' ? md(x.dec.at) + ' 거절' : '마감 ' + dot(s.due).slice(5)) + '</div>' +
        '<div class="act">' + (sub ? '<button type="button" class="btn" data-doc="' + k + '">견적서 보기</button>' + (edit && !x.fwd ? '<button type="button" class="btn" data-rev="' + k + '">수정 요청</button>' : '') : '') + '</div>' +
        (x.status === 'rev' ? '<p class="note rev">수정 요청 · ' + md(x.rev.at) + ' — ' + esc(x.rev.note) + '</p>' : '') +
        (x.status === 'dec' ? '<p class="note">거절 사유 — ' + esc(x.dec.why) + '</p>' : '') +
      '</div>';
    }).join('');
    var c = cnt(s);
    return '<div class="blk" id="quotes">' +
      '<div class="blk-h"><h3>견적서 확인 <span style="color:var(--teal-600)">' + c.sub + '</span> / ' + c.all + '</h3>' + (edit || s.st === 'review' ? '<button type="button" class="btn primary" id="more"><img src="assets/main/ic-mail.svg" alt="" onerror="this.remove()">견적제안메일</button>' : '') + '</div>' +
      '<div class="reqinfo"><span><b>게시</b> ' + F.ymd(s.ok || r.at) + '</span><span><b>견적 마감</b> ' + dot(s.due || r.to) + '</span><span>직접 신청 ' + Object.keys(s.P).filter(function (k) { return s.P[k].self; }).length + ' · 견적제안 ' + Object.keys(s.P).filter(function (k) { return !s.P[k].self; }).length + '</span></div>' +
      (keys.length ? '<div class="qt"><div class="h"><span></span><span>분석파트너</span><span>상태</span><span>최종 견적</span><span>소요</span><span>일자</span><span></span></div>' + rows + '</div>'
        : '<div class="qempty">아직 견적을 작성 중인 분석파트너가 없습니다.<br>인증 분석파트너는 프로젝트 찾기에서 직접 견적을 작성할 수 있고, [견적제안메일]로 적합한 기관에 요청할 수도 있습니다.</div>') +
      (edit && subs.some(function (k) { return !s.P[k].fwd; }) ? '<div class="bar"><p>체크한 견적을 수정 없이 그대로 클라이언트에게 전달합니다. 기관명도 함께 공개됩니다.' + (s.st === 'sent' ? ' 이미 전달한 견적(✓)에 추가됩니다.' : '') + '</p><div class="acts"><button type="button" class="btn primary lg" id="fwd"></button></div></div>' : '') +
      (s.msg && s.st !== 'quoting' ? '<div class="msg"><b>클라이언트에게 전달한 메시지 · ' + F.ymd(s.sentAt) + '</b>' + esc(s.msg) + '</div>' : '') +
    '</div>';
  }
  function order(x) { return { sub: 0, rev: 1, draft: 2, req: 2, dec: 3 }[x.status]; }

  function bind(s) {
    card.onchange = function (e) { if (e.target.name === 'fw') syncFwd(); if (e.target.closest('.ctrow')) ctSync(); };
    ctSync();
    card.onclick = function (e) {
      var t = e.target;
      if (t.closest('[data-pv]')) {

        });
      } else if (t.closest('#approve')) {
        F.ask({ title: '의뢰를 승인할까요?', desc: '"' + r.title + '" 의뢰가 프로젝트로 등록되고, 의뢰사(' + (r.org || '-') + ')에게 승인 알림이 갑니다.', label: false, yes: '승인' }, function () {
          F.approve(id); OP.toast('의뢰를 승인했습니다.'); render();
        });
      } else if (t.closest('#more')) {
        mailModal(s);
      } else if (t.closest('[data-doc]')) {
        var k = t.closest('[data-doc]').dataset.doc; F.showDoc(r, s.P[k].quote, k, F.partner(k).org + ' 견적서');
      } else if (t.closest('[data-rev]')) {
        var k2 = t.closest('[data-rev]').dataset.rev;
        F.ask({ title: F.partner(k2).org + '에 수정 요청', desc: '수정 요청한 견적은 파트너가 다시 제출할 때까지 클라이언트에게 전달할 수 없습니다.', label: '수정 요청 내용', ph: '예) 데이터 분석 항목에 Pathway 분석을 포함해 다시 견적 부탁드립니다.', yes: '수정 요청', required: true }, function (v) {
          F.revise(id, k2, v); OP.toast('수정 요청을 보냈습니다.'); render();
        });
      } else if (t.closest('#fwd')) {
        var fk = [].map.call(card.querySelectorAll('input[name="fw"]:checked'), function (i) { return i.value; });
        F.ask({ title: '견적 ' + fk.length + '건을 클라이언트에게 전달할까요?', desc: fk.map(function (k) { return F.partner(k).org; }).join(', ') + ' 견적을 그대로 전달합니다. 전달한 뒤에는 클라이언트가 견적을 비교하고 분석파트너를 선택합니다.', label: '클라이언트에게 남길 메시지 (선택)', ph: '예) 일정이 급하시면 ○○분석센터를 추천드립니다.', yes: '전달하기' }, function (v) {
          F.forward(id, fk, v); OP.toast('클라이언트에게 견적을 전달했습니다.'); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    };
    syncFwd();
  }
  function syncFwd() {
    var b = $('#fwd'); if (!b) return;
    var n = card.querySelectorAll('input[name="fw"]:checked').length;
    b.disabled = !n; b.textContent = n ? '견적 ' + n + '건 클라이언트에게 ' + (F.state(id).st === 'sent' ? '추가 ' : '') + '전달' : '전달할 견적을 선택해주세요';
  }
  render();
  if (location.hash === '#quotes' && $('#quotes')) setTimeout(function () { $('#quotes').scrollIntoView({ block: 'start' }); }, 60); // 프로젝트 찾기 [견적서] 버튼으로 들어온 경우
})();
</script>
</body>
</html>
