<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>회원가입 · OmicsPharm</title>
<!-- Figma: Signup-Empty (399:30557) · hover (407:30720, 407:30699) -->
<link rel="stylesheet" href="assets/common/site.css?v=20261023n">
<link rel="stylesheet" href="assets/auth/auth.css?v=20261023n">
<script src="assets/common/site.js?v=20261023n"></script>
<script src="assets/auth/auth.js?v=20261023n"></script>
</head>
<body>
<div class="auth">
  <aside data-auth-bg></aside>
  <main class="auth-main">
    <div class="auth-inner" style="gap:24px">
      <div class="auth-form">
        <div class="auth-title"><h1>회원가입</h1></div>
        <div class="roles">
          <a class="role" href="signup-form.html?type=client"><b>클라이언트</b><span>필요한 분석 서비스와 프로젝트를 찾고 싶어요.</span></a>
          <a class="role" href="signup-form.html?type=partner"><b>분석 파트너</b><span>전문 분석 서비스를 제공하고 프로젝트를 수행하고 싶어요.</span></a>
        </div>
      </div>
      <div class="alt"><span>이미 회원이신가요?</span><a href="login.html">로그인하기</a></div>
    </div>
  </main>
</div>
<script>
// 상담 메일 링크에서 온 경우 (?consult=토큰): 회원 유형을 고른 뒤 이름·이메일이 채워진 가입 양식으로
(function () {
  var t = AUTH.param('consult'); if (!t) return;
  [].forEach.call(document.querySelectorAll('.role'), function (a) { a.href += '&consult=' + encodeURIComponent(t); });
  var p = document.createElement('p'); p.className = 'consult-note';
  p.textContent = '가입하면 남기신 상담을 이어서 작성할 수 있습니다. 이름과 이메일은 상담 때 입력한 정보로 채워집니다.';
  document.querySelector('.auth-title').appendChild(p);
})();
</script>
</body>
</html>
