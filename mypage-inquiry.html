<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>프로젝트 문의내역 · 마이페이지 · OmicsPharm</title>
<!-- 마이페이지 > 프로젝트 문의내역 (2026-10-27, Figma 시안 없음). 예전 '문의내역'(챗봇 문의)은 상담내역으로 옮기고, 이 메뉴는 프로젝트별 대화만.
     - 프로젝트 상세 [문의하기]로 시작한 대화 (한 사람당 프로젝트 하나에 대화 하나, 대화 화면은 mypage-consult.html?id=)
     - 의뢰할 때 연결한 Contact Us 상담은 그 대화 맨 위에 '의뢰 전 상담'으로 붙음. 아직 대화가 없으면 '의뢰 전 상담'만 있는 줄로 보임
     - 컨설턴트: 전체 프로젝트 문의 목록 (?project= 이면 그 프로젝트만) -->
<link rel="stylesheet" href="assets/common/site.css?v=20261112b">
<link rel="stylesheet" href="assets/common/mypage.css?v=20261106b">
<script src="assets/common/site.js?v=20261112a"></script>
<script src="assets/common/consult.js?v=20261106b"></script>
<script src="assets/common/mypage.js?v=20261106b"></script>
<script src="assets/common/flow.js?v=20261106b"></script>
<script src="assets/common/projects-data.js?v=20261030a"></script>
<style>
  .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .cs-list { border-top:2px solid #000; }
  .cs-row { display:flex; align-items:center; gap:16px; min-height:72px; padding:14px 16px; border-bottom:1px solid var(--gray-200); }
  .cs-row:hover .t { color:var(--teal-700); }
  .cs-row .st { flex:none; width:76px; }
  .cs-row .mid { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .cs-row .t { font-size:16px; font-weight:500; line-height:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cs-row .sub { font-size:13px; line-height:18px; color:var(--gray-500); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cs-row .dt { flex:none; font-size:14px; color:var(--gray-500); }
  .mg-tbl td.t a:hover { color:var(--teal-700); text-decoration:underline; }
  .lead { font-size:14px; line-height:20px; color:var(--gray-500); }
  @media (max-width:640px) {
    .cs-row { flex-wrap:wrap; gap:6px 10px; padding:14px 4px; }
    .cs-row .st { width:auto; } .cs-row .mid { flex-basis:100%; order:3; } .cs-row .t { white-space:normal; }
    .cs-row .dt { margin-left:auto; font-size:13px; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in">
  <h1>마이페이지</h1>
</div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>
  <div class="main"><section class="card" id="card"></section></div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  // 예전 문의내역 링크(?id=챗봇 문의)는 상담내역의 그 문의로
  var Q = new URLSearchParams(location.search);
  if (Q.get('id')) { location.replace('mypage-consult.html?q=' + encodeURIComponent(Q.get('id'))); return; }
  var me = OP.mypage('inquiry'); if (!me) return;
  var C = OP.consult, esc = C.esc, DV = C.DV, $ = function (s) { return document.querySelector(s); };
  var adm = me.s.role === 'admin', pid = Q.get('project');
  if (!adm) C.claim(me.s.email);
  var projOf = function (rid) {
    var r = OP.flow && OP.flow.req(rid); if (r) return { title: r.title, svc: r.svc };
    var p = OP.my.partnerProjects().filter(function (x) { return x.id === rid; })[0];
    if (p) return { title: p.title, svc: OP.my.svcKo(p.svc) };
    var D = window.OP_PROJECTS, g = D && D.DATA.filter(function (x) { return D.no(x) === rid; })[0]; // 프로젝트 찾기 예시 프로젝트
    return g ? { title: g.title, svc: g.cat } : { title: rid, svc: '' };
  };
  var badge = function (c) { return C.waiting(c) ? '<span class="badge wait">답변대기</span>' : '<span class="badge done">답변완료</span>'; };
  var who = function (m, c) { return m.by === 'admin' ? 'OmicsPharm 컨설턴트: ' : adm ? c.name + ': ' : '나: '; };
  var threads = (adm ? C.all() : C.mine()).filter(C.isProj);

  if (adm) {
    // 프로젝트 상세 [문의하기]로 왔을 때 그 프로젝트 문의가 하나면 목록 없이 바로 대화로. 여러 명(클라이언트+분석파트너)이면 목록 (2026-11-03)
    var one = pid && threads.filter(function (c) { return c.rid === pid; });
    if (one && one.length === 1) { location.replace('mypage-consult.html?id=' + encodeURIComponent(one[0].id)); return; }
    $('#card').innerHTML = '<div class="card-head"><h3>프로젝트 문의내역</h3></div>' +
      '<div class="mg-filter"><select class="mg-sel" id="fSt"><option value="">처리상태</option><option value="wait">답변대기</option><option value="done">답변완료</option></select>' +
        // 분석 서비스 (프로젝트 관리 필터와 같은 7개, 2026-11-03)
        '<select class="mg-sel" id="fSvc"><option value="">분석 서비스</option>' + ['단백체 분석', '대사체 분석', '유전체 분석', '전사체 분석', 'Olink 분석', '바이오의약품·ADC', '기타 분석'].map(function (v) { return '<option>' + v + '</option>'; }).join('') + '</select>' + C.dateBox() +
        '<div class="mg-q" role="search"><input type="search" id="fQ" placeholder="프로젝트명, 성함 검색" aria-label="검색어"><button type="button" id="go" aria-label="검색"><img src="assets/find/ic-search.svg" alt=""></button></div></div>' +
      (pid ? '<p class="lead">프로젝트 <b>' + esc(projOf(pid).title) + '</b>의 문의만 보는 중' + DV + '<a href="mypage-inquiry.html" style="text-decoration:underline">전체 보기</a></p>' : '') +
      '<p class="mg-total">(<b style="color:var(--red-600)" id="nw">0</b>건 답변대기 / 총 <b id="n">0</b>건)</p>' +
      '<div class="mg-wrap"><table class="mg-tbl"><thead><tr><th class="c">번호</th><th>프로젝트</th><th>성함</th><th class="c">회원 유형</th><th class="c">처리상태</th><th class="c">최근 대화</th><th class="c">등록일</th></tr></thead><tbody id="tb"></tbody></table></div>';
    var draw = function () {
      var st = $('#fSt').value, q = $('#fQ').value.trim().toLowerCase(), df = $('#fFrom').value, dt = $('#fTo').value, sv = $('#fSvc').value;
      var A = threads.filter(function (c) { return !pid || c.rid === pid; }).sort(function (a, b) { return C.lastAt(b) - C.lastAt(a); });
      var L = A.filter(function (c) { return C.inRange(c.at, df, dt) && (!sv || String(projOf(c.rid).svc).slice(0, 2) === sv.slice(0, 2)) && (!st || (st === 'wait') === C.waiting(c)) && (!q || [projOf(c.rid).title, c.rid, c.name].join(' ').toLowerCase().indexOf(q) > -1); });
      $('#n').textContent = A.length; $('#nw').textContent = A.filter(C.waiting).length;
      $('#tb').innerHTML = L.length ? L.map(function (c, i) {
        var acc = OP.account(c.owner || c.email), pre = C.pre(c.rid, c.owner || c.email).length;
        // 제목 열은 뺌 (2026-11-02): 프로젝트 문의는 제목 입력이 없고 프로젝트명이 제목. 프로젝트명 아래 분석 서비스 | 프로젝트 번호 (기존 사이트 '분석 서비스' 열, 2026-11-03)
        return '<tr><td class="c">' + (L.length - i) + '</td><td class="t"><a href="mypage-consult.html?id=' + encodeURIComponent(c.id) + '">' + esc(projOf(c.rid).title) + '</a><br><small>' + (projOf(c.rid).svc ? esc(projOf(c.rid).svc) + DV : '') + esc(c.rid) + (pre ? DV + '의뢰 전 상담 ' + pre + '건 연결' : '') + '</small></td>' +
          '<td>' + esc(c.name) + '</td><td class="c">' + (acc ? OP.ROLE_LABEL[acc.role] || '' : '-') + '</td><td class="c">' + badge(c) + '</td><td class="c">' + C.ymd(C.lastAt(c)) + '</td><td class="c">' + C.ymd(c.at) + '</td></tr>';
      }).join('') : '<tr><td colspan="7" class="mg-empty">프로젝트 문의가 없습니다.</td></tr>';
    };
    ['fSt', 'fSvc', 'fFrom', 'fTo'].forEach(function (k) { $('#' + k).addEventListener('change', draw); }); $('#go').addEventListener('click', draw);
    $('#fQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') draw(); });
    draw();
    return;
  }

  // 회원: 내 프로젝트 문의 + 대화는 아직 없지만 의뢰 전 상담이 연결된 프로젝트
  var rows = threads.map(function (c) { return { c: c, rid: c.rid, at: C.lastAt(c), wait: C.waiting(c) }; });
  var has = rows.map(function (o) { return o.rid; });
  C.mine().filter(function (c) { return C.PRE && c.link && has.indexOf(c.link) < 0; }).forEach(function (c) {
    var o = rows.filter(function (x) { return !x.c && x.rid === c.link; })[0];
    if (o) { o.n++; o.at = Math.max(o.at, C.lastAt(c)); } else rows.push({ rid: c.link, at: C.lastAt(c), wait: false, n: 1 });
  });
  rows.sort(function (a, b) { return b.at - a.at; });
  var f = 'all', T = [['all', '전체'], ['wait', '답변대기'], ['done', '답변완료']];
  var ok = function (o, k) { return k === 'all' || (k === 'wait') === o.wait; };
  $('#card').innerHTML = '<div class="card-head"><h3>프로젝트 문의내역</h3></div>' +
    '<div class="bar"><div class="chips" id="chips" role="tablist"></div><a class="btn" href="mypage-project.html">프로젝트 관리</a></div>' +
    (C.PRE ? '<p class="lead">의뢰할 때 연결한 상담도 함께 볼 수 있습니다.</p>' : '') + '<div id="list"></div>'; // 안내 문장 뺌 (2026-11-02)
  var draw2 = function () {
    $('#chips').innerHTML = T.map(function (t) { return '<button type="button" role="tab" data-f="' + t[0] + '"' + (f === t[0] ? ' class="on" aria-selected="true"' : '') + '>' + t[1] + '<span>' + rows.filter(function (o) { return ok(o, t[0]); }).length + '</span></button>'; }).join('');
    var L = rows.filter(function (o) { return ok(o, f); });
    $('#list').innerHTML = L.length ? '<div class="cs-list">' + L.map(function (o) {
      var P = projOf(o.rid);
      if (!o.c) return '<a class="cs-row" href="mypage-consult.html?project=' + encodeURIComponent(o.rid) + '"><span class="st"><span class="badge done">상담 연결</span></span>' +
        '<span class="mid"><span class="t">' + esc(P.title) + '</span><span class="sub">' + esc(P.svc) + DV + '의뢰 전 상담 ' + o.n + '건 연결' + DV + '아직 프로젝트 문의는 없습니다</span></span><span class="dt">' + C.ymd(o.at) + '</span></a>';
      var c = o.c, m = c.msgs[c.msgs.length - 1], pre = C.pre(c.rid, me.s.email).length;
      return '<a class="cs-row" href="mypage-consult.html?id=' + encodeURIComponent(c.id) + '"><span class="st">' + badge(c) + '</span>' +
        '<span class="mid"><span class="t">' + esc(P.title) + '</span><span class="sub">' + esc(P.svc) + (pre ? DV + '의뢰 전 상담 ' + pre + '건' : '') + DV + who(m, c) + esc((m.text || '첨부 ' + m.file).replace(/\s+/g, ' ')) + '</span></span>' +
        '<span class="dt">' + C.ymd(o.at) + '</span></a>';
    }).join('') + '</div>' : '<div class="empty"><b>' + (f === 'all' ? '프로젝트 문의가 없습니다' : '해당하는 문의가 없습니다') + '</b><p>프로젝트 상세에서 [문의하기]를 누르면 OmicsPharm 컨설턴트에게 문의할 수 있습니다.</p></div>';
  };
  $('#chips').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { f = b.dataset.f; draw2(); } });
  draw2();
})();
</script>
</body>
</html>
