<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>상담 내용 · OmicsPharm</title>
<!-- 상담 메일 링크로 들어오는 화면 (비회원). ?t=링크 토큰 (assets/common/consult.js)
     가입 전에는 보기만. 추가 상담은 회원가입(이름·이메일 자동 입력) / 이미 회원인 이메일이면 로그인 → 마이페이지 > 상담내역에서 이어서
     링크 유효기간 7일 (미정). 지나면 만료 화면 + 이메일로 새 링크 받기. 로그인한 본인이면 상담내역으로 바로 이동 -->
<link rel="stylesheet" href="assets/common/site.css?v=20261022g">
<link rel="stylesheet" href="assets/common/consult.css?v=20261022g">
<script src="assets/common/site.js?v=20261022g"></script>
<script src="assets/common/consult.js?v=20261022g"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fff; color:#000; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button, input { font:inherit; color:inherit; }
  button { background:none; border:0; cursor:pointer; }
  [hidden] { display:none !important; }
  .page-head { padding:64px 60px 40px; text-align:center; }
  .page-head h1 { font-size:50px; font-weight:700; line-height:64px; letter-spacing:-.5px; }
  .page-head p { margin-top:12px; font-size:16px; line-height:22px; color:#525252; }
  .body { padding:0 60px 80px; }
  .in { max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:24px; }
  .top { display:flex; flex-direction:column; gap:8px; }
  .top .tags { display:flex; flex-wrap:wrap; gap:6px; font-size:13px; line-height:18px; color:#737373; }
  .top .tags span + span::before { content:"·"; margin-right:6px; }
  .top h2 { font-size:24px; font-weight:700; line-height:32px; letter-spacing:-.24px; }
  .badge { display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:6px; font-size:12px; font-weight:600; }
  .badge.wait { background:#fff7ed; color:#c2410c; } .badge.done { background:#edfefa; color:#00786e; }
  .cta { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 24px; border:1px solid #e5e5e5; border-radius:16px; }
  .cta b { display:block; font-size:16px; font-weight:600; line-height:22px; }
  .cta p { margin-top:4px; font-size:14px; line-height:20px; color:#737373; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 20px; border-radius:8px; font-size:15px; font-weight:500; white-space:nowrap; }
  .btn.pri { background:#009788; color:#fff; } .btn.pri:hover { background:#00786e; }
  .btn.line { border:1px solid #d4d4d4; background:#fff; color:#525252; }
  .meta { font-size:13px; line-height:18px; color:#a3a3a3; text-align:right; }
  .box { display:flex; flex-direction:column; align-items:center; gap:16px; padding:56px 24px; border:1px solid #e5e5e5; border-radius:16px; text-align:center; }
  .box h2 { font-size:22px; font-weight:700; line-height:30px; }
  .box p { font-size:15px; line-height:22px; color:#525252; word-break:keep-all; }
  .box form { display:flex; gap:8px; width:100%; max-width:440px; }
  .box input { flex:1; min-width:0; height:48px; padding:0 16px; border:1px solid #d4d4d4; border-radius:8px; font-size:15px; }
  .box input:focus { outline:0; border-color:#00786e; box-shadow:0 0 0 3px #00786e33; }
  .box .sent { font-size:14px; color:#00786e; }
  .box .sent a { text-decoration:underline; }
  @media (max-width:1180px) { .page-head, .body { padding-left:24px; padding-right:24px; } }
  @media (max-width:640px) {
    .page-head, .body { padding-left:16px; padding-right:16px; }
    .page-head { padding-top:40px; padding-bottom:24px; }
    .page-head h1 { font-size:32px; line-height:42px; }
    .page-head p { font-size:14px; line-height:20px; }
    .top h2 { font-size:20px; line-height:28px; }
    .cta { flex-direction:column; align-items:stretch; padding:20px 16px; }
    .box { padding:40px 16px; }
    .box form { flex-direction:column; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head">
  <h1>상담 내용</h1>
  <p>OmicsPharm 컨설턴트와 나눈 상담을 확인할 수 있습니다.</p>
</section>

<main class="body"><div class="in" id="view"></div></main>

<div data-op-footer></div>

<script>
(function () {
  var C = OP.consult, esc = C.esc, v = document.getElementById('view');
  var c = C.byToken(new URLSearchParams(location.search).get('t')), s = OP.session();

  // 링크가 없거나 기간이 지남 → 이메일로 새 링크 받기 (회원이면 로그인해서 상담내역으로)
  if (!c || C.expired(c)) {
    v.innerHTML = '<div class="box"><h2>링크가 만료되었습니다</h2>' +
      '<p>상담 보기 링크는 발송 후 ' + C.LINK_DAYS + '일 동안 사용할 수 있습니다.<br>상담하실 때 입력한 이메일을 적어주시면 새 링크를 보내드립니다.</p>' +
      '<form id="renew" novalidate><input type="email" id="em" placeholder="email@domain.com" value="' + esc(c ? c.email : '') + '" aria-label="이메일"><button class="btn pri" type="submit">새 링크 받기</button></form>' +
      '<p class="sent" id="sent" hidden></p>' +
      '<p style="font-size:13px;color:#a3a3a3">회원이시면 <a href="login.html?next=mypage-consult.html" style="text-decoration:underline">로그인</a> 후 마이페이지 &gt; 상담내역에서 볼 수 있습니다.</p></div>';
    document.getElementById('renew').addEventListener('submit', function (e) {
      e.preventDefault();
      var em = document.getElementById('em').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)) { OP.toast('올바른 이메일 형식으로 입력해주세요.'); return; }
      var x = C.renew(em), sent = document.getElementById('sent');
      // 해당 이메일의 상담이 없어도 같은 안내 (다른 사람이 상담 여부를 알 수 없게)
      sent.innerHTML = esc(em) + '(으)로 새 링크를 보냈습니다. 메일함을 확인해주세요.' + (x ? ' <a href="mail-consult.html?t=' + encodeURIComponent(x.token) + '&k=renew">받은 메일 보기 (데모)</a>' : '');
      sent.hidden = false;
    });
    return;
  }
  // 로그인한 본인 → 상담내역에서 이어서
  if (s && s.email === c.email) { location.replace('mypage-consult.html?id=' + encodeURIComponent(c.id)); return; }

  var member = !!OP.account(c.email);
  var next = 'mypage-consult.html?id=' + encodeURIComponent(c.id);
  v.innerHTML =
    '<div class="top"><div class="tags"><span>' + esc(c.type) + (c.svc ? ' · ' + esc(c.svc) : '') + '</span><span>접수번호 ' + esc(c.id) + '</span><span>' + C.ymd(c.at) + ' 접수</span></div>' +
      '<h2>' + esc(c.title) + ' ' + (C.waiting(c) ? '<span class="badge wait">답변대기</span>' : '<span class="badge done">답변완료</span>') + '</h2></div>' +
    C.thread(c, 'user') +
    (C.waiting(c) ? '<p class="meta">OmicsPharm 컨설턴트가 확인하고 있습니다. 답변이 등록되면 메일로 알려드립니다.</p>' : '') +
    '<div class="cta"><div><b>추가로 상담하시겠어요?</b><p>' + (member
        ? '이미 가입된 이메일입니다. 로그인하면 마이페이지 &gt; 상담내역에서 이 상담을 이어서 작성할 수 있습니다.'
        : '회원가입 후 이 상담을 이어서 작성할 수 있습니다. 이름과 이메일은 자동으로 입력되고, 이메일 인증은 필요 없습니다.') + '</p></div>' +
      (member ? '<a class="btn pri" href="login.html?email=' + encodeURIComponent(c.email) + '&next=' + encodeURIComponent(next) + '">로그인하고 이어서 상담하기</a>'
              : '<a class="btn pri" href="signup.html?consult=' + encodeURIComponent(c.token) + '">회원가입하고 이어서 상담하기</a>') + '</div>' +
    '<p class="meta">이 링크는 ' + C.ymd(C.linkUntil(c)) + '까지 사용할 수 있습니다.</p>';
})();
</script>
</body>
</html>
