<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>비밀번호 찾기 · OmicsPharm</title>
<!-- Figma: 비밀번호 찾기 (1121:44259) -->
<link rel="stylesheet" href="assets/common/site.css?v=20261001u">
<link rel="stylesheet" href="assets/auth/auth.css?v=20261001u">
<script src="assets/common/site.js?v=20261001u"></script>
<script src="assets/auth/auth.js?v=20261001u"></script>
</head>
<body>
<div class="auth">
  <aside data-auth-bg></aside>
  <main class="auth-main">
    <div class="auth-inner">
      <form class="auth-form" id="form" novalidate>
        <div class="auth-title">
          <h1>비밀번호 찾기</h1>
          <p>회원정보에 입력하신 이메일 주소로 새롭게 변경된 비밀번호를 보내드립니다.</p>
        </div>
        <div class="auth-body">
          <div class="fields">
            <div class="field" id="f-email">
              <label for="email">Work email<span class="req">*</span></label>
              <div class="input"><input id="email" type="email" autocomplete="username" placeholder="email@domain.com"></div>
            </div>
            <div class="field" id="f-name">
              <label for="name">이름<span class="req">*</span></label>
              <div class="input"><input id="name" type="text" autocomplete="name" placeholder="이름을 입력해주세요"></div>
            </div>
          </div>
          <button class="btn-action" type="submit">임시 비밀번호 발송</button>
        </div>
      </form>
      <div class="alt"><a href="login.html">로그인으로 돌아가기</a></div>
    </div>
  </main>
</div>
<script>
  var email = document.getElementById('email'), name = document.getElementById('name');
  [email, name].forEach(function (i) { i.addEventListener('input', function () { AUTH.setError(i.closest('.field'), ''); }); });
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = email.value.trim(), ok = true;
    if (!v) { AUTH.setError(document.getElementById('f-email'), '이메일을 입력해주세요.'); ok = false; }
    else if (!AUTH.EMAIL_RE.test(v)) { AUTH.setError(document.getElementById('f-email'), '올바른 이메일 형식으로 입력해주세요.'); ok = false; }
    if (!name.value.trim()) { AUTH.setError(document.getElementById('f-name'), '이름을 입력해주세요.'); ok = false; }
    if (!ok) return;
    OP.toast('임시 비밀번호를 발송했습니다. (데모 — 실제 메일은 발송되지 않습니다)');
  });
</script>
</body>
</html>
