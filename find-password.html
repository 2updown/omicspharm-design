<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>비밀번호 찾기 · OmicsPharm</title>
<!-- Figma: 비밀번호 찾기 (1121:44259) -->
<link rel="stylesheet" href="assets/common/site.css?v=20261007t">
<link rel="stylesheet" href="assets/auth/auth.css?v=20261007t">
<script src="assets/common/site.js?v=20261007t"></script>
<script src="assets/auth/auth.js?v=20261007t"></script>
</head>
<body>
<div class="auth">
  <aside data-auth-bg></aside>
  <main class="auth-main">
    <div class="auth-inner">
      <form class="auth-form" id="form" novalidate>
        <div class="auth-title">
          <h1>비밀번호 찾기</h1>
          <p>회원정보에 입력하신 이메일 주소로 새롭게 변경된 비밀번호를 보내드립니다.</p>
        </div>
        <div class="auth-body">
          <div class="fields">
            <div class="field" id="f-email">
              <label for="email">Work email<span class="req">*</span></label>
              <div class="input"><input id="email" type="email" autocomplete="username" placeholder="email@domain.com"></div>
            </div>
            <div class="field" id="f-name">
              <label for="name">Name<span class="req">*</span></label>
              <div class="input"><input id="name" type="text" autocomplete="name" placeholder="이름을 입력해주세요"></div>
            </div>
          </div>
          <button class="btn-action" type="submit">임시 비밀번호 발송</button>
        </div>
      </form>
      <div class="alt"><a href="login.html">로그인으로 돌아가기</a></div>
      <!-- 로그인 도움말 (Figma 1440:21375 info_box) -->
      <div class="info-box">
        <p class="ib-t">로그인에 문제가 있으신가요?</p>
        <ul>
          <li>인증 메일이 오지 않으면 스팸함을 확인해주세요.</li>
          <li>가입 이메일 찾기 및 기타 문의: <a href="mailto:contact@omicspharm.com">contact@omicspharm.com</a></li>
        </ul>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var email = document.getElementById('email'), nameIn = document.getElementById('name'); // 'name'은 window.name과 겹쳐서 nameIn
  [email, nameIn].forEach(function (i) { i.addEventListener('input', function () { AUTH.setError(i.closest('.field'), ''); }); });
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = email.value.trim(), ok = true;
    if (!v) { AUTH.setError(document.getElementById('f-email'), '이메일을 입력해주세요.'); ok = false; }
    else if (!AUTH.EMAIL_RE.test(v)) { AUTH.setError(document.getElementById('f-email'), '올바른 이메일 형식으로 입력해주세요.'); ok = false; }
    if (!nameIn.value.trim()) { AUTH.setError(document.getElementById('f-name'), '이름을 입력해주세요.'); ok = false; }
    if (!ok) return;
    // 기존 안내 문구 그대로 (데모: 실제 메일은 발송되지 않음)
    OP.toast('[' + v + '] 고객님이 가입하신 메일로 임시 비밀번호를 발송하였습니다.', { title: '임시 비밀번호 발송 완료', type: 'success' });
  });
})();
</script>
</body>
</html>
