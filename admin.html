<!-- 백오피스 어드민 (프로토타입). 기존 백오피스(omicspharm.com/admin) 구성 기준, 별도 디자인 없이 깔끔한 관리 화면.
     메뉴: 관리자 메인 / 설정(기본설정·팝업·배너·약관) / 컨텐츠 관리(메뉴·헤더·하단) / 게시판 관리 / 회원(리스트·탈퇴·접속이력·등급) / 알림 설정(메일 발송 로그·알림톡 발송 내역)
     빠진 메뉴: SEO 설정, 모듈 관리 (2026-10-14 기준, 확정 아님). 분석파트너 인증 처리는 컨설턴트 마이페이지 > 분석파트너 관리.
     화면 이동: admin.html#페이지키. 예시 값은 모두 가상 -->
<link rel="stylesheet" href="assets/common/site.css?v=20261024k">
<script src="assets/common/site.js?v=20261024k"></script>
<style>
  :root { --nav:#1b2440; --nav2:#141b33; --line:#e5e7eb; --bg:#f3f4f6; --ink:#111827; --mute:#6b7280; --acc:#1d3a8a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; font-size:14px; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; } button, input, select, textarea { font:inherit; color:inherit; }
  .app { display:flex; min-height:100vh; }
  /* 사이드바 */
  .nav { width:210px; flex:none; background:var(--nav); color:#c7cde0; position:sticky; top:0; height:100vh; overflow:auto; }
  .nav .brand { padding:20px 16px; text-align:center; color:#fff; font-weight:700; font-size:15px; line-height:20px; }
  .nav .brand small { display:block; font-size:12px; font-weight:500; opacity:.7; }
  .nav ul { list-style:none; }
  .nav .g > a { display:flex; align-items:center; gap:10px; height:42px; padding:0 18px; font-size:14px; font-weight:500; }
  .nav .g > a:hover, .nav .g.open > a { background:var(--nav2); color:#fff; }
  .nav .g > a i { margin-left:auto; font-style:normal; font-size:11px; opacity:.6; transition:transform .15s; }
  .nav .g.open > a i { transform:rotate(90deg); }
  .nav .sub { display:none; padding:4px 0 8px; background:var(--nav2); }
  .nav .g.open .sub { display:block; }
  .nav .sub a { display:block; padding:8px 18px 8px 40px; font-size:13px; color:#9aa3bd; }
  .nav .sub a:hover { color:#fff; }
  .nav .sub a.on, .nav .g > a.on { color:#fff; }
  .nav .sub a.on::before { content:"· "; }
  /* 상단 바 */
  .wrap { flex:1; min-width:0; display:flex; flex-direction:column; }
  .top { height:56px; display:flex; align-items:center; gap:10px; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .top select { height:32px; padding:0 10px; border:1px solid var(--line); border-radius:4px; background:#fff; font-size:13px; }
  .top .site { display:inline-flex; align-items:center; height:32px; padding:0 12px; border-radius:4px; background:var(--acc); color:#fff; font-size:13px; font-weight:500; }
  .top .me { margin-left:auto; font-size:13px; color:var(--mute); }
  .top .out { height:32px; padding:0 12px; border:1px solid var(--line); border-radius:4px; background:#fff; font-size:13px; cursor:pointer; }
  main { padding:24px; display:flex; flex-direction:column; gap:20px; }
  h1 { font-size:20px; font-weight:700; }
  .box { background:#fff; border:1px solid var(--line); padding:24px; display:flex; flex-direction:column; gap:16px; }
  .box h2 { font-size:16px; font-weight:700; padding-left:10px; border-left:3px solid var(--ink); line-height:16px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row.end { justify-content:flex-end; }
  .in { height:34px; padding:0 10px; border:1px solid var(--line); border-radius:4px; background:#fff; font-size:13px; }
  .btn { height:34px; padding:0 14px; border:1px solid var(--line); border-radius:4px; background:#fff; font-size:13px; cursor:pointer; }
  .btn.dark { background:#111; border-color:#111; color:#fff; }
  .btn.blue { background:var(--acc); border-color:var(--acc); color:#fff; }
  /* 표 */
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { height:38px; padding:0 10px; background:#f9fafb; border-top:1px solid var(--line); border-bottom:1px solid var(--line); font-weight:500; color:#374151; text-align:center; white-space:nowrap; }
  td { padding:10px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle; word-break:keep-all; }
  td.l { text-align:left; } td.pre { white-space:pre-line; text-align:left; max-width:320px; color:#374151; }
  .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; background:#eef2ff; color:var(--acc); }
  .tag.gray { background:#f3f4f6; color:var(--mute); } .tag.red { background:#fef2f2; color:#b91c1c; } .tag.green { background:#ecfdf5; color:#047857; }
  .total { font-size:13px; color:var(--mute); } .total b { color:var(--ink); }
  .pager { display:flex; justify-content:center; gap:4px; }
  .pager span { display:grid; place-items:center; width:30px; height:30px; border:1px solid var(--line); border-radius:4px; font-size:12px; background:#fff; }
  .pager span.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  /* 폼 */
  .form { display:grid; grid-template-columns:160px 1fr; border-top:1px solid var(--line); }
  .form > * { padding:10px 12px; border-bottom:1px solid var(--line); }
  .form .k { background:#f9fafb; font-weight:500; display:flex; align-items:center; }
  .form .in { width:100%; max-width:420px; }
  /* 대시보드 차트 */
  .charts { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:20px; }
  .chart h3 { font-size:13px; font-weight:500; margin-bottom:8px; color:#374151; }
  .chart .area { height:140px; border-bottom:1px solid var(--line); position:relative; }
  .bars { display:flex; flex-direction:column; justify-content:space-around; height:140px; }
  .bars div { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--mute); }
  .bars div span { width:64px; flex:none; text-align:right; }
  .bars div i { height:12px; border-radius:2px; background:#e8a26a; }
  .bars.v i { background:#7f8fd6; }
  .donut { width:120px; height:120px; margin:10px auto 0; border-radius:50%; background:conic-gradient(#e8a26a 0 64%, #e46b6b 64% 100%); position:relative; }
  .donut::after { content:""; position:absolute; inset:30px; border-radius:50%; background:#fff; }
  .legend { display:flex; gap:10px; justify-content:center; margin-top:8px; font-size:11px; color:var(--mute); }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:4px; vertical-align:-1px; }
  .empty { padding:40px; text-align:center; color:var(--mute); }
  .note { font-size:12px; color:var(--mute); }
  @media (max-width:1100px) { .charts { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:800px) { .nav { display:none; } .form { grid-template-columns:1fr; } }
</style>
</head>

  function nav(cur) {
    $('#nav').innerHTML = '<div class="brand">오믹스팜<small>admin</small></div><ul>' + NAV.map(function (n) {
      if (typeof n[1] === 'string') return '<li class="g"><a href="#' + n[0] + '"' + (cur === n[0] ? ' class="on"' : '') + '>▦ ' + n[1] + '<i>›</i></a></li>';
      var open = n[1].some(function (x) { return x[0] === cur; });
      return '<li class="g' + (open ? ' open' : '') + '"><a href="#" data-g>' + n[0] + '<i>›</i></a><div class="sub">' + n[1].map(function (x) { return '<a href="#' + x[0] + '"' + (cur === x[0] ? ' class="on"' : '') + '>' + x[1] + '</a>'; }).join('') + '</div></li>';
    }).join('') + '</ul>';
  }
  $('#nav').addEventListener('click', function (e) { var g = e.target.closest('[data-g]'); if (g) { e.preventDefault(); g.parentNode.classList.toggle('open'); } });
  function route() {
    var k = location.hash.slice(1) || 'dash'; if (!PAGES[k]) k = 'dash';
    nav(k); $('#main').innerHTML = PAGES[k](); document.title = TITLE[k] + ' · OmicsPharm Admin'; scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route); route();
})();
