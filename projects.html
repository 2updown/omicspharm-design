<style>

  /* ── 왼쪽 필터 ── */
  .side { width:343px; flex:none; display:flex; flex-direction:column; gap:24px; position:sticky; top:94px; }
  .panel { display:flex; flex-direction:column; gap:24px; padding:24px; background:#fff; border:1px solid var(--gray-200); border-radius:16px; }
  .panel.cta { box-shadow:0 0 1px rgba(0,0,0,.04), 0 4px 4px rgba(0,0,0,.08); }

  .seg { display:flex; border:1px solid var(--gray-300); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; height:40px; padding:0 10px; background:#fff; font-size:14px; font-weight:500; line-height:20px; }
  .seg button:hover { background:var(--gray-50); }
  .seg button.on { background:var(--teal-600); color:#fff; }
  .group h3 { font-size:16px; font-weight:500; line-height:22px; margin-bottom:12px; }
  .checks { display:flex; flex-wrap:wrap; gap:12px; }
  .check { display:inline-flex; align-items:center; gap:8px; font-size:14px; line-height:20px; cursor:pointer; user-select:none; position:relative; }
  .check input { position:absolute; opacity:0; width:0; height:0; }
  .check i { width:20px; height:20px; flex:none; background:url(assets/auth/checkbox-off.svg) center/contain no-repeat; }
  .check input:checked + i { background-image:url(assets/auth/checkbox-on.svg); }
  .check input:checked ~ span { font-weight:500; }
  .check input:focus-visible + i { outline:2px solid var(--teal-600); outline-offset:2px; border-radius:4px; }
  .range-head { display:flex; justify-content:space-between; align-items:flex-start; }

  .range-head span { font-size:14px; font-weight:500; line-height:20px; color:var(--gray-500); }

  .range .fill { position:absolute; top:9px; height:6px; border-radius:10px; background:var(--teal-600); }
  .range input { position:absolute; left:-10px; width:calc(100% + 20px); top:0; height:24px; margin:0; background:none; pointer-events:none; -webkit-appearance:none; appearance:none; }
  .range input::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:20px; height:20px; border-radius:50%; background:#fff; border:1.5px solid var(--teal-500); box-shadow:0 2px 4px rgba(0,0,0,.12); cursor:grab; }

  .cta .t b img { width:24px; height:24px; }
  .cta .t p { font-size:14px; line-height:20px; }
  .btn-filled { display:flex; align-items:center; justify-content:center; gap:4px; height:48px; padding:0 16px; border-radius:8px; background:var(--teal-600); color:#fff; font-size:16px; font-weight:500; line-height:22px; }

  /* ── 오른쪽 목록 ── */

  .search img { width:20px; height:20px; }
  .results { display:flex; flex-direction:column; gap:8px; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; height:40px; }

  .tools { display:flex; align-items:center; gap:12px; height:100%; }
  .tools .vline { width:0; height:100%; border-left:1px solid var(--gray-200); }
  .tip-wrap { position:relative; }
  /* 툴팁 (Figma tooltip 1424:14012). 위에 띄우므로 꼬리는 아래쪽 */
  .tip { position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%); width:max-content; min-width:102px; max-width:242px; padding:4px 8px; border-radius:4px; background:#1b1b1b; color:#fff;
    font-size:14px; font-weight:500; line-height:20px; text-align:center; word-break:keep-all; display:none; z-index:5; }
  .tip::after { content:""; position:absolute; left:50%; top:100%; transform:translateX(-50%); border:3px solid transparent; border-bottom:0; border-top-color:#1b1b1b; }
  /* 문구에 마우스를 올렸을 때만 표시 (클릭·체크 후에는 남지 않음). 키보드 이동 시에는 포커스 표시 중에만 */
  .tip-wrap .tl:hover + .tip, .tip-wrap:has(input:focus-visible) .tip { display:block; }
  .select { position:relative; }
  .select select { height:40px; padding:0 40px 0 16px; border:1px solid var(--gray-300); border-radius:8px; background:#fff; font-size:14px; line-height:20px; appearance:none; -webkit-appearance:none; cursor:pointer; }
  .select::after { content:""; position:absolute; right:16px; top:12px; width:16px; height:16px; background:url(assets/find/ic-chevron-down.svg) center/contain no-repeat; pointer-events:none; }
  .select select:focus-visible { outline:0; border-color:var(--teal-700); box-shadow:0 0 0 3px #00786e33; }
  .views { display:flex; gap:4px; }
  .views button { width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; }

  .badge.open { background:var(--orange-600); color:#fff; }
  .badge.closed { background:var(--gray-600); color:#fff; }
  .badges { display:flex; gap:8px; align-items:center; }
  .lock { width:22px; height:22px; }

  /* 목록형 카드 (Project-list Type=card) */
  .lcard { display:flex; flex-direction:column; gap:16px; padding:16px 12px; background:#fff; border:1px solid var(--gray-200); border-radius:12px; transition:border-color .15s, box-shadow .15s; }
  a.lcard:hover { border-color:var(--teal-500); box-shadow:var(--shadow2); }
  .lcard .head { display:flex; flex-direction:column; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--gray-200); }
  .lcard.private .head { padding-bottom:0; border-bottom:0; }
  .lcard .row1 { display:flex; align-items:center; justify-content:space-between; }
  .lcard .dday { font-size:12px; line-height:18px; letter-spacing:-.12px; color:var(--gray-500); }
  .lcard h3 { font-size:20px; font-weight:600; line-height:28px; letter-spacing:-.2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .lcard .info { display:flex; flex-direction:column; gap:10px; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:12px; font-size:14px; line-height:20px; }
  .meta > span { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .meta > span + span::before { content:""; width:0; height:14px; border-left:1px solid var(--gray-300); margin-right:4px; }
  .meta em { font-style:normal; color:var(--gray-500); }
  .meta img { width:20px; height:20px; }
  .lcard .reg { font-size:12px; line-height:18px; letter-spacing:-.12px; color:#9b9b9b; }
  .lcard.private .reg { font-size:14px; line-height:20px; }

  /* 그리드형 카드 (Project-card Type=card) */
  .gcard { display:flex; flex-direction:column; gap:16px; padding:4px 4px 16px; background:#fff; border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; transition:border-color .15s, box-shadow .15s; }
  a.gcard:hover { border-color:var(--teal-500); box-shadow:var(--shadow2); }
  .gcard .top { display:flex; flex-direction:column; gap:12px; padding:16px 12px; border-bottom:1px solid var(--gray-200); }
  .gcard.private .top { border-bottom:0; border-radius:8px; background:linear-gradient(99.06deg, #f6f9f8 10.77%, #eff2f1 100.96%); }
  .gcard .row1 { display:flex; align-items:center; justify-content:space-between; }
  .gcard h3 { height:56px; font-size:20px; font-weight:600; line-height:28px; letter-spacing:-.2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .gcard .rows { display:flex; flex-direction:column; gap:4px; padding:0 12px; font-size:14px; line-height:20px; }

  .gcard .rows em { font-style:normal; color:var(--gray-500); white-space:nowrap; }
  .gcard .reg { font-size:12px; line-height:18px; letter-spacing:-.12px; color:#9b9b9b; }

  /* 목록형 B안 (831:3469): 검색·툴바·목록·페이지를 흰 박스 하나로 */
  /* 그리드형 기본: Figma Find Projects2-grid (1425:18464). 카드마다 오른쪽·아래 선(gray-300), 박스 가장자리까지 붙임. 기존 박스 안 카드형은 ?grid=a */
  .main.boxed .grid.lines { gap:0; padding:0; border-top:1px solid var(--gray-300); } /* 툴바와 간격 8px (.results gap), 첫 줄 위에도 선 */
  .grid.lines > .gcard, .grid.lines > .gfill { gap:16px; padding:4px 4px 16px; border:0; border-right:1px solid var(--gray-300); border-bottom:1px solid var(--gray-300); border-radius:0; box-shadow:none; background:#fff; transition:background .15s; }
  .grid.lines > :nth-child(3n) { border-right:0; } /* 마지막 열은 박스 테두리와 겹치지 않게 */
  .grid.lines > a.gcard:hover { border-color:var(--gray-300); background:var(--gray-50); box-shadow:none; }
  .grid.lines > a.gcard:hover h3 { color:var(--teal-700); }
  .grid.lines .gcard .top { gap:12px; padding:16px 12px; border-bottom:1px solid var(--gray-200); border-radius:0; }
  .grid.lines .gcard.private .top { border-bottom:1px solid var(--gray-200); } /* 비공개도 제목 아래 선 유지 (카드 높이 동일) */
  .grid.lines .gcard .rows { padding:0 12px; }
  @media (max-width:1180px) {
    .grid.lines > :nth-child(3n) { border-right:1px solid var(--gray-300); }
    .grid.lines > :nth-child(2n) { border-right:0; }
  }
  @media (max-width:640px) {
    .main.boxed .grid.lines { padding:0; }
    .grid.lines > .gcard, .grid.lines > .gfill { border-right:0; }
  }
  .main.boxed { gap:24px; padding:24px 0; background:#fff; border:1px solid var(--gray-200); border-radius:16px; margin-bottom:24px; }
  .main.boxed .search { margin:0 24px; }
  .main.boxed .toolbar { padding:0 24px; }
  .main.boxed .list { gap:0; }
  .main.boxed .grid { gap:4px; padding:0 28px; }
  .grid .empty { grid-column:1 / -1; }
  .main.boxed .empty { border:0; border-top:1px solid var(--gray-300); border-radius:0; }
  .lrow { display:flex; flex-direction:column; gap:16px; padding:16px 24px; border-top:1px solid var(--gray-300); background:#fff; transition:background .15s; }
  a.lrow:hover { background:var(--gray-50); }
  a.lrow:hover h3 { color:var(--teal-700); }
  .lrow .row1 { display:flex; align-items:center; justify-content:space-between; }
  .lrow .dday { font-size:12px; line-height:18px; letter-spacing:-.12px; color:var(--gray-500); }

  .lrow .info { display:flex; flex-direction:column; gap:10px; }
  .lmeta { display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; font-size:16px; font-weight:500; line-height:22px; }
  .lmeta > span { display:inline-flex; align-items:center; white-space:nowrap; }
  .lmeta > span + span::before { content:""; align-self:stretch; width:0; margin-right:12px; border-left:1px solid var(--gray-300); }
  .lmeta em { margin-right:4px; font-style:normal; font-weight:400; }
  .lrow .reg { font-size:12px; line-height:18px; letter-spacing:-.12px; color:#9b9b9b; }
  /* 오른쪽 위: (비공개) 자물쇠 + D-day / 아래: 등록일 + 견적서 작성 버튼(분석파트너, 모집 중) */
  .rt { display:inline-flex; align-items:center; gap:8px; }

  .qbtn:focus-visible { outline:2px solid var(--teal-600); outline-offset:2px; }
  .cbtns { flex:none; display:inline-flex; gap:6px; }
  .qbtn.ghost { background:#f3f2f2; color:var(--gray-700); border:1px solid var(--gray-400); }
  .qbtn.ghost:hover { background:var(--gray-200); }

  .empty { padding:80px 0; text-align:center; color:var(--gray-500); font-size:16px; line-height:22px; background:#fff; border:1px solid var(--gray-200); border-radius:12px; }

  /* 페이지네이션 */
  .pager { display:flex; justify-content:center; gap:4px; }

<body>
<div data-op-gnb="find"></div>

<section class="page-head"><div class="in">
  <h1>프로젝트 찾기</h1>
  <p>OmicsPharm에서는 합리적인 견적으로 여러 프로젝트를 지원합니다.</p>
</div></section>

<section class="find"><div class="in">
  <aside class="side">
    <div class="panel">
      <div class="seg" role="group" aria-label="모집 상태">
        <button type="button" class="on" data-status="all">전체</button>
        <button type="button" data-status="open">모집중</button>
        <button type="button" data-status="closed">모집마감</button>
      </div>
      <div class="divider"></div>
      <div class="group">
        <h3>카테고리</h3>
        <div class="checks" id="cats"></div>
      </div>
      <div class="divider"></div>
      <div class="group" id="priceGroup">
        <div class="range-head"><b>예상금액</b><span id="rangeLabel"></span></div>
        <div class="range">
          <div class="track"></div><div class="fill" id="rangeFill"></div>
          <input type="range" id="minP" min="0" max="1000" step="50" value="0" aria-label="최소 예상금액">
          <input type="range" id="maxP" min="0" max="1000" step="50" value="1000" aria-label="최대 예상금액">
        </div>
        <div class="range-foot"><span>0</span><span>1000만원 이상</span></div>
      </div>
      <button type="button" class="reset" id="reset"><img src="assets/find/ic-arrow-clockwise.svg" alt="">필터 초기화</button>
    </div>
    <div class="panel cta">
      <div class="t">
        <b><img src="assets/find/ic-magnifying-glass.svg" alt="">프로젝트 등록이 필요하신가요?</b>
        <p>원하는 분석을 의뢰하고 최적의 파트너를 만나보세요.</p>
      </div>
      <a class="btn-filled" href="omicspharm-register.html" data-client-only>프로젝트 의뢰 <img src="assets/find/ic-arrow-right-white.svg" alt=""></a>
    </div>
  </aside>

  <div class="main">
    <label class="search"><input id="q" type="search" placeholder="프로젝트 제목, 프로젝트 번호, 연구분야 등을 검색해보세요." aria-label="프로젝트 검색"><img src="assets/find/ic-search.svg" alt=""></label>
    <div class="results">
      <div class="toolbar">
        <span class="total" id="total"></span>
        <div class="tools">
          <label class="check tip-wrap"><input type="checkbox" id="hidePrivate"><i></i><span class="tl">비공개 프로젝트 제외</span><span class="tip">비공개로 등록된 프로젝트를 검색 결과에서 제외합니다.</span></label>
          <div class="select"><select id="sort" aria-label="정렬">
            <option value="new">최신 등록 순</option>
            <option value="deadline">마감 임박 순</option>
            <option value="samples">샘플 많은 순</option>
          </select></div>
          <span class="vline"></span>
          <div class="views" role="group" aria-label="보기 방식">
            <button type="button" class="on" data-view="list" aria-label="목록형으로 보기"><img src="assets/find/ic-list-bullets.svg" alt=""></button>
            <button type="button" data-view="grid" aria-label="그리드형으로 보기"><img src="assets/find/ic-squares-four.svg" alt=""></button>
          </div>
        </div>
      </div>
      <div id="items"></div>
    </div>
    <nav class="pager" id="pager" aria-label="페이지"></nav>
  </div>
</div></section>

<div data-op-footer></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  var CATS = OP_PROJECTS.CATS, DATA = OP_PROJECTS.DATA, d = OP_PROJECTS.date;

  var state = { status: 'all', cats: [], min: 0, max: 1000, q: '', hidePrivate: false, sort: 'new', view: 'list', page: 1 };
  var PER = { list: 10, grid: 12 };

  // 카테고리 체크박스
  $('#cats').innerHTML = CATS.map(function (c) { return '<label class="check"><input type="checkbox" value="' + c + '"><i></i><span>' + c + '</span></label>'; }).join('');

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function status(x) { return x.open ? '<span class="badge open">모집중</span>' : '<span class="badge closed">모집마감</span>'; }
  function dday(x) { return x.open ? '종료 D-' + String(x.days).padStart(2, '0') : '모집 종료'; }

  // 비공개 프로젝트: 분석파트너·컨설턴트는 내용까지 보이고 자물쇠로 표시, 클라이언트·비로그인은 가려지고 열 수 없음
  var SEE_PRIV = OP.canSeePrivate(), QUOTE = OP.canQuote();
  function masked(x) { return x.priv && !SEE_PRIV; }
  var LOCK = '<img class="lock" src="assets/main/ic-lock-key.svg" alt="비공개" title="비공개 프로젝트">';
  // 분석파트너: 모집 중인 프로젝트에 견적서 작성 버튼 (마감이면 없음)
  // 미인증 분석파트너: 버튼은 잠긴 상태로 보이고, 누르면 인증 안내
  var PARTNER = OP.isPartner();
  // 컨설턴트: 견적서(제출 수) · Q&A 버튼 — 견적서는 프로젝트 관리 상세의 견적서 확인 목록으로
  var ADMIN = (OP.session() || {}).role === 'admin';
  function quoteBtn(x) {
    if (ADMIN) return '<span class="cbtns"><span class="qbtn ghost" role="button" tabindex="0" data-cq="' + x.id + '">견적서 (' + (x.rid ? OP.flow.quoteCount(x.rid) : 0) + ')</span><span class="qbtn ghost" role="button" tabindex="0" data-cqa="' + x.id + '">Q&amp;A (0 / 0)</span></span>';
    if (x.rid && OP.flow.state(x.rid).P[(OP.session() || {}).email]) return PARTNER ? '<span class="qbtn" role="button" tabindex="0" data-quote="' + x.id + '">견적서 보기</span>' : '';
    if (!x.open || !PARTNER) return '';
    return QUOTE ? '<span class="qbtn" role="button" tabindex="0" data-quote="' + x.id + '">견적서 작성</span>'
                 : '<span class="qbtn off" role="button" tabindex="0" data-quote-locked title="인증된 분석파트너만 견적서를 작성할 수 있습니다"><img src="assets/main/ic-lock-key.svg" alt="">견적서 작성</span>';
  }
  function listCard(x) {
    var badges = '<div class="badges"><span class="badge tag">' + esc(x.cat) + '</span>' + status(x) + '</div>';
    if (masked(x)) {
      return '<div class="lcard private"><div class="head"><div class="row1">' + badges + '<img class="lock" src="assets/main/ic-lock-key.svg" alt="비공개"></div><h3>' + esc(x.title) + '</h3></div>' +
        '<div class="info"><div class="meta">' +
          '<span><img src="assets/find/ic-user.svg" alt="">비공개</span>' +
          '<span><img src="assets/find/ic-flask.svg" alt=""><em>샘플</em>비공개</span>' +
          '<span><img src="assets/find/ic-timer.svg" alt=""><em>희망완료일</em>비공개</span>' +
          '<span><img src="assets/find/ic-calendar.svg" alt=""><em>모집 기한</em>비공개</span>' +
        '</div><p class="reg">등록일 ' + x.reg + '</p></div></div>';
    }
    return '<a class="lcard" href="' + OP_PROJECTS.url(x) + '"><div class="head"><div class="row1">' + badges + '<span class="rt">' + (x.priv ? LOCK : '') + '<span class="dday">' + dday(x) + '</span></span></div><h3>' + esc(x.title) + '</h3></div>' +
      '<div class="info"><div class="meta">' +
        '<span>' + x.owner + '</span>' +
        '<span><em>샘플</em>' + x.samples + '개</span>' +
        '<span><em>희망완료일</em>' + x.due + '</span>' +
        '<span><em>모집 기한</em>' + x.from + ' ~ ' + x.to + '</span>' +
      '</div><div class="foot"><p class="reg">등록일 ' + x.reg + '</p>' + quoteBtn(x) + '</div></div></a>';
  }
  // 목록형 B안 행 (Project-list 977:7939)
  function listRow(x) {
    var badges = '<div class="badges"><span class="badge tag">' + esc(x.cat) + '</span>' + status(x) + '</div>';
    var p = masked(x), v = function (t) { return p ? '비공개' : t; };
    var inner = '<div class="top"><div class="row1">' + badges + (p ? LOCK : '<span class="rt">' + (x.priv ? LOCK : '') + '<span class="dday">' + dday(x) + '</span></span>') + '</div>' +
      '<h3>' + esc(x.title) + '</h3></div>' +
      '<div class="info"><div class="lmeta">' +
        '<span>' + v(x.owner) + '</span>' +
        '<span><em>샘플 :</em>' + v(x.samples + '개') + '</span>' +
        '<span><em>희망완료일 :</em>' + v(x.due) + '</span>' +
        '<span><em>모집기한 :</em>' + v(x.from + ' ~ ' + x.to) + '</span>' +
      '</div><div class="foot"><p class="reg">등록일 ' + x.reg + '</p>' + (p ? '' : quoteBtn(x)) + '</div></div>';
    return p ? '<div class="lrow private">' + inner + '</div>' : '<a class="lrow" href="' + OP_PROJECTS.url(x) + '">' + inner + '</a>';
  }
  var LIST_A = new URLSearchParams(location.search).get('list') === 'a'; // 기존 카드형 목록과 비교용
  var GRID_Q = new URLSearchParams(location.search).get('grid');
  var GRID_B = GRID_Q !== 'a'; // 그리드형 기본: 구분선형. 기존 박스 안 카드형은 ?grid=a 로 비교

  function gridCard(x) {
    var p = masked(x);
    var rows = '<div><em>샘플</em>' + (p ? '비공개' : x.samples + '개') + '</div>' +
      '<div><em>희망완료일</em>' + (p ? '비공개' : x.due) + '</div>' +
      '<div><em>모집 기한</em>' + (p ? '비공개' : x.from + ' ~ ' + x.to) + '</div>' +
      '<div class="foot"><p class="reg">등록일 ' + x.reg + '</p>' + (p ? '' : quoteBtn(x)) + '</div>';
    var top = '<div class="top"><div class="row1"><div class="badges"><span class="badge tag">' + esc(x.cat) + '</span>' + status(x) + '</div>' + (x.priv ? LOCK : '') + '</div><h3>' + esc(x.title) + '</h3></div>';
    return p ? '<div class="gcard private">' + top + '<div class="rows">' + rows + '</div></div>'
             : '<a class="gcard" href="' + OP_PROJECTS.url(x) + '">' + top + '<div class="rows">' + rows + '</div></a>';
  }

  // 예상금액 필터는 분석파트너·컨설턴트만 (클라이언트·비로그인은 다른 프로젝트 가격을 볼 수 없음)
  if (['partner', 'admin'].indexOf((OP.session() || {}).role) < 0) { var pg = document.getElementById('priceGroup'); pg.hidden = true; if (pg.previousElementSibling && pg.previousElementSibling.classList.contains('divider')) pg.previousElementSibling.hidden = true; }
  function filtered() {
    var q = state.q.trim().toLowerCase();
    var out = DATA.filter(function (x) {
      if (state.status === 'open' && !x.open) return false;
      if (state.status === 'closed' && x.open) return false;
      if (state.cats.length && state.cats.indexOf(x.cat) < 0) return false;
      // 가격을 볼 수 없는 프로젝트는 금액 필터에 쓰지 않음 (가격 노출 방지)
      if (OP_PROJECTS.canSeePrice(x) && (x.price < state.min || (state.max < 1000 && x.price > state.max))) return false;
      if (state.hidePrivate && x.priv) return false;
      // 제목·연구분야 또는 프로젝트 번호 (PRJ-2026-0012, 2026-0012, 0012처럼 일부나 하이픈 없이도 검색)
      if (q && (x.title + ' ' + x.cat).toLowerCase().indexOf(q) < 0 && OP_PROJECTS.no(x).toLowerCase().replace(/-/g, '').indexOf(q.replace(/[-\s]/g, '')) < 0) return false;
      return true;
    });
    var by = {
      new: function (a, b) { return d(b.reg) - d(a.reg); },
      deadline: function (a, b) { return (a.open === b.open) ? (a.open ? a.days - b.days : b.days - a.days) : (a.open ? -1 : 1); },
      samples: function (a, b) { return b.samples - a.samples; }
    }[state.sort];
    return out.sort(by);
  }

  // 견적서 작성 버튼: 행(링크) 이동 대신 견적서 작성 화면으로
  function goQuote(e) {
    var cq = e.target.closest('[data-cq]'), cqa = e.target.closest('[data-cqa]');
    if (cq || cqa) {
      e.preventDefault(); e.stopPropagation();
      if (cqa) { OP.toast('프로젝트 Q&A는 준비 중입니다.'); return; }
      var cx = DATA[+cq.dataset.cq];
      if (cx.rid) location.href = 'mypage-request.html?id=' + encodeURIComponent(cx.rid) + '#quotes';
      else OP.toast('등록된 견적서가 없습니다.');
      return;
    }
    var lk = e.target.closest('[data-quote-locked]');
    if (lk) { e.preventDefault(); e.stopPropagation(); OP.toast('인증된 분석파트너만 견적서를 작성할 수 있습니다.'); return; }
    var b = e.target.closest('[data-quote]'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var bx = DATA[+b.dataset.quote];
    if (bx.rid) { OP.flow.apply(bx.rid, OP.session().email); location.href = 'mypage-quote.html?rid=' + encodeURIComponent(bx.rid) + '#quote'; return; } // OmicsPharm 의뢰: 직접 신청
    location.href = 'mypage-quote.html?id=' + b.dataset.quote + '#quote'; // 마이페이지 견적관리 > 견적서 작성
  }
  document.querySelector('.results').addEventListener('click', goQuote, true);
  document.querySelector('.results').addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-quote], [data-quote-locked], [data-cq], [data-cqa]')) goQuote(e); });

  function renderRange() {
    var lo = +$('#minP').value, hi = +$('#maxP').value;
    $('#rangeFill').style.left = (lo / 10) + '%';
    $('#rangeFill').style.width = ((hi - lo) / 10) + '%';
    $('#rangeLabel').textContent = (lo === 0 && hi === 1000) ? '전체' : lo + '-' + (hi === 1000 ? '1000만원 이상' : hi + '만원');
  }

  var gridCols = 0;
  // 화면 폭이 바뀌어 열 수가 달라지면 빈칸 수를 다시 맞춤
  window.addEventListener('resize', function () {
    var b = $('#items');
    if (b.classList.contains('lines') && getComputedStyle(b).gridTemplateColumns.split(' ').length !== gridCols) render();
  });
  function render() {
    var all = filtered(), per = PER[state.view], pages = Math.max(1, Math.ceil(all.length / per));
    if (state.page > pages) state.page = pages;
    var slice = all.slice((state.page - 1) * per, state.page * per);
    $('#total').textContent = '총 ' + all.length + '개';
    var box = $('#items');
    box.className = state.view === 'list' ? 'list' : 'grid';
    var boxed = !LIST_A; // B안: 목록형·그리드형 모두 흰 박스 (Find Projects2-list 831:3469 / -grid 977:9070)
    $('.main').classList.toggle('boxed', boxed);
    box.innerHTML = slice.length ? slice.map(state.view === 'list' ? (LIST_A ? listCard : listRow) : gridCard).join('') : '<div class="empty">조건에 맞는 프로젝트가 없습니다.</div>';
    // 구분선형 그리드: 마지막 줄이 비면 빈칸을 채워 격자 선이 끝까지 이어지게
    var lines = GRID_B && state.view === 'grid' && boxed;
    box.classList.toggle('lines', lines);
    if (lines && slice.length) {
      var cols = getComputedStyle(box).gridTemplateColumns.split(' ').length;
      box.insertAdjacentHTML('beforeend', new Array((cols - slice.length % cols) % cols + 1).join('<div class="gfill" aria-hidden="true"></div>'));
      gridCols = cols;
    }
    // 페이지네이션 (최대 5개 번호)
    var start = Math.max(1, Math.min(state.page - 2, pages - 4)), end = Math.min(pages, start + 4), html = '';
    var btn = function (p, inner, label, dis) { return '<button type="button" data-p="' + p + '" aria-label="' + label + '"' + (dis ? ' disabled' : '') + '>' + inner + '</button>'; };
    html += btn(1, '<img src="assets/find/ic-caret-double-left.svg" alt="">', '첫 페이지', state.page === 1);
    html += btn(state.page - 1, '<img src="assets/find/ic-caret-left.svg" alt="">', '이전 페이지', state.page === 1);
    for (var p = start; p <= end; p++) html += '<button type="button" data-p="' + p + '"' + (p === state.page ? ' class="on" aria-current="page"' : '') + '>' + p + '</button>';
    html += btn(state.page + 1, '<img src="assets/find/ic-caret-right.svg" alt="">', '다음 페이지', state.page === pages);
    html += btn(pages, '<img src="assets/find/ic-caret-double-right.svg" alt="">', '마지막 페이지', state.page === pages);
    $('#pager').innerHTML = html;
  }
  function update(patch) { Object.assign(state, patch, patch.page ? {} : { page: 1 }); render(); }

  $$('.seg button').forEach(function (b) { b.addEventListener('click', function () { $$('.seg button').forEach(function (x) { x.classList.toggle('on', x === b); }); update({ status: b.dataset.status }); }); });
  $('#cats').addEventListener('change', function () { update({ cats: $$('#cats input:checked').map(function (i) { return i.value; }) }); });
  ['#minP', '#maxP'].forEach(function (s) {
    $(s).addEventListener('input', function () {
      var lo = $('#minP'), hi = $('#maxP');
      if (+lo.value > +hi.value) { if (this === lo) hi.value = lo.value; else lo.value = hi.value; }
      renderRange(); update({ min: +lo.value, max: +hi.value });
    });
  });
  $('#q').addEventListener('input', function () { update({ q: this.value }); });
  $('#hidePrivate').addEventListener('change', function () { update({ hidePrivate: this.checked }); });
  $('#sort').addEventListener('change', function () { update({ sort: this.value }); });
  $$('.views button').forEach(function (b) { b.addEventListener('click', function () { $$('.views button').forEach(function (x) { x.classList.toggle('on', x === b); }); update({ view: b.dataset.view }); }); });
  if (GRID_Q) $('.views button[data-view="grid"]').click(); // 비교용 주소(?grid=a / ?grid=b)는 그리드형으로 바로 열기
  $('#pager').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    update({ page: +b.dataset.p });
    $('.results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('#reset').addEventListener('click', function () {
    $$('.seg button').forEach(function (x, i) { x.classList.toggle('on', i === 0); });
    $$('#cats input').forEach(function (i) { i.checked = false; });
    $('#minP').value = 0; $('#maxP').value = 1000; renderRange();
    $('#q').value = ''; $('#hidePrivate').checked = false; $('#sort').value = 'new';
    update({ status: 'all', cats: [], min: 0, max: 1000, q: '', hidePrivate: false, sort: 'new' });
  });

  renderRange(); render();
})();
</script>
</body>
</html>
