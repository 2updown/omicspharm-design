<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>비밀번호 재설정 · OmicsPharm</title>
<!-- 비밀번호 재설정 (메일의 [비밀번호 재설정하기]로 들어옴, Figma 시안 없음 — 회원가입·비밀번호 찾기 화면 구성을 따름)
     ?t=재설정 토큰: 발송 후 30분, 한 번만 사용. 만료·사용됨·없는 토큰이면 만료 안내
     비밀번호 규칙은 회원가입과 같음: 8~20자 + 영문·숫자·특수문자 각 1자 이상 -->
<link rel="stylesheet" href="assets/common/site.css?v=20261028q">
<link rel="stylesheet" href="assets/auth/auth.css?v=20261028q">
<script src="assets/common/site.js?v=20261028q"></script>
<script src="assets/auth/auth.js?v=20261028q"></script>
<style>
  .auth-inner[hidden] { display:none; }
  .done { display:flex; flex-direction:column; align-items:stretch; gap:40px; width:100%; }
</style>
</head>
<body>
<div class="auth">
  <aside data-auth-bg></aside>
  <main class="auth-main">
    <div class="auth-inner" id="step1" hidden>
      <form class="auth-form" id="form" novalidate>
        <div class="auth-title">
          <h1>비밀번호 재설정</h1>
          <p><b id="who"></b> 계정의 새 비밀번호를 입력해주세요.</p>
        </div>
        <div class="auth-body">
          <div class="fields">
            <div class="field" id="f-pw">
              <div class="fields" style="gap:8px">
                <div class="field">
                  <label for="pw">새 비밀번호<span class="req">*</span></label>
                  <div class="input"><input id="pw" type="password" autocomplete="new-password" placeholder="새 비밀번호를 입력해주세요"><button type="button" class="ic" data-eye aria-label="비밀번호 보기"><img src="assets/auth/ic-eye.svg" alt=""></button></div>
                </div>
                <ul class="rules" id="rules">
                  <li data-r="len">8~20자</li>
                  <li data-r="alpha">영문 1자 이상</li>
                  <li data-r="num">숫자 1자 이상</li>
                  <li data-r="sym">특수문자 1개 이상</li>
                </ul>
              </div>
            </div>
            <div class="field" id="f-pw2">
              <label for="pw2">새 비밀번호 확인<span class="req">*</span></label>
              <div class="input"><input id="pw2" type="password" autocomplete="new-password" placeholder="새 비밀번호를 한 번 더 입력해주세요"><button type="button" class="ic" data-eye aria-label="비밀번호 보기"><img src="assets/auth/ic-eye.svg" alt=""></button></div>
            </div>
          </div>
          <button class="btn-action off" id="submit" type="submit">비밀번호 변경</button>
        </div>
      </form>
    </div>
    <div class="auth-inner" id="ok" hidden>
      <div class="done">
        <div class="auth-title">
          <h1>비밀번호가 변경되었습니다</h1>
          <p>새 비밀번호로 로그인해주세요.</p>
        </div>
        <a class="btn-action" href="login.html">로그인 하기</a>
      </div>
    </div>
    <div class="auth-inner" id="bad" hidden>
      <div class="done">
        <div class="auth-title">
          <h1>링크가 만료되었습니다</h1>
          <p>이미 사용했거나 발송 후 30분이 지난 링크입니다.<br>비밀번호 찾기에서 링크를 다시 요청해주세요.</p>
        </div>
        <a class="btn-action" href="find-password.html">비밀번호 찾기</a>
        <div class="alt"><a href="login.html">로그인으로 돌아가기</a></div>
      </div>
    </div>
  </main>
</div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  var t = new URLSearchParams(location.search).get('t'), R = {}, LIFE = 30 * 60 * 1000;
  try { R = JSON.parse(localStorage.getItem('op.pwReset') || '{}'); } catch (e) {}
  var x = R[t], valid = x && !x.used && Date.now() - x.at < LIFE && OP.account(x.email);
  if (!valid) { $('#bad').hidden = false; return; }
  $('#who').textContent = x.email; $('#step1').hidden = false;
  AUTH.bindEye();
  var pw = $('#pw'), pw2 = $('#pw2'), RULES = { len: /^.{8,20}$/, alpha: /[A-Za-z]/, num: /[0-9]/, sym: /[^A-Za-z0-9]/ };
  function sync() {
    var ok = true;
    $$('#rules li').forEach(function (li) { var o = RULES[li.dataset.r].test(pw.value); li.classList.toggle('ok', o); ok = ok && o; });
    $('#submit').classList.toggle('off', !(ok && pw2.value));
    return ok;
  }
  pw.addEventListener('input', function () { AUTH.setError($('#f-pw'), ''); sync(); });
  pw2.addEventListener('input', function () { AUTH.setError($('#f-pw2'), ''); sync(); });
  $('#form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!sync()) { AUTH.setError($('#f-pw'), '비밀번호 조건을 모두 충족해주세요.'); return; }
    if (pw2.value !== pw.value) { AUTH.setError($('#f-pw2'), '비밀번호가 일치하지 않습니다.'); return; }
    if ((OP.account(x.email) || {}).pw === pw.value) { AUTH.setError($('#f-pw'), '이전과 다른 비밀번호를 입력해주세요.'); return; }
    OP.saveAccount(x.email, { pw: pw.value });
    R[t].used = true; try { localStorage.setItem('op.pwReset', JSON.stringify(R)); } catch (e2) {}
    $('#step1').hidden = true; $('#ok').hidden = false; window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
