<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>Insights · OmicsPharm</title>
<!-- 커뮤니티 > Insight (Figma 시안 없음 — Upstage Blog 레이아웃 참고, 탭은 FAQ 탭 컴포넌트)
     글 목록은 현재 홈페이지 Insights(/newsletter) 게시글 10개 (assets/insight/posts.js). 카드 → blog-post.html?id=
     ?cat=news|insight  탭 선택 / 한 페이지 12개 -->
<link rel="stylesheet" href="assets/common/site.css?v=20261008l">
<script src="assets/common/site.js?v=20261008l"></script>
<script src="assets/insight/posts.js?v=20261008l"></script>
<style>
  :root {
    --teal-50:#edfefa; --teal-500:#00bba6; --teal-600:#009788; --teal-700:#00786e;
    --gray-50:#fafafa; --gray-100:#f5f5f5; --gray-200:#e5e5e5; --gray-300:#d4d4d4; --gray-400:#a3a3a3; --gray-500:#737373; --gray-600:#525252; --gray-700:#404040;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fff; color:#000; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  [hidden] { display:none !important; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  .in { max-width:1320px; margin:0 auto; }

  .page-head { padding:64px 60px 32px; }
  .page-head h1 { font-size:40px; font-weight:700; line-height:52px; letter-spacing:-.4px; }

  /* 탭 (FAQ 탭과 동일) */
  .tabs-wrap { padding:0 60px; background:#fff; }
  .tabs { display:flex; gap:32px; }
  .tabs button { position:relative; flex:none; white-space:nowrap; height:60px; padding:0 4px; font-size:18px; font-weight:500; line-height:24px; color:var(--gray-500); }
  .tabs button:hover { color:#000; }
  .tabs button.on { color:#000; font-weight:600; }
  .tabs button.on::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--teal-600); }

  .body { padding:32px 60px 80px; }
  .empty { grid-column:1 / -1; padding:80px 0; text-align:center; font-size:16px; line-height:24px; color:var(--gray-500); }

  /* 글 카드 */
  .posts { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:32px 20px; }
  .post { display:flex; flex-direction:column; border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; background:#fff; transition:border-color .15s, box-shadow .15s; }
  .post:hover { border-color:var(--teal-500); box-shadow:0 4px 8px #00000014, 0 0 2px #0000000a; }
  .post .thumb { position:relative; aspect-ratio:427 / 260; overflow:hidden; background:var(--gray-100); }
  .post .thumb img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
  .post:hover .thumb img { transform:scale(1.03); }
  /* 썸네일 좌측 상단 카테고리 뱃지 */
  .badge { position:absolute; left:8px; top:11px; z-index:1; display:inline-flex; align-items:center; padding:2px 8px; border-radius:8px; background:var(--gray-600); font-size:12px; font-weight:500; line-height:18px; letter-spacing:-.12px; color:#fff; white-space:nowrap; }
  .post .txt { display:flex; flex-direction:column; gap:16px; flex:1; padding:12px 12px 24px; }
  .post .meta { display:flex; align-items:center; gap:4px; font-size:12px; line-height:18px; letter-spacing:-.12px; color:var(--gray-500); }
  .post .meta i { width:2px; height:2px; border-radius:50%; background:var(--gray-500); }
  .post h3 { font-size:18px; font-weight:700; line-height:24px; letter-spacing:-.18px; color:#080808; word-break:keep-all; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .post:hover h3 { color:var(--teal-700); }

  /* 페이지네이션 (프로젝트 찾기와 동일) */
  .pager { display:flex; justify-content:center; gap:4px; margin-top:48px; }
  .pager button { width:40px; height:40px; padding:8px; border:1px solid var(--gray-300); border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:500; line-height:22px; color:#a8a29e; }
  .pager button:hover:not(:disabled):not(.on) { background:var(--gray-50); color:var(--gray-700); }
  .pager button.on { background:var(--teal-600); border-color:var(--teal-600); color:#fff; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .pager img { width:20px; height:20px; }

  @media (max-width:1180px) {
    .page-head, .tabs-wrap, .body { padding-left:24px; padding-right:24px; }
    .posts { grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  @media (max-width:640px) {
    .page-head { padding:40px 16px 20px; }
    .page-head h1 { font-size:28px; line-height:36px; letter-spacing:-.28px; }
    .tabs-wrap { padding:0 16px; }
    .tabs { gap:20px; overflow-x:auto; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tabs button { height:52px; font-size:16px; }
    .body { padding:20px 16px 56px; }
    .posts { grid-template-columns:1fr; gap:16px; }
        .pager { margin-top:32px; flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div data-op-gnb="community"></div>

<section class="page-head"><div class="in">
  <h1>Insights</h1>
</div></section>

<nav class="tabs-wrap" aria-label="카테고리"><div class="in tabs" role="tablist" id="tabs"></div></nav>

<main class="body"><div class="in">
  <div class="posts" id="posts"></div>
  <nav class="pager" id="pager" aria-label="페이지"></nav>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var PER = 9;
  var CATS = [['all', 'All'], ['news', 'News'], ['insight', 'Insights']];
  var POSTS = window.OP_POSTS;
  var LABEL = { news: 'News', insight: 'Insights' };
  var P = new URLSearchParams(location.search);
  var state = { cat: LABEL[P.get('cat')] ? P.get('cat') : 'all', page: 1, q: '' };

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function render() {
    $('#tabs').innerHTML = CATS.map(function (c) {
      var on = c[0] === state.cat;
      return '<button type="button" role="tab" aria-selected="' + on + '" data-cat="' + c[0] + '"' + (on ? ' class="on"' : '') + '>' + c[1] + '</button>';
    }).join('');
    var q = state.q.trim().toLowerCase();
    var list = POSTS.filter(function (p) {
      return (state.cat === 'all' || p.cat === state.cat) && (!q || (p.title + ' ' + String(p.body || '').replace(/<[^>]+>/g, ' ')).toLowerCase().indexOf(q) > -1);
    });
    var pages = Math.max(1, Math.ceil(list.length / PER));
    if (state.page > pages) state.page = pages;
    $('#posts').innerHTML = list.slice((state.page - 1) * PER, state.page * PER).map(function (p) {
      return '<a class="post" href="blog-post.html?id=' + p.id + '">' +
        '<div class="thumb"><span class="badge">' + LABEL[p.cat] + '</span><img src="' + (p.thumb || 'assets/insight/thumb-' + p.id + '.jpg') + '" alt="" loading="lazy"></div>' +
        '<div class="txt"><p class="meta"><span>' + esc(p.author || 'OmicsPharm') + '</span><i></i><span>' + p.date + '</span></p><h3>' + esc(p.title) + '</h3></div></a>';
    }).join('') || '<p class="empty">' + (q ? '검색 결과가 없습니다.' : '등록된 글이 없습니다.') + '</p>';
    $('#pager').hidden = list.length <= PER;
    var html = '', btn = function (p, ic, label, dis) { return '<button type="button" data-p="' + p + '" aria-label="' + label + '"' + (dis ? ' disabled' : '') + '><img src="assets/find/ic-' + ic + '.svg" alt=""></button>'; };
    var start = Math.max(1, Math.min(state.page - 2, pages - 4)), end = Math.min(pages, start + 4);
    html += btn(1, 'caret-double-left', '첫 페이지', state.page === 1) + btn(state.page - 1, 'caret-left', '이전 페이지', state.page === 1);
    for (var i = start; i <= end; i++) html += '<button type="button" data-p="' + i + '"' + (i === state.page ? ' class="on" aria-current="page"' : '') + '>' + i + '</button>';
    html += btn(state.page + 1, 'caret-right', '다음 페이지', state.page === pages) + btn(pages, 'caret-double-right', '마지막 페이지', state.page === pages);
    $('#pager').innerHTML = html;
  }

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]'); if (!b || b.dataset.cat === state.cat) return;
    state.cat = b.dataset.cat; state.page = 1;
    var u = new URL(location.href); if (state.cat === 'all') u.searchParams.delete('cat'); else u.searchParams.set('cat', state.cat); history.replaceState(null, '', u);
    render();
  });
  $('#pager').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    state.page = +b.dataset.p; render(); $('.tabs-wrap').scrollIntoView({ behavior: 'smooth' });
  });
  render();
})();
</script>
</body>
</html>
