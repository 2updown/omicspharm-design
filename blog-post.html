<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>Insights · OmicsPharm</title>
<!-- 커뮤니티 > Insights 상세 (Figma 시안 없음 — Upstage Blog 글 상세 레이아웃 참고)
     ?id=게시글 번호 (assets/insight/posts.js) -->
<link rel="stylesheet" href="assets/common/site.css?v=20261001t">
<script src="assets/common/site.js?v=20261001t"></script>
<script src="assets/insight/posts.js?v=20261001t"></script>
<style>
  :root {
    --teal-50:#edfefa; --teal-500:#00bba6; --teal-600:#009788; --teal-700:#00786e;
    --gray-50:#fafafa; --gray-100:#f5f5f5; --gray-200:#e5e5e5; --gray-300:#d4d4d4; --gray-400:#a3a3a3; --gray-500:#737373; --gray-600:#525252; --gray-700:#404040;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#fff; color:#000; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }

  /* 글 머리: 가운데 제목 · 작성 정보 · 대표 이미지 */
  .post-head { max-width:1024px; margin:0 auto; padding:72px 60px 0; text-align:center; }
  .post-head h1 { font-size:44px; font-weight:700; line-height:58px; letter-spacing:-.88px; word-break:keep-all; }
  .byline { display:flex; justify-content:center; align-items:center; gap:8px; margin-top:24px; font-size:15px; line-height:22px; color:var(--gray-500); }
  .byline img { width:24px; height:24px; border-radius:50%; border:1px solid var(--gray-200); }
  .byline b { font-weight:500; color:var(--gray-700); }
  .byline i { width:3px; height:3px; border-radius:50%; background:var(--gray-400); }
  .byline a:hover { color:var(--teal-600); }
  .hero-img { max-width:1024px; margin:48px auto 0; padding:0 60px; box-sizing:content-box; }
  .hero-img img { display:block; width:100%; aspect-ratio:16 / 9; object-fit:cover; border-radius:12px; border:1px solid var(--gray-200); }

  /* 본문 */
  /* 본문 폭 = 대표 이미지 폭 (1024px) */
  .article { max-width:1024px; margin:0 auto; padding:56px 60px 0; box-sizing:content-box; font-size:18px; line-height:1.75; color:var(--gray-700); word-break:keep-all; overflow-wrap:break-word; }
  .article p + p { margin-top:20px; }
  .article h2 { margin:48px 0 16px; font-size:24px; font-weight:700; line-height:34px; letter-spacing:-.24px; color:#000; }
  .article h2:first-child { margin-top:0; }
  .article b { color:#000; font-weight:600; }
  .article a { color:var(--teal-600); text-decoration:underline; text-underline-offset:3px; word-break:break-all; }
  .article ul, .article ol { margin:16px 0 0; padding-left:24px; }
  .article li + li { margin-top:6px; }
  .article table { width:100%; margin:24px 0; border-collapse:collapse; border-top:2px solid #000; font-size:15px; line-height:22px; }
  .article thead td, .article th { background:var(--gray-100); font-weight:600; color:#000; }
  .article td, .article th { padding:12px 16px; border-bottom:1px solid var(--gray-200); text-align:left; vertical-align:top; }
  .article > * + table, .article > table + * { margin-top:24px; }

  /* 이전 글 / 다음 글 (양쪽 정렬) + 버튼 */
  .post-nav { max-width:min(1024px, calc(100% - 120px)); margin:64px auto 0; display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200); }
  .post-nav a, .post-nav span { display:flex; flex-direction:column; gap:6px; min-width:0; padding:24px 0; }
  .post-nav .next { align-items:flex-end; text-align:right; border-left:1px solid var(--gray-200); padding-left:24px; }
  .post-nav .prev { padding-right:24px; }
  .post-nav small { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; line-height:20px; color:var(--gray-500); }
  .post-nav small img { width:16px; height:16px; opacity:.6; }
  .post-nav b { max-width:100%; font-size:17px; font-weight:600; line-height:25px; color:#000; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post-nav a:hover b { color:var(--teal-700); }
  .post-nav span b { color:var(--gray-400); font-weight:500; }
  .post-foot { max-width:min(1024px, calc(100% - 120px)); margin:24px auto 0; display:flex; justify-content:flex-end; gap:8px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:48px; min-width:120px; padding:0 20px; border-radius:8px; font:inherit; font-size:16px; font-weight:500; line-height:22px; cursor:pointer; }
  .btn.line { border:1px solid var(--gray-300); background:#fff; color:var(--gray-600); }
  .btn.line:hover { background:var(--gray-50); }
  .btn.pri { border:0; background:var(--teal-600); color:#fff; }
  .btn.pri:hover { background:var(--teal-700); }

  /* 관련 글 */
  .related { max-width:1320px; margin:96px auto 0; padding:0 60px 96px; }
  .related-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }
  .related-head h2 { font-size:28px; font-weight:700; line-height:38px; letter-spacing:-.28px; }
  .related-head a { font-size:16px; font-weight:500; line-height:22px; color:var(--gray-700); white-space:nowrap; }
  .related-head a:hover { color:var(--teal-600); }
  .posts { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:20px; margin-top:24px; }
  .post { display:flex; flex-direction:column; border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; background:#fff; transition:border-color .15s, box-shadow .15s; }
  .post:hover { border-color:var(--teal-500); box-shadow:0 4px 8px #00000014, 0 0 2px #0000000a; }
  .post .thumb { position:relative; aspect-ratio:427 / 260; overflow:hidden; background:var(--gray-100); }
  .post .thumb img { width:100%; height:100%; object-fit:cover; transition:transform .3s; }
  .post:hover .thumb img { transform:scale(1.03); }
  .post .badge { position:absolute; left:8px; top:11px; z-index:1; display:inline-flex; align-items:center; padding:2px 8px; border-radius:8px; background:var(--gray-600); font-size:12px; font-weight:500; line-height:18px; letter-spacing:-.12px; color:#fff; white-space:nowrap; }
  .post .txt { display:flex; flex-direction:column; gap:16px; flex:1; padding:12px 12px 24px; }
  .post .meta { display:flex; align-items:center; gap:4px; font-size:12px; line-height:18px; letter-spacing:-.12px; color:var(--gray-500); }
  .post .meta i { width:2px; height:2px; border-radius:50%; background:var(--gray-500); }
  .post h3 { font-size:18px; font-weight:700; line-height:24px; letter-spacing:-.18px; color:#080808; word-break:keep-all; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .post:hover h3 { color:var(--teal-700); }

  @media (max-width:1180px) { .related { padding-left:24px; padding-right:24px; } .posts { grid-template-columns:repeat(2, minmax(0,1fr)); } .posts .post:nth-child(3) { display:none; } }
  @media (max-width:640px) {
    .post-head { padding:40px 16px 0; }
    .post-head h1 { font-size:26px; line-height:36px; letter-spacing:-.52px; }
    .byline { flex-wrap:wrap; margin-top:16px; font-size:13px; }
    .hero-img { margin-top:28px; padding:0 16px; }
    .hero-img img { border-radius:8px; }
    .article { padding:36px 16px 0; font-size:16px; }
    .article h2 { margin:36px 0 12px; font-size:20px; line-height:28px; }
    .article table { display:block; overflow-x:auto; font-size:14px; }
    .post-nav { max-width:calc(100% - 32px); margin-top:48px; grid-template-columns:1fr; }
    .post-nav .next { align-items:flex-start; text-align:left; border-left:0; border-top:1px solid var(--gray-200); padding-left:0; }
    .post-nav .prev { padding-right:0; }
    .post-nav a, .post-nav span { padding:18px 0; }
    .post-nav b { font-size:15px; line-height:22px; }
    .post-foot { max-width:calc(100% - 32px); }
    .post-foot .btn { flex:1; min-width:0; }
    .related { margin-top:64px; padding:0 16px 64px; }
    .related-head h2 { font-size:22px; line-height:30px; }
    .posts { grid-template-columns:1fr; gap:16px; }
    .posts .post:nth-child(3) { display:flex; }
  }
</style>
</head>
<body>
<div data-op-gnb="community"></div>

<header class="post-head">
  <h1 id="title"></h1>
  <p class="byline"><img src="assets/common/favicon.png" alt=""><b>OmicsPharm</b><i></i><a id="cat" href="blog.html"></a><i></i><span id="date"></span></p>
</header>
<figure class="hero-img"><img id="hero" src="" alt=""></figure>

<article class="article" id="body"></article>

<nav class="post-nav" id="postNav" aria-label="이전 글, 다음 글"></nav>
<div class="post-foot">
  <button type="button" class="btn line" id="share">링크 복사</button>
  <a class="btn pri" href="blog.html">목록으로</a>
</div>

<section class="related">
  <div class="related-head"><h2>관련 글</h2><a href="blog.html">전체 보기</a></div>
  <div class="posts" id="related"></div>
</section>

<div data-op-footer></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var LABEL = { news: 'News', insight: 'Insight' };
  var POSTS = window.OP_POSTS;
  var id = +new URLSearchParams(location.search).get('id');
  var p = POSTS.filter(function (x) { return x.id === id; })[0];
  if (!p) { location.replace('blog.html'); return; }

  document.title = p.title + ' · OmicsPharm';
  $('#title').textContent = p.title;
  $('#cat').textContent = LABEL[p.cat]; $('#cat').href = 'blog.html?cat=' + p.cat;
  $('#date').textContent = p.date;
  $('#hero').src = p.thumb || 'assets/insight/thumb-' + p.id + '.jpg';
  $('#body').innerHTML = p.body;

  // 이전 글(더 오래된 글) · 다음 글(더 최근 글) — 목록 순서(최신순) 기준
  var i = POSTS.indexOf(p), older = POSTS[i + 1], newer = POSTS[i - 1];
  var escT = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var nav = function (x, cls, label) {
    var head = '<small>' + (cls === 'prev' ? '<img src="assets/find/ic-caret-left.svg" alt="">' + label : label + '<img src="assets/find/ic-caret-right.svg" alt="">') + '</small>';
    return x ? '<a class="' + cls + '" href="blog-post.html?id=' + x.id + '">' + head + '<b>' + escT(x.title) + '</b></a>'
             : '<span class="' + cls + '">' + head + '<b>' + label + '이 없습니다</b></span>';
  };
  $('#postNav').innerHTML = nav(older, 'prev', '이전 글') + nav(newer, 'next', '다음 글');

  $('#share').addEventListener('click', function () {
    (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(
      function () { OP.toast('링크를 복사했습니다.'); }, function () { OP.toast('링크를 복사하지 못했습니다.'); });
  });

  // 관련 글: 같은 카테고리 우선, 부족하면 최신 글로 채움 (최대 3개)
  var others = POSTS.filter(function (x) { return x.id !== p.id; });
  var rel = others.filter(function (x) { return x.cat === p.cat; }).concat(others.filter(function (x) { return x.cat !== p.cat; })).slice(0, 3);
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  $('#related').innerHTML = rel.map(function (x) {
    return '<a class="post" href="blog-post.html?id=' + x.id + '"><div class="thumb"><span class="badge">' + LABEL[x.cat] + '</span><img src="' + (x.thumb || 'assets/insight/thumb-' + x.id + '.jpg') + '" alt="" loading="lazy"></div>' +
      '<div class="txt"><p class="meta"><span>' + esc(x.author || 'OmicsPharm') + '</span><i></i><span>' + x.date + '</span></p><h3>' + esc(x.title) + '</h3></div></a>';
  }).join('');
})();
</script>
</body>
</html>
