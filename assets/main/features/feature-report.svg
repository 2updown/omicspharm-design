<text x="268" y="140" font-size="16" font-weight="700" fill="#0a0a0c">혈청 단백체 비교 분석 결과 요약</text><text x="268" y="160" font-size="11" fill="#9b9b9b">분석 파트너 결과 파일 3건을 바탕으로 작성됨</text><rect x="268" y="176" width="250" height="8" rx="4" fill="#eceff0"/><rect x="268" y="192" width="236" height="8" rx="4" fill="#eceff0"/><rect x="268" y="208" width="252" height="8" rx="4" fill="#eceff0"/><rect x="268" y="224" width="180" height="8" rx="4" fill="#eceff0"/><text x="268" y="248" font-size="12" font-weight="600" fill="#000">핵심 결과</text><circle cx="274" cy="262" r="3" fill="#009788"/><text x="284" y="266" font-size="12" fill="#262626">차등 발현 단백질 128개 확인</text><circle cx="274" cy="286" r="3" fill="#009788"/><text x="284" y="290" font-size="12" fill="#262626">염증 경로(IL-6) 관련 단백질 증가</text><circle cx="274" cy="310" r="3" fill="#009788"/><text x="284" y="314" font-size="12" fill="#262626">대조군 대비 상위 5개 바이오마커 후보</text><rect x="540" y="170" width="272" height="182" rx="8" fill="#fafafa"/><text x="556" y="192" font-size="11" font-weight="600" fill="#000">후보 단백질 발현량</text><rect x="560" y="268" width="26" height="62" rx="3" fill="#bffdf1"/><rect x="602" y="234" width="26" height="96" rx="3" fill="#77f9e4"/><rect x="644" y="202" width="26" height="128" rx="3" fill="#00bba6"/><rect x="686" y="246" width="26" height="84" rx="3" fill="#77f9e4"/><rect x="728" y="284" width="26" height="46" rx="3" fill="#bffdf1"/><line x1="552" y1="330" x2="800" y2="330" stroke="#d4d4d4"/><rect x="268" y="392" width="264" height="44" rx="22" fill="#fff" stroke="#d4d4d4"/><text x="400" y="419" font-size="13" font-weight="500" fill="#737373" text-anchor="middle">내용 수정하기</text><rect x="548" y="392" width="264" height="44" rx="22" fill="#009788"/><text x="680" y="419" font-size="13" font-weight="500" fill="#fff" text-anchor="middle">보고서 다운로드</text>
