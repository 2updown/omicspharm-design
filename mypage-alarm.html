<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>알림 · 마이페이지 · OmicsPharm</title>
<!-- 마이페이지 > 알림 (Figma 시안 없음). GNB 종 아이콘이 이 화면으로 연결된다.
     알림은 이 브라우저의 의뢰·문의 기록 + 공지로 만든다(assets/common/mypage.js). 읽음 상태는 localStorage op.alarmRead -->
<link rel="stylesheet" href="assets/common/site.css?v=20261006z">
<link rel="stylesheet" href="assets/common/mypage.css?v=20261006z">
<script src="assets/common/site.js?v=20261006z"></script>
<script src="assets/common/mypage.js?v=20261006z"></script>
<script src="assets/common/flow.js?v=20261006z"></script>
<style>
  .bar { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .readall { font-size:14px; font-weight:500; line-height:20px; color:var(--gray-500); white-space:nowrap; }
  .readall:hover:not(:disabled) { color:var(--teal-600); }
  .readall:disabled { opacity:.4; cursor:default; }

  .alist { border-top:1px solid var(--gray-200); }
  .al { display:flex; align-items:flex-start; gap:14px; padding:18px 12px; border-bottom:1px solid var(--gray-200); }
  .al:hover { background:var(--gray-50); }
  .al.new { background:#f6faf9; }
  .al.new:hover { background:#eef6f4; }
  .al .tx { flex:1; min-width:0; }
  .al .top { display:flex; align-items:center; gap:8px; font-size:12px; line-height:18px; color:var(--gray-500); }
  .al .top .cat { font-weight:600; color:var(--gray-600); }
  .al .top .dot { width:6px; height:6px; border-radius:50%; background:var(--orange-600); }
  .al .t { margin-top:4px; font-size:15px; font-weight:500; line-height:22px; word-break:keep-all; }
  .al.new .t { font-weight:600; }
  .al .sub { margin-top:2px; font-size:14px; line-height:20px; color:var(--gray-500); }
  .al .car { flex:none; align-self:center; width:20px; height:20px; opacity:.5; }

  @media (max-width:640px) {
    .bar { flex-wrap:wrap; }
    .al { gap:10px; padding:14px 4px; }
      .al .car { display:none; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in">
  <h1>마이페이지</h1>
</div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>

  <div class="main">

    <section class="card">
      <div class="bar">
        <div class="chips" id="chips" role="tablist"></div>
        <button type="button" class="readall" id="readAll">모두 읽음</button>
      </div>
      <div id="list"></div>
    </section>
  </div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var me = OP.mypage('alarm'); if (!me) return;
  var D = OP.my, esc = D.esc, $ = function (s) { return document.querySelector(s); };
  var CAT = { project: ['프로젝트', 'assets/find/ic-flask.svg'], inquiry: ['문의', 'assets/find/ic-user.svg'], notice: ['공지', 'assets/detail/ic-info-circle.svg'] };
  var F = [['all', '전체'], ['project', '프로젝트'], ['inquiry', '문의'], ['notice', '공지']];
  var state = { f: 'all' };

  function render() {
    var ALL = D.alarms();
    $('#chips').innerHTML = F.map(function (f) {
      var n = ALL.filter(function (a) { return f[0] === 'all' || a.cat === f[0]; }).length;
      return '<button type="button" role="tab" data-f="' + f[0] + '"' + (state.f === f[0] ? ' class="on" aria-selected="true"' : '') + '>' + f[1] + '<span>' + n + '</span></button>';
    }).join('');
    var L = ALL.filter(function (a) { return state.f === 'all' || a.cat === state.f; });
    $('#readAll').disabled = !L.some(function (a) { return !a.read; });
    $('#list').innerHTML = L.length ? '<div class="alist">' + L.map(function (a) {
      return '<a class="al' + (a.read ? '' : ' new') + '" href="' + a.href + '" data-id="' + a.id + '">' +
        '<span class="tx"><span class="top"><span class="cat">' + CAT[a.cat][0] + (a.k ? ' · ' + esc(a.k) : '') + '</span><span>' + D.ymdhm(a.at) + '</span>' + (a.read ? '' : '<i class="dot" aria-label="읽지 않음"></i>') + '</span>' +
          '<p class="t">' + esc(a.t) + '</p>' + (a.sub ? '<p class="sub">' + esc(a.sub) + '</p>' : '') + '</span>' +
        '<img class="car" src="assets/find/ic-caret-right.svg" alt=""></a>';
    }).join('') + '</div>' : '<div class="empty"><b>알림이 없습니다</b></div>';
  }
  $('#chips').addEventListener('click', function (e) { var b = e.target.closest('[data-f]'); if (b) { state.f = b.dataset.f; render(); } });
  $('#list').addEventListener('click', function (e) { var a = e.target.closest('[data-id]'); if (a) D.markRead([a.dataset.id]); });
  $('#readAll').addEventListener('click', function () {
    D.markRead(D.alarms().filter(function (a) { return state.f === 'all' || a.cat === state.f; }).map(function (a) { return a.id; }));
    OP.mypage('alarm'); render(); OP.toast('알림을 모두 읽음 처리했습니다.');
  });
  render();
})();
</script>
</body>
</html>
