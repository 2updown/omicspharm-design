<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>분석 서비스 안내 · OmicsPharm</title>
<!-- 서비스 소개 > 분석 서비스 안내 (Figma 시안 없음 — 현재 홈페이지 /projects/guide 내용·이미지를 그대로 옮기고 우리 컴포넌트로 구성)
     레이아웃: Overview → 분석 서비스 탭(고른 서비스만 표시, 마크로젠 NGS 페이지 참고) → 시료 안내. 섹션 id: overview, genomics, transcriptomics, proteomics, glycoproteomics, metabolomics, olink, bioinformatics, biopharma, adc, specialized, samples -->
<link rel="stylesheet" href="assets/common/site.css?v=20261002m">
<script src="assets/common/site.js?v=20261002m"></script>
<style>
  :root {
    --teal-50:#edfefa; --teal-100:#d1faf1; --teal-500:#00bba6; --teal-600:#009788; --teal-700:#00786e; --bg-green:#f6faf9;
    --gray-50:#fafafa; --gray-100:#f5f5f5; --gray-200:#e5e5e5; --gray-300:#d4d4d4; --gray-400:#a3a3a3; --gray-500:#737373; --gray-600:#525252; --gray-700:#404040;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-padding-top:140px; }
  body { background:#fff; color:#000; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  ul { list-style:none; }
  .in { max-width:1320px; margin:0 auto; }
  .ico { display:inline-block; flex:none; background:currentColor; -webkit-mask:var(--i) center/contain no-repeat; mask:var(--i) center/contain no-repeat; }

  .page-head { padding:64px 60px 24px; text-align:center; }
  .page-head h1 { font-size:36px; font-weight:700; line-height:46px; letter-spacing:-.36px; }

  /* 분석 서비스 탭 (마크로젠 NGS 페이지 참고): Overview 아래 탭 → 고른 서비스 내용만 표시 */
  .svc { padding-top:32px; scroll-margin-top:70px; }
  .svc > h2 { font-size:32px; font-weight:700; line-height:42px; letter-spacing:-.32px; }
  .svc-bar { display:flex; align-items:center; gap:16px; margin-top:24px; border-bottom:1px solid var(--gray-200); }
  .tabs { flex:1; min-width:0; display:flex; gap:32px; overflow-x:auto; scrollbar-width:none; scroll-behavior:smooth; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs.drag { scroll-behavior:auto; cursor:grabbing; user-select:none; }
  .tabs button { position:relative; flex:none; display:flex; align-items:center; height:56px; padding:0 2px; font:inherit; font-size:17px; font-weight:500; line-height:24px; color:var(--gray-400); white-space:nowrap; background:none; border:0; cursor:pointer; }
  .tabs button:hover { color:#000; }
  .tabs button.on { color:#000; font-weight:700; }
  .tabs button.on::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--teal-600); }
  .arrows { flex:none; display:flex; gap:6px; }
  .arrows button { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border:1px solid var(--gray-300); border-radius:50%; background:#fff; cursor:pointer; }
  .arrows button:hover:not(:disabled) { border-color:var(--gray-500); }
  .arrows button:disabled { opacity:.35; cursor:default; }
  .arrows img { width:18px; height:18px; }
  .panel[hidden] { display:none !important; } /* .sec.full의 display:block보다 우선 */
  /* 탭을 누르면 새 패널의 사진·제목·설명·항목이 차례로 떠오름 */
  .panel.pop .rv { animation:panelUp .6s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--d, 0s); }
  @keyframes panelUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce) { .panel.pop .rv { animation:none; } }

  .body { padding:0 60px 96px; }
  .sec { display:grid; grid-template-columns:minmax(0,530px) minmax(0,1fr); gap:64px; align-items:start; padding:72px 0; border-bottom:1px solid var(--gray-200); }
  .sec.rev { grid-template-columns:minmax(0,1fr) minmax(0,530px); }
  .sec.rev .pic { order:2; }
  .sec.full { display:block; }
  .pic img { display:block; width:100%; aspect-ratio:529 / 407; object-fit:cover; border-radius:16px; }
  .eyebrow { font-size:14px; font-weight:600; line-height:20px; letter-spacing:.04em; color:var(--teal-600); text-transform:uppercase; }
  .sec h2 { font-size:32px; font-weight:700; line-height:42px; letter-spacing:-.32px; word-break:keep-all; }
  .desc { margin-top:20px; font-size:16px; line-height:1.75; color:var(--gray-700); word-break:keep-all; }
  .desc p + p { margin-top:12px; }

  /* 분석항목 카드 */
  .items { margin-top:28px; padding:24px; border:1px solid var(--gray-200); border-radius:12px; background:var(--gray-50); }
  .items h3 { font-size:16px; font-weight:600; line-height:22px; }
  .items ul { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .items li { display:flex; gap:10px; font-size:15px; line-height:22px; color:var(--gray-700); word-break:keep-all; }
  .items li .ico { width:20px; height:20px; margin-top:1px; color:var(--teal-600); --i:url(assets/service/ic-check-circle.svg); }

  /* Overview 특징 — 선으로 나눈 칸 4개 (마크로젠 서비스 페이지 참고), 아이콘 없음 */
  .feats { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); border-top:1px solid var(--gray-200); border-left:1px solid var(--gray-200); }
  .feat { padding:28px; border-right:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200); background:#fff; }
  /* 칸 아래쪽을 오른쪽 사진 아래 끝에 맞춤 */
  #overview { align-items:stretch; border-bottom:0; padding-bottom:40px; }
  #overview > div:not(.pic) { display:flex; flex-direction:column; }
  #overview .feats { flex:1; grid-auto-rows:1fr; }
  .feat b { display:block; font-size:19px; font-weight:700; line-height:27px; letter-spacing:-.19px; word-break:keep-all; }
  .feat p { margin-top:10px; font-size:16px; line-height:25px; color:var(--gray-600); word-break:keep-all; }

  /* Bioinformatics 그룹 */
  .groups { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:28px; }
  .groups .items { margin-top:0; padding:20px; }
  .groups .items:last-child { grid-column:1 / -1; }

  /* 바이오의약품 특성분석 표 */
  .head-row { display:grid; grid-template-columns:minmax(0,530px) minmax(0,1fr); gap:64px; align-items:center; }
  .bp { width:100%; margin-top:40px; border-collapse:collapse; border-top:2px solid #000; font-size:15px; line-height:22px; }
  .bp th { height:52px; padding:0 20px; background:var(--gray-50); border-bottom:1px solid var(--gray-300); font-weight:600; color:var(--gray-700); text-align:left; }
  .bp td { padding:12px 20px; border-bottom:1px solid var(--gray-200); color:var(--gray-700); vertical-align:top; }
  .bp td.cat { width:220px; background:#fff; font-weight:600; color:#000; border-right:1px solid var(--gray-200); vertical-align:middle; }
  .bp td.it { width:340px; color:#000; }
  .bp tr.first td { border-top:1px solid var(--gray-300); }

  /* 시료 */
  .samples { padding:72px 0 0; }
  .samples h2 { font-size:32px; font-weight:700; line-height:44px; letter-spacing:-.32px; word-break:keep-all; }
  .samples h2 em { font-style:normal; color:var(--teal-600); }
  /* 시료 안내: 큰 이미지 4칸 안에 텍스트 (현재 홈페이지 레이아웃). 스크롤하면 텍스트가 차례로 떠오르고, hover 시 이미지 살짝 확대 */
  .stiles { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px; margin-top:40px; }
  .stile { position:relative; width:100%; overflow:hidden; aspect-ratio:538 / 360; border-radius:16px; background:#0b2a26; isolation:isolate; }
  .stile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.2,.7,.2,1); }
  .stile::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,.38) 45%, rgba(0,0,0,.08) 100%); transition:opacity .4s; z-index:1; }
  .stile .tx { position:absolute; left:40px; right:40px; bottom:40px; z-index:2; color:#fff; }
  .stile b { display:block; font-size:24px; font-weight:700; line-height:32px; letter-spacing:-.24px; word-break:keep-all; }
  .stile small { display:block; margin-top:2px; font-size:15px; font-weight:500; line-height:22px; color:rgba(255,255,255,.8); }
  .stile ul { display:flex; flex-direction:column; gap:6px; margin-top:16px; }
  .stile li { display:flex; gap:8px; font-size:15px; line-height:22px; color:rgba(255,255,255,.92); word-break:keep-all; }
  .stile li::before { content:""; flex:none; width:4px; height:4px; margin-top:9px; border-radius:50%; background:#5ee6d3; }
  .stile:hover img { transform:scale(1.05); }
  .stile:hover::after { opacity:.85; }
  /* 스크롤 진입 시 텍스트만 떠오름 */
  .stile .tx { opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease; transition-delay:var(--d, 0s); }
  .stile.in .tx { opacity:1; transform:none; }
  @media (prefers-reduced-motion:reduce) { .stile .tx { opacity:1; transform:none; transition:none; } .stile img { transition:none; } }

  /* 하단 안내 */
  .cta { display:flex; align-items:center; justify-content:space-between; gap:24px; margin-top:72px; padding:32px 40px; border:1px solid var(--gray-200); border-radius:16px; }
  .cta h2 { font-size:22px; font-weight:700; line-height:30px; }
  .cta p { margin-top:4px; font-size:15px; line-height:22px; color:var(--gray-600); }
  .cta div:last-child { display:flex; gap:8px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; min-width:140px; padding:0 20px; border-radius:8px; font-size:16px; font-weight:500; line-height:22px; white-space:nowrap; }
  .btn.pri { background:var(--teal-600); color:#fff; } .btn.pri:hover { background:var(--teal-700); }
  .btn.line { border:1px solid var(--gray-300); background:#fff; color:var(--gray-700); } .btn.line:hover { background:var(--gray-50); }

  @media (max-width:1180px) {
    .page-head, .body { padding-left:24px; padding-right:24px; }
    .sec, .sec.rev, .head-row { gap:40px; }
  }
  @media (max-width:900px) {
    .sec, .sec.rev, .head-row { grid-template-columns:1fr; gap:28px; }
    #overview .feats { flex:none; grid-auto-rows:auto; }
    .sec.rev .pic { order:0; }
    .bp td.cat { width:auto; }
    .bp td.it { width:auto; }
  }
  @media (max-width:640px) {
    html { scroll-padding-top:128px; }
    .page-head { padding:40px 16px 16px; }
    .page-head h1 { font-size:28px; line-height:38px; }
    .svc { padding-top:16px; }
    #overview { padding-bottom:32px; }
    .svc > h2 { font-size:24px; line-height:34px; }
    .tabs { gap:20px; }
    .tabs button { height:52px; font-size:15px; }
    .arrows { display:none; }
    /* 모바일: 탭 줄은 손으로 밀어 자유롭게 움직이고, 서비스는 탭을 눌러야 바뀜 */
    .body { padding:0 16px 64px; }
    .sec { padding:48px 0; }
    .pic img { border-radius:12px; }
    .sec h2, .samples h2 { font-size:24px; line-height:34px; }
    .desc { margin-top:14px; font-size:15px; }
    .items { margin-top:20px; padding:18px 16px; }
    .items li { font-size:14px; }
    .feats, .groups { grid-template-columns:1fr; }
    /* 표 → 분류별 블록 */
    .bp, .bp tbody, .bp tr, .bp td { display:block; width:100%; }
    .bp thead { display:none; }
    .bp tr { display:grid; grid-template-columns:1fr; padding:10px 0; border-bottom:1px solid var(--gray-200); }
    .bp td { padding:2px 0; border:0; }
    .bp td.cat { padding:14px 0 6px; border:0; font-size:16px; color:var(--teal-700); }
    .bp tr.first td { border-top:0; }
    .bp td.it { font-weight:500; }
    .bp td.pp { font-size:14px; color:var(--gray-500); }
    .stiles { grid-template-columns:1fr; gap:12px; margin-top:28px; }
    .stile { aspect-ratio:4 / 3; border-radius:12px; }
    .stile .tx { left:24px; right:24px; bottom:24px; }
    .stile b { font-size:20px; line-height:28px; }
    .stile small, .stile li { font-size:14px; }
    .cta { flex-direction:column; align-items:stretch; padding:24px 20px; margin-top:48px; }
    .cta div:last-child .btn { flex:1; min-width:0; }
  }
</style>
</head>
<body>
<div data-op-gnb="service"></div>

<section class="page-head"><div class="in"><h1>분석 서비스 안내</h1></div></section>


<main class="body"><div class="in" id="secs"></div></main>

<div data-op-footer></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var I = 'assets/service/';
  var CHECK = '<span class="ico"></span>';
  var li = function (arr) { return arr.map(function (t) { return '<li>' + CHECK + '<span>' + t + '</span></li>'; }).join(''); };
  var items = function (arr, title) { return '<div class="items"><h3>' + (title || '분석항목') + '</h3><ul>' + li(arr) + '</ul></div>'; };
  var desc = function (ps) { return '<div class="desc">' + ps.map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div>'; };

  // 현재 홈페이지 /projects/guide 내용 그대로
  var S = [
    { id: 'genomics', left: 1, img: '04', name: 'Genomics', ps: [
      'Genomics 분석은 유전체 DNA의 염기서열 변이와 구조적 특성을 종합적으로 분석하여 질병의 유전적 원인과 분자적 기전을 규명하는 핵심 분석 방법입니다.',
      '차세대 염기서열 분석(NGS) 기술과 고도화된 Bioinformatics 파이프라인을 기반으로 질병 관련 변이 탐색, 유전적 위험도 평가, 정밀의료 연구 등 다양한 연구 및 임상 분야에서 활용 가능한 정보를 제공합니다.'],
      items: ['Whole Genome Sequencing (WGS) 분석', 'Whole Exome Sequencing (WES) 분석', 'Targeted Sequencing 분석', 'SNV / INDEL / CNV / Structural Variant 분석', 'Variant Annotation 및 Pathogenicity 해석 (ClinVar, gnomAD 등 기반)', 'Single Cell DNA Sequencing 분석'] },
    { id: 'transcriptomics', img: '11', name: 'Transcriptomics', ps: [
      'Transcriptomics 분석은 세포 또는 조직에서 발현되는 RNA 전사체(transcriptome)를 분석하여 유전자 발현 변화와 생물학적 기능 변화를 규명하는 핵심 분석 방법입니다.',
      'RNA-seq 기반의 정량 분석과 다양한 bioinformatics 분석을 통해 질병 기전 연구, 바이오마커 발굴, 약물 반응 분석 등에 활용되는 정밀한 전사체 정보를 제공합니다.'],
      items: ['Bulk RNA-seq 기반 유전자 발현 분석', 'Differential Gene Expression 분석', 'Alternative Splicing 분석', 'Fusion Gene 분석', 'Functional Pathway 및 Gene Set Enrichment 분석', 'Single Cell RNA-seq 분석'] },
    { id: 'proteomics', left: 1, img: '02', name: 'Proteomics', ps: [
      'Proteomics 분석은 단백질의 전체적인 발현과 변화를 한눈에 파악하여 생체 내 복잡한 분자 메커니즘을 해독하는 분석 방법입니다.',
      '최첨단 질량분석기와 AI 기술을 활용해 얻어진 Proteomics 데이터는 질병 관련 바이오마커 발굴, 약물 타겟 연구, 그리고 정밀의학 개발 등 다양한 분야에 활용 가능한 정보를 제공합니다.'],
      items: ['단백질 정성 및 정량 분석', '다양한 Post translational modifications 분석', '인산화단백질 분석', 'DDA와 DIA 분석', 'Targeted MS 분석 (PRM, MRM)'] },
    { id: 'glycoproteomics', img: '03', name: 'Glycoproteomics', ps: [
      'Glycoproteomics는 단백질의 당화 패턴과 구조적 변화를 정밀하게 분석하여 질병의 발생 메커니즘, 바이오마커 발굴, 신약 개발에 필수적인 정보를 제공합니다.',
      '최신 질량분석기와 AI 기반 분석 플랫폼을 통해 Glycoproteomics 데이터를 고속 처리하며, 복잡한 당단백질 네트워크를 해독하는 최적의 솔루션을 제공합니다.'],
      items: ['당단백질 정성 및 정량 분석 (N-glycosylation &amp; O-glycosylation)', 'Site-specific Glycosylation Analysis', '질병 상태와 연관된 특이적 Glycan 또는 당화 패턴 발굴', '항체, 융합 단백질 등 치료용 Glycoprotein의 당화 특성화', '바이오의약품 생산 공정 중 당화 일관성 확인'] },
    { id: 'metabolomics', left: 1, img: '05', name: 'Metabolomics', ps: [
      'Metabolomics 분석은 생체 내 대사산물의 변화를 체계적으로 분석하여 생명현상의 메커니즘을 이해하고, 질병과 관련된 생체지표를 발굴하는 첨단 연구 기술입니다.',
      '최첨단 질량분석기를 활용해 얻어진 Metabolomics 데이터는 질병 진단, 약물 반응 모니터링, 그리고 정밀의학 개발 등 다양한 분야에 폭넓게 적용되고 있습니다.',
      '비표적 분석부터 표적 대사체 분석까지 폭넓은 접근이 가능하며, 정밀한 통계 분석을 통해 고객에게 차별화된 인사이트를 제공합니다.'],
      items: ['대사체 정성 및 정량 분석', 'DDA와 DIA 분석', 'Metabolic pathways 분석', 'Targeted MS 분석 (PRM, MRM)'] },
    { id: 'olink', img: '13', name: 'Olink Proteomics', ps: [
      'Olink 분석은 Proximity Extension Assay(PEA) 기술을 활용해 소량의 시료에서 다수의 단백질 바이오마커를 고감도·고특이도로 정량하는 분석 서비스입니다.',
      '두 개의 항체가 동일 표적 단백질에 결합할 때 형성되는 DNA reporter를 qPCR 또는 NGS로 판독하여, 염증·종양·심혈관·신경질환 등 다양한 연구 분야에서 biomarker discovery와 validation에 활용됩니다.'],

  html += '<div class="svc" id="service"><h2>분석 서비스</h2><div class="svc-bar"><div class="tabs" id="tabs" role="tablist">' +

  function show(id, scroll, quiet) {
    if (ids.indexOf(id) < 0) id = ids[0];

  (function () {
