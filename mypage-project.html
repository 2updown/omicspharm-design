<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>마이페이지 · 프로젝트 관리 · OmicsPharm</title>
<!-- 마이페이지 > 프로젝트 관리 > 의뢰내용. 현행 사이트 구성을 새 디자인 체계(Figma 토큰·컴포넌트)로 옮긴 임시 화면.
     분석 의뢰 제출 시 omicspharm-register.html이 localStorage 'op.submitted'에 저장한 내용을 보여준다 -->
<link rel="stylesheet" href="assets/common/site.css?v=20261001w">
<link rel="stylesheet" href="assets/common/mypage.css?v=20261001w">
<script src="assets/common/site.js?v=20261001w"></script>
<script src="assets/common/mypage.js?v=20261001w"></script>
<style>
  :root {
    --teal-50:#edfefa; --teal-600:#009788; --teal-700:#00786e; --bg-green:#f6faf9;
    --gray-50:#fafafa; --gray-100:#f5f5f5; --gray-200:#e5e5e5; --gray-300:#d4d4d4; --gray-400:#a3a3a3; --gray-500:#737373; --gray-600:#525252;
    --orange-600:#fd4900; --blue-50:#edf6ff; --blue-600:#0065f4;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--gray-50); color:#000; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  [hidden] { display:none !important; }

  .page-head { padding:32px 60px; }
  .page-head .in, .body > .in { max-width:1320px; margin:0 auto; }
  .page-head h1 { font-size:36px; font-weight:700; line-height:46px; letter-spacing:-.36px; }
  .page-head p { margin-top:12px; font-size:16px; line-height:22px; }
  .body { padding:20px 60px 60px; }

  /* 오른쪽 */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; gap:24px; }
  .intro { padding:24px; border-radius:16px; background:var(--bg-green); border:1px solid #dfece8; }
  .intro h2 { font-size:18px; font-weight:600; line-height:24px; letter-spacing:-.18px; }
  .intro p { margin-top:8px; font-size:14px; line-height:20px; color:var(--gray-600); }
  .card { display:flex; flex-direction:column; gap:24px; padding:24px; background:#fff; border:1px solid var(--gray-200); border-radius:16px; }

  .toprow { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; padding-bottom:24px; border-bottom:1px solid var(--gray-200); }
  .ptabs { display:flex; gap:8px; flex-wrap:wrap; }
  .ptabs button { height:40px; padding:0 16px; border-radius:999px; font-size:14px; font-weight:500; line-height:20px; background:var(--gray-100); color:var(--gray-400); }
  .ptabs button.on { background:var(--teal-600); color:#fff; }
  .ask { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .ask a { display:inline-flex; align-items:center; height:40px; padding:0 16px; border-radius:999px; background:var(--teal-600); color:#fff; font-size:14px; font-weight:500; line-height:20px; }
  .ask a:hover { background:var(--teal-700); }
  .ask small { font-size:12px; line-height:18px; letter-spacing:-.12px; color:var(--gray-500); }

  .phead { display:flex; flex-direction:column; gap:12px; }
  .prow { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .badges { display:flex; gap:8px; }
  .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:8px; font-size:12px; font-weight:500; line-height:18px; letter-spacing:-.12px; }
  .badge.tag { border:1px solid var(--teal-600); color:var(--teal-600); }
  .badge.state { border:1px solid var(--blue-600); color:var(--blue-600); background:var(--blue-50); }
  .reg { font-size:12px; line-height:18px; letter-spacing:-.12px; color:var(--gray-500); }
  .ptitle { display:flex; align-items:center; gap:8px; font-size:24px; font-weight:600; line-height:32px; letter-spacing:-.24px; }
  /* 뒤로 가기: 누르는 영역 36px + hover 배경 */
  .ptitle .back { display:flex; align-items:center; justify-content:center; width:36px; height:36px; margin-left:-6px; border-radius:8px; flex:none; transition:background .15s; }
  .ptitle .back:hover { background:var(--gray-100); }
  .ptitle .back:active { background:var(--gray-200); }
  .ptitle .back:focus-visible { outline:2px solid var(--teal-600); outline-offset:1px; }
  .ptitle img { width:24px; height:24px; }
  .period { display:flex; align-items:center; gap:12px; height:40px; padding:0 16px; border:1px solid var(--gray-300); border-radius:999px; font-size:14px; line-height:20px; white-space:nowrap; }
  .period b { font-weight:600; }
  .period em { font-style:normal; color:var(--teal-600); font-weight:500; }

  .summary { display:grid; grid-template-columns:repeat(4, auto); justify-content:space-between; gap:12px 24px; padding:20px 24px; border-radius:8px; background:var(--bg-green); }
  .summary div { display:flex; align-items:center; gap:8px; font-size:14px; line-height:20px; white-space:nowrap; }
  .summary img { width:20px; height:20px; filter:brightness(0); }
  .summary em { font-style:normal; color:var(--gray-500); }

  .sections { display:flex; flex-direction:column; gap:36px; }
  .sec { display:flex; flex-direction:column; gap:12px; }
  .sec h3 { font-size:18px; font-weight:600; line-height:24px; letter-spacing:-.18px; }
  .kv { border-top:2px solid #000; }
  .kv > div { display:flex; border-bottom:1px solid var(--gray-200); font-size:14px; line-height:20px; }
  .kv dt { width:270px; flex:none; padding:12px 18px; background:var(--gray-100); font-weight:500; }
  .kv dd { flex:1; min-width:0; padding:12px 18px; white-space:pre-line; word-break:break-word; }
  /* 분석파트너 프로젝트 관리 */
  .psearch { display:flex; align-items:center; gap:8px; height:48px; padding:0 8px 0 16px; border:1px solid var(--gray-300); border-radius:8px; background:#fff; }
  .psearch:focus-within { border-color:var(--teal-700); box-shadow:0 0 0 3px #00786e33; }
  .psearch input { flex:1; min-width:0; border:0; outline:0; background:none; font-size:15px; line-height:22px; }
  .psearch input::placeholder { color:var(--gray-400); }
  .psearch input::-webkit-search-cancel-button { display:none; }
  .psearch button { display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:6px; }
  .psearch button:hover { background:var(--gray-100); }
  .psearch img { width:20px; height:20px; }
  .pbar { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .pbar .total { font-size:16px; font-weight:500; line-height:22px; }
  .pbar .total b { color:var(--teal-600); }
  .sort { position:relative; }
  .sort select { height:36px; padding:0 32px 0 12px; border:0; background:none; font:inherit; font-size:14px; font-weight:500; color:var(--gray-700); appearance:none; -webkit-appearance:none; cursor:pointer; }
  .sort::after { content:""; position:absolute; right:8px; top:10px; width:16px; height:16px; background:url(assets/find/ic-chevron-down.svg) center/contain no-repeat; pointer-events:none; }
  .unread { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-radius:8px; background:var(--gray-100); font-size:14px; line-height:20px; color:var(--gray-600); }
  .unread b { color:var(--orange-600); font-weight:600; }
  .unread label { display:inline-flex; align-items:center; gap:6px; flex:none; font-weight:500; color:var(--gray-700); cursor:pointer; }
  .unread input { width:16px; height:16px; accent-color:var(--teal-600); }
  .badge.qa { background:var(--orange-600); color:#fff; border:1px solid var(--orange-600); }
  .badge.fin { border:1px solid var(--gray-300); color:var(--gray-600); background:var(--gray-100); }
  /* 단계 진행 표시 */
  .stages { display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:4px; }
  .stages li { list-style:none; display:flex; flex-direction:column; gap:8px; font-size:13px; font-weight:500; line-height:18px; color:var(--gray-400); text-align:center; }
  .stages li::before { content:""; height:6px; border-radius:99px; background:var(--gray-200); }
  .stages li.done { color:var(--gray-600); } .stages li.done::before { background:#8fd9cf; }
  .stages li.cur { color:var(--teal-700); font-weight:700; } .stages li.cur::before { background:var(--teal-600); }
  .todo { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:20px 24px; border-radius:8px; background:var(--bg-green); }
  .todo b { display:block; font-size:16px; font-weight:600; line-height:22px; }
  .todo p { margin-top:4px; font-size:14px; line-height:20px; color:var(--gray-600); }
  .demo-note { font-size:12px; line-height:18px; color:var(--gray-400); }
  /* 수정·삭제 */
  .pacts { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:24px; border-top:1px solid var(--gray-200); }
  .pacts p { font-size:14px; line-height:20px; color:var(--gray-500); }
  .pacts div { display:flex; gap:8px; flex:none; }
  .pacts .del { color:#f00011; }
  .pacts .del:hover { background:#fff1f2; border-color:#f00011; }
  .note { padding:24px; border-radius:8px; background:var(--bg-green); font-size:16px; line-height:22px; white-space:pre-line; }

  /* 프로젝트 관리 목록: 프로젝트 찾기 목록형 카드(Project-list Type=card)와 동일 */
  .list-head { display:flex; align-items:center; justify-content:space-between; }
  .list-head .total { font-size:16px; font-weight:500; line-height:22px; color:#1b1d1f; }
  .list { display:flex; flex-direction:column; gap:12px; }
  .lcard { display:flex; flex-direction:column; gap:16px; padding:16px 12px; background:#fff; border:1px solid var(--gray-200); border-radius:12px; transition:border-color .15s, box-shadow .15s; }
  .lcard:hover { border-color:#00bba6; box-shadow:0 4px 8px #00000014, 0 0 2px #0000000a; }
  .lcard .head { display:flex; flex-direction:column; gap:16px; padding-bottom:12px; border-bottom:1px solid var(--gray-200); }
  .lcard .row1 { display:flex; align-items:center; justify-content:space-between; }
  .lcard .dday { font-size:12px; line-height:18px; letter-spacing:-.12px; color:var(--gray-500); }
  .lcard h3 { font-size:20px; font-weight:600; line-height:28px; letter-spacing:-.2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .lcard .info { display:flex; flex-direction:column; gap:10px; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:12px; font-size:14px; line-height:20px; }
  .meta > span { display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
  .meta > span + span::before { content:""; width:0; height:14px; border-left:1px solid var(--gray-300); margin-right:4px; }
  .meta em { font-style:normal; color:var(--gray-500); }
  .lcard .reg { font-size:12px; line-height:18px; letter-spacing:-.12px; color:#9b9b9b; }

  .empty { padding:80px 24px; text-align:center; }
  .empty b { display:block; font-size:18px; font-weight:600; line-height:24px; }
  .empty p { margin-top:8px; font-size:14px; line-height:20px; color:var(--gray-500); }
  .empty a { display:inline-flex; align-items:center; height:48px; margin-top:24px; padding:0 24px; border-radius:8px; background:var(--teal-600); color:#fff; font-size:16px; font-weight:500; }

  @media (max-width:1180px) { .page-head, .body { padding-left:24px; padding-right:24px; } }
  @media (max-width:960px) {
    .summary { grid-template-columns:repeat(2, auto); justify-content:start; }
    .kv dt { width:40%; }
  }
  @media (max-width:640px) {
    .page-head h1 { font-size:28px; line-height:38px; }
    .page-head, .body { padding-left:16px; padding-right:16px; }
    .card { padding:16px; }
    .toprow, .prow { flex-direction:column; align-items:flex-start; }
    .ask { align-items:flex-start; }
    .ptitle { font-size:20px; line-height:28px; }
    .summary { grid-template-columns:1fr; }
    .kv > div { flex-direction:column; }
    .kv dt { width:100%; }
    .pacts { flex-direction:column; align-items:stretch; }
    .unread { flex-direction:column; align-items:flex-start; }
    .stages { grid-template-columns:repeat(3, minmax(0,1fr)); row-gap:12px; }
    .todo { flex-direction:column; align-items:stretch; }
    .pacts div .btn { flex:1; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in">
  <h1>마이페이지</h1>
</div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>

  <div class="main">

    <div class="card" id="card">
      <div class="toprow">
        <div class="ptabs" role="tablist">
          <button type="button" class="on" role="tab" aria-selected="true">의뢰내용</button>
          <button type="button" role="tab" data-soon="견적서">견적서</button>
          <button type="button" role="tab" data-soon="계약정보">계약정보</button>
          <button type="button" role="tab" data-soon="결과보고서">결과보고서</button>
        </div>
        <div class="ask">
          <a href="contact.html?type=project" id="askLink">문의하기 (0 / 0)</a>
          <small>견적, 계약, 분석, 결과, 기타 관련 문의는 클릭해 주세요.</small>
        </div>
      </div>

      <div id="project"></div>
    </div>
  </div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  if (!OP.mypage('project')) return; // 로그인 확인 + 왼쪽 프로필·메뉴

  if (OP.session().role !== 'client') { partnerView(); return; } // 분석파트너·컨설턴트 같은 화면

  // 분석파트너: 셀키 매칭 후 계약된 프로젝트만 (계약 → 분석 → 보고서 등록 → 보고서 검토 → 보고서 승인 → 완료)
  function partnerView() {
    var D = OP.my, STAGES = D.P_STAGES, ALL = D.partnerProjects();
    var pid = new URLSearchParams(location.search).get('id');
    var dotd = function (v) { return v ? v.replace(/-/g, '.') : '-'; };
    var dday = function (v) { var n = Math.round((new Date(v) - new Date(2026, 9, 1)) / 864e5); return n >= 0 ? '납기 D-' + String(n).padStart(2, '0') : '납기 ' + (-n) + '일 경과'; };
    var stBadge = function (x) { return '<span class="badge ' + (x.stage === '완료' ? 'fin' : 'state') + '">' + x.stage + '</span>'; };
    $('.toprow').hidden = true;

    if (pid) {
      var x = ALL.filter(function (p) { return p.id === pid; })[0];
      if (!x) { location.replace('mypage-project.html'); return; }
      var k = STAGES.indexOf(x.stage);
      var TODO = {
        '계약': ['계약서를 확인해주세요', '계약 내용 확인 후 시료 수령 일정을 클라이언트와 협의합니다.', '계약서 확인'],
        '분석': ['분석이 진행 중입니다', '분석이 끝나면 결과보고서를 등록해주세요.', '진행 상황 공유'],
        '보고서 등록': ['결과보고서를 등록해주세요', '보고서를 등록하면 OmicsPharm이 검토합니다.', '결과보고서 등록'],
        '보고서 검토': ['OmicsPharm이 보고서를 검토하고 있습니다', '수정 요청이 있으면 알림으로 알려드립니다.', ''],
        '보고서 승인': ['클라이언트가 보고서를 확인하고 있습니다', '승인되면 프로젝트가 완료됩니다.', ''],
        '완료': ['프로젝트가 완료되었습니다', x.review ? '클라이언트가 남긴 리뷰를 확인해보세요.' : '수고하셨습니다.', x.review ? '리뷰 보기' : '']
      }[x.stage];
      $('#project').outerHTML =
        '<div class="phead">' +
          '<div class="prow"><div class="badges"><span class="badge tag">' + esc(x.svc) + '</span>' + stBadge(x) + (x.qa ? '<span class="badge qa">Q&amp;A ' + x.qa + '</span>' : '') + '</div>' +
            '<span class="reg">계약일 ' + dotd(x.contract) + ' · 프로젝트 번호 ' + esc(x.id) + '</span></div>' +
          '<div class="prow"><h2 class="ptitle"><a class="back" href="mypage-project.html" aria-label="뒤로 가기" title="뒤로 가기"><img src="assets/detail/ic-caret-left.svg" alt=""></a>' + esc(x.title) + '</h2>' +
            '<div class="period"><b>납기일</b><span>' + dotd(x.due) + '</span>' + (x.stage === '완료' ? '' : '<em>' + dday(x.due).replace('납기 ', '') + '</em>') + '</div></div>' +
        '</div>' +
        '<ol class="stages" aria-label="진행 단계">' + STAGES.map(function (t, i) { return '<li class="' + (i < k ? 'done' : i === k ? 'cur' : '') + '"' + (i === k ? ' aria-current="step"' : '') + '>' + t + '</li>'; }).join('') + '</ol>' +
        '<div class="todo"><div><b>' + TODO[0] + '</b><p>' + TODO[1] + '</p></div>' + (TODO[2] ? '<a class="btn primary" href="#" data-soon="' + TODO[2] + '">' + TODO[2] + '</a>' : '') + '</div>' +
        '<div class="sections"><section class="sec"><h3>프로젝트 정보</h3><dl class="kv">' +
          [['클라이언트', x.client], ['분석 서비스', x.svc], ['시료 수', x.samples + '개'], ['계약 금액', x.amount + ' (VAT 별도)'], ['계약일', dotd(x.contract)], ['납기일', dotd(x.due)]]
            .map(function (r) { return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') +
        '</dl></section></div>' +
        '<p class="demo-note">※ 화면 확인용 예시 프로젝트입니다.</p>';
      document.title = x.title + ' · 마이페이지 · OmicsPharm';
      return;
    }

    var st = { q: '', stage: '전체', sort: 'new', unread: false };
    $('#project').outerHTML =
      '<form class="psearch" id="pq" role="search"><input type="search" id="pqIn" placeholder="프로젝트명을 검색해보세요." aria-label="프로젝트 검색" autocomplete="off"><button type="submit" aria-label="검색"><img src="assets/find/ic-search.svg" alt=""></button></form>' +
      '<div class="pbar"><span class="total" id="pTotal"></span><label class="sort"><select id="pSort" aria-label="정렬"><option value="new">최신등록순</option><option value="due">납기임박순</option></select></label></div>' +
      '<div class="chips" id="pChips" role="tablist"></div>' +
      '<div class="unread" id="pUnread"></div>' +
      '<div class="list" id="pList"></div>' +
      '<p class="demo-note">※ 화면 확인용 예시 프로젝트입니다.</p>';
    var qaN = ALL.reduce(function (n, p) { return n + (p.qa || 0); }, 0), rvN = ALL.reduce(function (n, p) { return n + (p.review || 0); }, 0);
    $('#pUnread').innerHTML = '<span>확인하지 않은 Q&amp;A <b>' + qaN + '건</b>과 리뷰 <b>' + rvN + '건</b>이 있습니다.</span><label><input type="checkbox" id="pOnly">미열람글만 보기</label>';
    function draw() {
      var q = st.q.trim().toLowerCase();
      var base = ALL.filter(function (p) { return (!q || p.title.toLowerCase().indexOf(q) > -1) && (!st.unread || p.qa || p.review); });
      $('#pChips').innerHTML = ['전체'].concat(STAGES).map(function (t) {
        var n = t === '전체' ? base.length : base.filter(function (p) { return p.stage === t; }).length;
        return '<button type="button" role="tab" data-st="' + t + '"' + (st.stage === t ? ' class="on" aria-selected="true"' : '') + '>' + t + '<span>' + n + '</span></button>';
      }).join('');
      var L = base.filter(function (p) { return st.stage === '전체' || p.stage === st.stage; })
        .sort(st.sort === 'due' ? function (a, b) { return (a.stage === '완료') - (b.stage === '완료') || new Date(a.due) - new Date(b.due); } : function (a, b) { return b.at - a.at; });
      $('#pTotal').innerHTML = '총 <b>' + L.length + '</b>건';
      $('#pList').innerHTML = L.map(function (x) {
        return '<a class="lcard" href="mypage-project.html?id=' + x.id + '"><div class="head">' +
          '<div class="row1"><div class="badges"><span class="badge tag">' + esc(x.svc) + '</span>' + stBadge(x) +
            (x.qa ? '<span class="badge qa">Q&amp;A ' + x.qa + '</span>' : '') + (x.review ? '<span class="badge qa">리뷰 ' + x.review + '</span>' : '') + '</div>' +
            '<span class="dday">' + (x.stage === '완료' ? '완료' : dday(x.due)) + '</span></div>' +
          '<h3>' + esc(x.title) + '</h3></div>' +
          '<div class="info"><div class="meta"><span>' + esc(x.client) + '</span><span><em>샘플</em>' + x.samples + '개</span><span><em>계약금액</em>' + esc(x.amount) + '</span><span><em>납기일</em>' + dotd(x.due) + '</span></div>' +
          '<p class="reg">계약일 ' + dotd(x.contract) + ' · 프로젝트 번호 ' + esc(x.id) + '</p></div></a>';
      }).join('') || '<div class="empty"><b>' + (st.q || st.unread ? '조건에 맞는 프로젝트가 없습니다' : '진행 중인 프로젝트가 없습니다') + '</b><p>OmicsPharm의 매칭을 거쳐 계약된 프로젝트가 여기에 표시됩니다.</p></div>';
    }
    $('#pq').addEventListener('submit', function (e) { e.preventDefault(); st.q = $('#pqIn').value; draw(); });
    $('#pqIn').addEventListener('input', function () { if (!this.value && st.q) { st.q = ''; draw(); } });
    $('#pSort').addEventListener('change', function () { st.sort = this.value; draw(); });
    $('#pOnly').addEventListener('change', function () { st.unread = this.checked; draw(); });
    $('#pChips').addEventListener('click', function (e) { var b = e.target.closest('[data-st]'); if (b) { st.stage = b.dataset.st; draw(); } });
    draw();
  }

  var list = OP.my.myProjects(); // 분석파트너는 클라이언트 의뢰를 볼 수 없음 (셀키가 견적 요청을 보낸 의뢰만)
  var partner = OP.session().role !== 'client';
  var id = new URLSearchParams(location.search).get('id');
  var d = id ? list.filter(function (x) { return x.id === id; })[0] : null;
  var dot = function (v) { return v ? v.replace(/-/g, '.') : '-'; };
  var ymd = function (t) { var x = new Date(t); return x.getFullYear() + '.' + ('0' + (x.getMonth() + 1)).slice(-2) + '.' + ('0' + x.getDate()).slice(-2); };

  // ?id 없으면 프로젝트 관리 목록 (최근 제출 순)
  if (!id && list.length) {
    var card = function (x) {
      var days = x.to ? Math.round((new Date(x.to) - new Date(new Date().toDateString())) / 864e5) : null;
      return '<a class="lcard" href="mypage-project.html?id=' + encodeURIComponent(x.id) + '"><div class="head">' +
        '<div class="row1"><div class="badges"><span class="badge tag">' + esc(x.svc) + '</span><span class="badge state">의뢰접수</span></div>' +
          (days === null ? '' : '<span class="dday">' + (days >= 0 ? '모집 종료 D-' + String(days).padStart(2, '0') : '모집 종료') + '</span>') + '</div>' +
        '<h3>' + esc(x.title) + '</h3></div>' +
        '<div class="info"><div class="meta">' +
          '<span>' + esc((x.org || '-') + (x.manager ? '(' + x.manager + ')' : '')) + '</span>' +
          '<span><em>샘플</em>' + (x.samples ? esc(x.samples) + '개' : '-') + '</span>' +
          '<span><em>희망완료일</em>' + dot(x.due) + '</span>' +
          '<span><em>모집 기한</em>' + (x.from || x.to ? dot(x.from) + ' ~ ' + dot(x.to) : '-') + '</span>' +
        '</div><p class="reg">등록일 ' + ymd(x.at) + ' · 의뢰번호 ' + esc(x.id) + '</p></div></a>';
    };
    $('.toprow').hidden = true; // 탭·문의하기는 프로젝트 상세에서만
    $('#project').outerHTML = '<div class="list-head"><span class="total">총 ' + list.length + '개</span></div><div class="list">' + list.map(card).join('') + '</div>';
    return;
  }

  if (id && !d && list.length) { location.replace('mypage-project.html'); return; } // 없는 의뢰번호면 목록으로
  if (!d && partner) {
    $('.toprow').hidden = true;
    $('#project').innerHTML = '<div class="empty"><b>받은 견적 요청이 없습니다</b><p>OmicsPharm이 분석 의뢰에 맞는 파트너로 선정해 견적을 요청하면 여기에서 의뢰 내용을 확인하고 견적을 보낼 수 있습니다.</p></div>';
    return;
  }
  if (!d) {
    $('#project').innerHTML = '<div class="empty"><b>제출한 프로젝트가 없습니다</b><p>분석 의뢰를 제출하면 여기에서 진행상황과 내용을 확인할 수 있습니다.</p>' +
      '<a href="omicspharm-register.html" data-client-only>프로젝트 의뢰하기</a></div>';
    return;
  }
  $('#askLink').href = 'contact.html?type=project&ref=' + encodeURIComponent(d.title || d.id) + (d.svc ? '&svc=' + encodeURIComponent(d.svc) : '');
  var closed = d.to && new Date(d.to) < new Date(new Date().toDateString());

  var html =
    '<div class="phead">' +
      '<div class="prow"><div class="badges"><span class="badge tag">' + esc(d.svc) + '</span><span class="badge state">의뢰접수</span></div>' +
        '<span class="reg">등록일 ' + ymd(d.at) + (d.updatedAt ? ' · 수정일 ' + ymd(d.updatedAt) : '') + ' · 의뢰번호 ' + esc(d.id) + '</span></div>' +
      '<div class="prow"><h2 class="ptitle"><a class="back" href="mypage-project.html" aria-label="뒤로 가기" title="뒤로 가기"><img src="assets/detail/ic-caret-left.svg" alt=""></a>' + esc(d.title) + '</h2>' +
        (d.from || d.to ? '<div class="period"><b>모집기한</b><span>' + dot(d.from) + ' ~ ' + dot(d.to) + '</span><em>' + (closed ? '모집마감' : '모집중') + '</em></div>' : '') + '</div>' +
    '</div>' +
    '<div class="summary">' +
      '<div><img src="assets/find/ic-user.svg" alt="">' + esc((d.org || '-') + (d.manager ? '(' + d.manager + ')' : '')) + '</div>' +
      '<div><img src="assets/find/ic-flask.svg" alt=""><em>샘플</em>' + (d.samples ? esc(d.samples) + '개' : '-') + '</div>' +
      '<div><img src="assets/find/ic-timer.svg" alt=""><em>희망완료일</em>' + (d.due ? '~' + dot(d.due) : '-') + '</div>' +
      '<div><img src="assets/detail/ic-currency-krw.svg" alt=""><em>예상금액</em>' + esc(d.budget || '-') + '</div>' +
    '</div>' +
    '<div class="sections">' +
      '<section class="sec"><h3>기본 정보</h3><dl class="kv">' +
        '<div><dt>분석 서비스</dt><dd>' + esc(d.svc) + '</dd></div>' +
        (d.purpose ? '<div><dt>연구 내용 및 목적</dt><dd>' + esc(d.purpose) + '</dd></div>' : '') +
        (d.open ? '<div><dt>공개여부</dt><dd>' + esc(d.open) + '</dd></div>' : '') +
      '</dl></section>' +
      (d.sections || []).map(function (sec) {
        if (sec.note) return '<section class="sec"><h3>' + esc(sec.title) + '</h3><p class="note">' + esc(sec.note) + '</p></section>';
        return '<section class="sec"><h3>' + esc(sec.title) + '</h3><dl class="kv">' +
          sec.rows.map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl></section>';
      }).join('') +
    '</div>' +
    // 의뢰접수(견적 선정 전) 단계에서만 수정·삭제 가능
    '<div class="pacts"><p>분석파트너의 견적이 선정되기 전까지 의뢰 내용을 수정하거나 삭제할 수 있습니다.</p>' +
      '<div><button type="button" class="btn del" id="pDel">삭제</button><a class="btn primary" href="omicspharm-register.html?edit=' + encodeURIComponent(d.id) + '&t=' + Date.now() + '">수정하기</a></div></div>';
  $('#project').outerHTML = html;
  $('#pDel').addEventListener('click', function () {
    OP.my.confirm('의뢰를 삭제하시겠습니까?', '"' + d.title + '" 의뢰가 삭제되며 복구할 수 없습니다.', '삭제', function () {
      OP.my.removeProject(d.id);
      OP.flash('의뢰가 삭제되었습니다.');
      location.replace('mypage-project.html');
    });
  });
  // 목록에서 들어왔으면 브라우저 뒤로 가기(스크롤 위치 유지), 아니면 목록으로
  document.querySelector('.ptitle .back').addEventListener('click', function (e) {
    var ref = document.referrer || '';
    if (/mypage-project\.html(\?)?$/.test(ref.split('#')[0]) && history.length > 1) { e.preventDefault(); history.back(); }
  });
  document.title = d.title + ' · 마이페이지 · OmicsPharm';
})();
</script>
</body>
</html>
