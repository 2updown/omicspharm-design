        (FS.ct.amt != null // 컨설턴트가 계약 정보에 입력한 금액 (2026-10-26). 예전 데이터는 견적 금액
          ? '<div><dt>최종 계약 금액</dt><dd><b class="amt">' + F.money(FS.ct.amt, FS.ct.cur) + '</b>' + (FS.ct.cur === 'KRW' ? ' <span class="sub">(공급가, VAT 별도)</span>' : '') + '</dd></div>'
          : '<div><dt>최종 계약 금액</dt><dd><b class="amt">' + F.money(t.final, q.cur) + '</b> <span class="sub">(공급가 ' + F.money(t.net, q.cur) + ' + VAT)</span></dd></div>') +
        '<div><dt>계약 견적</dt><dd>' + F.qname(FS, FS.pick) + ' 견적 <button type="button" class="lnk" data-doc-pick>견적서 보기</button></dd></div>' +
        '<div><dt>계약일</dt><dd>' + (FS.ct.date ? dot(FS.ct.date) : ymd(FS.ct.at)) + '</dd></div>' +
        '<div><dt>납기일</dt><dd>' + dot(DUE) + (FS.fin || REP.length ? '' : ' <em class="dday">' + dd(DUE) + '</em>') + '</dd></div>' +
        // 대금 지급 방법·기타: 클라이언트 쪽 계약 내용만 (분석파트너 쪽은 보이지 않음)
        (FS.ct.client && FS.ct.client.pay ? '<div><dt>대금 지급 방법</dt><dd>' + esc(FS.ct.client.pay) + '</dd></div>' : '') +
        (FS.ct.client && FS.ct.client.etc ? '<div><dt>기타</dt><dd style="white-space:pre-line">' + esc(FS.ct.client.etc) + '</dd></div>' : '') +
      '</dl></section>' +
      '<section class="sec"><h3>계약서 파일</h3>' + F.contractListHTML(FS, ['client']) + '</section>';
  }
  // 결과보고서 탭 (기획 PPT 58p): 최신 차수 펼침 + 이전 차수 접힘, 수정 요청(문의하기) · 최종 확인, 완료 후 만족도 평가
  var KIND = function (n) { return /국문/.test(n) ? ['국문 리포트', 'pdf'] : /영문/.test(n) ? ['영문 리포트', 'pdf'] : /이미지/.test(n) ? ['결과 이미지', 'image'] : /raw/i.test(n) ? ['Raw 데이터', 'xls'] : ['첨부 파일', 'pdf']; };
  function filesHTML(v) {
    return '<ul class="rfiles">' + v.files.map(function (n) { var k = KIND(n);
      return '<li><img src="assets/project/ic-' + (k[1] === 'pdf' ? 'file-pdf' : k[1] === 'xls' ? 'file-xls' : 'image') + '.svg" alt=""><div><b>' + k[0] + '</b><span>' + esc(n) + '</span></div>' +
        '<button type="button" class="dl" data-dl="' + esc(n) + '" aria-label="' + esc(n) + ' 다운로드"><img src="assets/project/ic-download-simple.svg" alt=""></button></li>'; }).join('') + '</ul>';
  }
  function reportHTML() {
    if (!REP.length) return '<div class="empty"><b>등록된 결과보고서가 없습니다</b><p>' + (FS.ct ? '분석이 끝나면 OmicsPharm 컨설턴트가 결과보고서를 검토해 등록합니다. 납기일 ' + dot(DUE) + ' (' + dd(DUE) + ')' : '계약 후 분석이 끝나면 결과보고서가 여기에 등록됩니다.') + '</p></div>';
    var last = REP[REP.length - 1], n = REP.length;
    return '<div class="qhead"><h3>결과보고서</h3><span>의뢰서 작성 시 선택하신 산출물이 등록됩니다. 이전 차수는 아래에서 열어볼 수 있습니다.</span></div>' +
      '<section class="rver cur"><div class="rv-head"><b>' + n + '차 결과보고서</b><span class="badge ' + (FS.fin ? 'done">최종 승인 완료' : 'wait">검수 대기') + '</span><em>' + ymd(last.at) + ' 등록</em></div>' +
        (last.note ? '<p class="rv-note"><b>OmicsPharm 컨설턴트</b>' + esc(F.mask(FS, last.note)) + '</p>' : '') + filesHTML(last) +
        (FS.fin ? '<p class="rv-fin">' + ymd(FS.fin) + ' 최종 승인했습니다. 이후 수정이 필요하면 문의하기로 요청해주세요.</p>'
          : '<div class="rv-acts"><button type="button" class="btn" data-chat>수정 요청</button><button type="button" class="btn primary" id="repFin">최종 승인</button></div>') +
      '</section>' +
      (n > 1 ? '<div class="rold">' + REP.slice(0, -1).map(function (v, i) { return { v: v, i: i }; }).reverse().map(function (o) {
        return '<details class="rver"><summary><b>' + (o.i + 1) + '차 결과보고서</b><em>' + ymd(o.v.at) + ' 등록</em><img src="assets/find/ic-chevron-down.svg" alt=""></summary>' + (o.v.note ? '<p class="rv-note">' + esc(F.mask(FS, o.v.note)) + '</p>' : '') + filesHTML(o.v) + '</details>';
      }).join('') + '</div>' : '') +
      (FS.fin ? rateHTML() : '');
  }
  function rateHTML() {
    if (FS.rateSkip && !FS.rate) return '<section class="rrate done"><h4>서비스 만족도 평가</h4><p>평가를 건너뛰었습니다. (' + ymd(FS.rateSkip) + ')</p></section>';
    var R = FS.rate, st = function (on) { return '<img src="assets/project/ic-star' + (on ? '-fill' : '') + '.svg" alt="">'; };
    if (R) return '<section class="rrate done"><h4>서비스 만족도 평가</h4><div class="stars" aria-label="별점 ' + R.star + '점">' + [1, 2, 3, 4, 5].map(function (i) { return st(i <= R.star); }).join('') + '</div>' + (R.text ? '<p>' + esc(R.text) + '</p>' : '') + '<em>' + ymd(R.at) + '</em>';
    return '<section class="rrate" id="rate"><h4>서비스 만족도 평가</h4><p class="lead">이용하신 분석 서비스는 만족스러우셨나요? 별점과 함께 의견을 남겨주시면 더 나은 서비스를 위해 반영하겠습니다.</p>' +
      '<div class="stars" role="radiogroup" aria-label="별점">' + [1, 2, 3, 4, 5].map(function (i) { return '<button type="button" role="radio" aria-checked="false" data-star="' + i + '" aria-label="' + i + '점">' + st(false) + '</button>'; }).join('') + '</div>' +
      '<textarea id="rateText" placeholder="의견을 작성해주세요 (선택)"></textarea><div class="rv-acts"><button type="button" class="btn" id="rateSkip">건너뛰기</button><button type="button" class="btn primary" id="rateGo" disabled>제출</button></div></section>';
  }
  var closed = d.to && new Date(d.to) < new Date(new Date().toDateString());

  var html =
    '<div class="phead">' +
      '<div class="prow"><div class="badges"><span class="badge tag">' + esc(d.svc) + '</span>' + stB(d.id) + '</div>' +
        '<span class="reg">등록일 ' + ymd(d.at) + (d.updatedAt ? ' · 수정일 ' + ymd(d.updatedAt) : '') + ' · 프로젝트 번호 ' + esc(d.id) + '</span></div>' +
      '<div class="prow"><h2 class="ptitle"><a class="back" href="mypage-project.html" aria-label="뒤로 가기" title="뒤로 가기"><img src="assets/detail/ic-caret-left.svg" alt=""></a>' + esc(d.title) + '</h2>' +
        '<div class="pright">' + ((d.from || d.to) && sk === 0 ? '<div class="period"><b>모집기한</b><span>' + dot(d.from) + ' ~ ' + dot(d.to) + '</span><em>' + (closed ? '모집마감' : '모집중') + '</em></div>' : '') + OP.askBtn({ key: d.id, cat: d.svc, no: d.id, title: d.title }) + '</div></div>' +
    '</div>' +
    '<ol class="fsteps" style="--n:' + F.CLIENT_STEPS.length + '" aria-label="진행 단계">' + F.CLIENT_STEPS.map(function (t, i) { return '<li class="' + (i < sk ? 'done' : i === sk ? 'cur' : '') + '"' + (i === sk ? ' aria-current="step"' : '') + '>' + t + '</li>'; }).join('') + '</ol>' +
    todoHTML() +
    // 한 페이지: 지금 단계 섹션부터 (결과보고서 → 계약정보 → 견적서), 의뢰 내용은 맨 아래 (앞 단계 섹션이 있으면 접어둠)
    (REP.length ? '<section class="tpanel" id="tp-report">' + reportHTML() + '</section>' : '') +
    (FS.ct ? '<section class="tpanel" id="tp-contract">' + contractHTML() + '</section>' : '') +
    (FK.length ? '<section class="tpanel" id="tp-quote"></section>' : '') +
    '<details class="tpanel reqbox" id="tp-req"' + (FK.length || FS.ct ? '' : ' open') + '><summary><h3>의뢰 내용</h3><img src="assets/find/ic-chevron-down.svg" alt=""></summary>' +
    '<div class="summary">' +
      '<div><img src="assets/find/ic-user.svg" alt="">' + esc((d.org || '-') + (d.manager ? '(' + d.manager + ')' : '')) + '</div>' +
      '<div><img src="assets/find/ic-flask.svg" alt=""><em>샘플</em>' + (d.samples ? esc(d.samples) + '개' : '-') + '</div>' +
      '<div><img src="assets/find/ic-timer.svg" alt=""><em>희망완료일</em>' + (d.due ? '~' + dot(d.due) : '-') + '</div>' +
      '<div><img src="assets/detail/ic-currency-krw.svg" alt=""><em>예상금액</em>' + esc(d.budget || '-') + '</div>' +
    '</div>' +
    '<div class="sections">' +
      '<section class="sec"><h3>기본 정보</h3><dl class="kv">' +
        '<div><dt>분석 서비스</dt><dd>' + esc(d.svc) + '</dd></div>' +
        (d.purpose ? '<div><dt>연구 내용 및 목적</dt><dd>' + esc(d.purpose) + '</dd></div>' : '') +
        (d.open ? '<div><dt>공개여부</dt><dd>' + esc(d.open) + '</dd></div>' : '') +
        (F.bizName(d) ? '<div><dt>사업자등록증</dt><dd>' + esc(F.bizName(d)) + '</dd></div>' : '') +
      '</dl></section>' +
      (d.sections || []).map(function (sec) {
        if (sec.note) return '<section class="sec"><h3>' + esc(sec.title) + '</h3><p class="note">' + esc(sec.note) + '</p></section>';
        return '<section class="sec"><h3>' + esc(sec.title) + '</h3><dl class="kv">' +
          sec.rows.map(function (r) { return '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl></section>';
      }).join('') +
    '</div>' +
    // 승인 전(의뢰접수)에만 수정·삭제 (예시 의뢰는 제외). 승인 후 ~ 견적 협의는 [삭제](기록은 남김), 계약 진행 중은 컨설턴트 문의
    (FS.st === 'review' && !FS.ok && !d.demo ? '<div class="pacts"><p>분석파트너의 견적이 선정되기 전까지 의뢰 내용을 수정하거나 삭제할 수 있습니다.</p>' +
      '<div><button type="button" class="btn del" id="pDel">삭제</button><a class="btn primary" href="omicspharm-register.html?edit=' + encodeURIComponent(d.id) + '&t=' + Date.now() + '">수정하기</a></div></div>' : '') +
    (d.demo ? '<p class="demo-note">※ 견적 중개 과정을 확인하기 위한 예시 의뢰입니다.</p>' : '') +
    '</details>' +
    (F.canCancel(d.id) ? '<div class="pacts"><p>계약 전까지 프로젝트를 삭제할 수 있습니다. 삭제하면 견적을 요청받은 분석파트너에게 알림이 가고 프로젝트 찾기에서 내려갑니다.</p><div><button type="button" class="btn del" id="pCancel">삭제</button></div></div>'
      : FS.st === 'matched' && !FS.ct && !FS.cancel ? '<div class="pacts"><p>계약 진행 중에는 직접 삭제할 수 없습니다. 삭제가 필요하면 OmicsPharm 컨설턴트에게 문의해 주세요.</p><div>' + OP.askBtn({ key: d.id, cat: d.svc, no: d.id, title: d.title }) + '</div></div>' : '');
  $('#project').outerHTML = html;
  drawQuotes();
  // 섹션으로 이동 (?tab=quote|contract|report|req 로 들어오면 그 섹션으로)
  function showTab(k) { var el = $('#tp-' + k); if (!el) return; if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-open-quote]'), c = e.target.closest('[data-open-tab]'), v = e.target.closest('[data-ct]');
    if (b) showTab('quote');
    if (c) showTab(c.dataset.openTab);
    if (v) F.showContract(d, FS, v.dataset.ct);
    if (e.target.closest('[data-doc-pick]')) { var X = FS.P[FS.pick]; F.showDoc(d, X.quote, FS.pick, F.qname(FS, FS.pick) + ' 견적서', { client: true, no: F.qno(FS, FS.pick) }); }
    var dl = e.target.closest('[data-dl]'); if (dl) OP.toast('데모: ' + dl.dataset.dl + ' 파일을 내려받습니다.');
    if (e.target.closest('#repFin')) F.ask({ title: '결과보고서를 최종 승인하시겠습니까?', desc: '승인하면 프로젝트가 완료되고, 결과보고서를 더 수정할 수 없습니다.', label: false, yes: '최종 승인' }, function () {
      F.finish(d.id); OP.flash('프로젝트가 완료되었습니다. 만족도 평가를 남겨 주세요.'); location.replace('mypage-project.html?id=' + encodeURIComponent(d.id) + '&tab=report&go=rate'); // 해시만 바꾸면 다시 그려지지 않아서 쿼리로
    });
    var sb = e.target.closest('[data-star]');
    if (sb) { var nn = +sb.dataset.star; [].forEach.call(document.querySelectorAll('#rate [data-star]'), function (x) { var on = +x.dataset.star <= nn; x.setAttribute('aria-checked', +x.dataset.star === nn); x.querySelector('img').src = 'assets/project/ic-star' + (on ? '-fill' : '') + '.svg'; }); $('#rate').dataset.v = nn; $('#rateGo').disabled = false; }
    if (e.target.closest('#rateSkip')) { F.rateSkip(d.id); OP.flash('만족도 평가를 건너뛰었습니다.'); location.replace('mypage-project.html?id=' + encodeURIComponent(d.id) + '&tab=report'); }
    if (e.target.closest('#rateGo')) { F.rate(d.id, +$('#rate').dataset.v, $('#rateText').value.trim()); OP.flash('만족도 평가를 제출했습니다. 감사합니다.'); location.replace('mypage-project.html?id=' + encodeURIComponent(d.id) + '&tab=report'); }
  });
  // 처음 보이는 탭은 단계에 맞춤: 의뢰접수 = 의뢰내용 / 견적 확인·견적 확정 = 견적서 / 계약서 등록 후 = 계약정보 (?tab= 이 있으면 그 탭)
  var qtab = new URLSearchParams(location.search).get('tab'); if (qtab) setTimeout(function () { showTab(qtab); var rt = /[?&]go=rate\b/.test(location.search) && document.getElementById('rate'); if (rt) rt.scrollIntoView({ block: 'center' }); }, 50); // 승인 직후 = 평가 칸으로
  // 사업자등록증 다시 올리기: 이 의뢰의 파일로 저장하고 내 정보 관리에도 반영
  if ($('#bizRe')) $('#bizRe').addEventListener('change', function () {
    var f = this.files[0]; this.value = ''; if (!f) return;
    if (!/\.(pdf|jpe?g|png)$/i.test(f.name)) { OP.toast('PDF, JPG, PNG 파일만 올릴 수 있습니다.'); return; }
    var em = OP.session().email;
    // 바로 제출하지 않고 파일 이름을 보여주고 한 번 더 확인 (제출하면 컨설턴트에게 알림 + 내 정보 관리 파일도 교체)
    F.ask({ title: '이 파일로 다시 제출할까요?', desc: f.name + '\n제출하면 OmicsPharm 컨설턴트에게 알림이 가고, 내 정보 관리의 사업자등록증도 이 파일로 바뀝니다.', label: false, yes: '제출' }, function () {
      Promise.all([OP.files.put('biz:req:' + d.id, f), OP.files.put('biz:acc:' + em, f)]).then(function () {
        OP.saveAccount(em, { bizDoc: f.name }); F.bizResubmit(d.id, f.name);
        OP.flash('사업자등록증을 다시 제출했습니다.'); location.reload();
      });
    });
  });
  // 프로젝트 삭제 (승인 후 ~ 견적 협의): 사유(선택) 고르기 + 직접 입력. 기록은 남고 클라이언트 목록에서는 사라짐
  if ($('#pCancel')) $('#pCancel').addEventListener('click', function () {
    var R = ['예산 문제', '일정 변경', '다른 곳에서 진행', '기타'];
    var m = document.createElement('div');
    m.className = 'op-confirm fask'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = '<div class="box"><h3>프로젝트를 삭제하시겠습니까?</h3><p>"' + esc(d.title) + '" 프로젝트가 삭제되며 다시 진행할 수 없습니다. 견적을 요청받은 분석파트너에게 알림이 갑니다.</p>' +
      '<div class="cx-r"><b>삭제 사유 (선택)</b><div>' + R.map(function (r) { return '<label><input type="radio" name="cxr" value="' + r + '"><span>' + r + '</span></label>'; }).join('') + '</div>' +
      '<textarea placeholder="자세한 사유가 있다면 적어 주세요 (선택)"></textarea></div>' +
      '<div class="btns"><button type="button" class="no">닫기</button><button type="button" class="yes go del">삭제</button></div></div>';
    var close = function () { m.remove(); document.removeEventListener('keydown', key); }, key = function (e) { if (e.key === 'Escape') close(); };
    m.addEventListener('click', function (e) {
      if (e.target === m || e.target.classList.contains('no')) close();
      else if (e.target.classList.contains('yes')) {
        var r = m.querySelector('input[name=cxr]:checked'), t = m.querySelector('textarea').value.trim();
        F.cancel(d.id, [r ? r.value : '', t].filter(Boolean).join(' · ')); close();
        OP.flash('프로젝트를 삭제했습니다.'); location.replace('mypage-project.html');
      }
    });
    document.addEventListener('keydown', key); document.body.appendChild(m); m.querySelector('.no').focus();
  });
  if ($('#pDel')) $('#pDel').addEventListener('click', function () {
    OP.my.confirm('의뢰를 삭제하시겠습니까?', '"' + d.title + '" 의뢰가 삭제되며 복구할 수 없습니다.', '삭제', function () {
      OP.my.removeProject(d.id);
      OP.flash('의뢰가 삭제되었습니다.');
      location.replace('mypage-project.html');
    });
  });
  // [‹]: 원래 왔던 화면으로 (mypage.js 공통 처리)
  document.title = d.title + ' · 마이페이지 · OmicsPharm';
})();
</script>
