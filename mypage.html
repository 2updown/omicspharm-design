<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>마이페이지 · OmicsPharm</title>
<!-- 마이페이지 > 대시보드 (Figma 시안 없음 — 프로젝트 관리 화면과 같은 틀로 구성)
     진행 현황 / 최근 프로젝트 / 최근 알림 / 최근 문의. 데이터는 이 브라우저에서 제출한 의뢰·문의 기준 -->
<link rel="stylesheet" href="assets/common/site.css?v=20261012q">
<link rel="stylesheet" href="assets/common/mypage.css?v=20261012q">
<script src="assets/common/site.js?v=20261012q"></script>
<script src="assets/common/mypage.js?v=20261012q"></script>
<script src="assets/common/flow.js?v=20261012q"></script>
<style>
  /* 진행 현황: 단계별 개수 */
  .flow { display:grid; grid-template-columns:repeat(var(--n,5), minmax(0,1fr)); border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; }
  .flow > * { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px 8px; text-align:center; }
  .flow > * + * { border-left:1px solid var(--gray-200); }
  .flow a:hover { background:var(--gray-50); }
  .flow b { font-size:28px; font-weight:700; line-height:36px; color:var(--gray-300); }
  .flow b.has { color:var(--teal-600); }
  .flow b.has.hot { color:var(--orange-600); }
  .flow em { margin-top:-4px; font-style:normal; font-size:12px; line-height:16px; color:var(--orange-600); }
  .flow-end { align-self:flex-end; margin-top:-12px; font-size:13px; font-weight:500; color:var(--gray-500); }
  .flow-end:hover { color:var(--teal-600); }
  .flow.wide { grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); }
  .flow.wide > * + * { border-left:0; } .flow.wide > * { border-right:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200); margin:0 -1px -1px 0; }
  .flow span { font-size:14px; font-weight:500; line-height:20px; color:var(--gray-600); }
  .flow div span { color:var(--gray-400); }

  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:24px; }

  /* 테스트 B (컨설턴트, ?ui=b): 처리할 일 + 3개 구간 요약 */
  .todo4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
  .todo4 > * { display:flex; flex-direction:column; gap:4px; padding:16px 18px; border:1px solid var(--gray-200); border-radius:12px; background:#fff; }
  .todo4 a:hover { border-color:var(--teal-600); }
  .todo4 b { font-size:28px; font-weight:700; line-height:36px; color:var(--gray-300); }
  .todo4 a b { color:var(--orange-600); }
  .todo4 span { font-size:14px; font-weight:600; line-height:20px; color:#000; }
  .todo4 small { font-size:12px; line-height:18px; color:var(--gray-500); }
  .todo4 div span { color:var(--gray-400); }
  .phase { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)) 120px; border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; margin-top:16px; }
  .phase > * + * { border-left:1px solid var(--gray-200); }
  .phase .ph { padding:16px 18px; display:flex; flex-direction:column; gap:10px; }
  .phase .ph-h { display:flex; align-items:baseline; justify-content:space-between; }
  .phase .ph-h span { font-size:14px; font-weight:600; color:#000; }
  .phase .ph-h b { font-size:24px; font-weight:700; line-height:32px; color:var(--teal-600); }
  .phase .ph-h b.zero { color:var(--gray-300); }
  .phase ul { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:4px; }
  .phase li a, .phase li span.off { display:flex; justify-content:space-between; font-size:13px; line-height:20px; color:var(--gray-600); }
  .phase li a:hover { color:var(--teal-700); }
  .phase li span.off { color:var(--gray-400); }
  .phase .done { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; background:var(--gray-50); }
  .phase .done b { font-size:24px; font-weight:700; line-height:32px; color:var(--gray-600); }
  .phase .done span { font-size:13px; color:var(--gray-500); }
  .sec-t { margin:20px 0 10px; font-size:14px; font-weight:600; color:var(--gray-700); }
  .sec-t:first-child { margin-top:0; }
  @media (max-width:900px) { .todo4 { grid-template-columns:repeat(2, minmax(0,1fr)); } .phase { grid-template-columns:1fr; } .phase > * + * { border-left:0; border-top:1px solid var(--gray-200); } }

  /* 최근 프로젝트 */
  .plist { display:flex; flex-direction:column; }
  .plist a { display:flex; align-items:center; gap:16px; padding:16px 4px; border-bottom:1px solid var(--gray-200); }
  .plist a:first-child { border-top:1px solid var(--gray-200); }
  .plist a:hover h4 { color:var(--teal-700); text-decoration:underline; text-underline-offset:3px; }
  .plist .badges { display:flex; gap:6px; flex:none; }
  .plist h4 { flex:1; min-width:0; font-size:16px; font-weight:600; line-height:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plist .dt { flex:none; font-size:13px; line-height:18px; color:var(--gray-500); }

  /* 알림·문의 짧은 목록 */
  .mini { display:flex; flex-direction:column; }
  .mini a { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--gray-100); }
  .mini a:last-child { border-bottom:0; }
  .mini a:hover .t { color:var(--teal-700); }
  .mini .dot { flex:none; width:6px; height:6px; margin-top:8px; border-radius:50%; background:var(--orange-600); }
  .mini .dot.read { background:transparent; }
  .mini .tx { flex:1; min-width:0; }
  .mini .t { display:block; font-size:14px; font-weight:500; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini .d { display:block; margin-top:2px; font-size:12px; line-height:18px; color:var(--gray-500); }
  .mini .badge { flex:none; margin-top:1px; }
  .mini-empty { padding:32px 0; text-align:center; font-size:14px; color:var(--gray-500); }

  @media (max-width:1180px) { .grid2 { grid-template-columns:minmax(0,1fr); } }
  @media (max-width:640px) {
    .flow { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .flow > :nth-child(4) { border-left:0; }
    .flow > :nth-child(n+4) { border-top:1px solid var(--gray-200); }
    .flow b { font-size:22px; line-height:30px; }
    .flow span { font-size:13px; }
    .plist a { flex-wrap:wrap; gap:6px 12px; }
    .plist h4 { flex-basis:100%; order:2; white-space:normal; }
    .plist .dt { margin-left:auto; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in">
  <h1>마이페이지</h1>
</div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>

  <div class="main">
    <section class="card" id="pipeCard" hidden>
      <div class="card-head"><h3 id="pipeH"></h3><a class="more" id="pipeMore"></a></div>
      <div class="flow" id="pipe"></div>
    </section>

    <section class="card">
      <div class="card-head"><h3>프로젝트 진행 현황</h3><a class="more" href="mypage-project.html">전체 보기</a></div>
      <div class="flow" id="flow"></div>
    </section>

    <section class="card">
      <div class="card-head"><h3>최근 프로젝트</h3><a class="more" href="mypage-project.html">전체 보기</a></div>
      <div id="plist"></div>
    </section>

    <div class="grid2">
      <section class="card">
        <div class="card-head"><h3>최근 알림</h3><a class="more" href="mypage-alarm.html">전체 보기</a></div>
        <div class="mini" id="alarms"></div>
      </section>
      <section class="card">
        <div class="card-head"><h3>최근 문의</h3><a class="more" href="mypage-inquiry.html">전체 보기</a></div>
        <div class="mini" id="inqs"></div>
      </section>
    </div>
  </div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var me = OP.mypage('dash'); if (!me) return;
  var D = OP.my, esc = D.esc, $ = function (s) { return document.querySelector(s); };
  var client = me.s.role === 'client';
  var P = D.myProjects();

  var F = OP.flow, admin = me.s.role === 'admin';

  // 견적 중개 현황: 컨설턴트 = 의뢰 처리 단계, 분석파트너 = 받은 견적 요청 상태
  var pipe = null;
  if (admin) {
    // 컨설턴트: 의뢰접수 ~ 프로젝트 완료 전 단계 (프로젝트 관리와 같은 단계)
    var AS = F.requests().map(function (r) { return F.adminStage(r.id); }).concat(D.partnerProjects().filter(function (p) { return !p.flow; }).map(function (p) { return F.P2A[p.stage]; }));
    pipe = ['프로젝트 진행 현황', 'mypage-request.html', F.ADMIN_STAGES.map(function (t) {
      return [t, AS.filter(function (x) { return x === t; }).length, '?stage=' + encodeURIComponent(t)];
    })];
  }
  if (admin) { $('#flow').closest('.card').hidden = true; $('#pipe').classList.add('wide'); }
  // 테스트 B: 컨설턴트 진행 현황을 '지금 처리할 일 4칸' + '3개 구간(견적 중개 · 계약·분석 · 보고서) + 완료'로 (?ui=b, 기본 화면은 그대로)
  if (admin && new URLSearchParams(location.search).get('ui') === 'b') {
    var cntOf = function (t) { return AS.filter(function (x) { return x === t; }).length; };
    var R = F.requests();
    var unsent = R.filter(function (r) { var st = F.state(r.id); return (st.st === 'quoting' || st.st === 'sent') && Object.keys(st.P).some(function (k) { return st.P[k].status === 'sub' && !st.P[k].fwd; }); }).length;
    var go = function (t) { return 'mypage-request.html?stage=' + encodeURIComponent(t); };
    var TODO = [
      ['의뢰 승인 대기', cntOf('의뢰접수'), go('의뢰접수'), '사업자등록증 확인 후 승인'],
      ['견적 전달 대기', unsent, go('견적 협의'), '도착한 견적을 클라이언트에게 전달'],
      ['계약서 등록 대기', cntOf('계약 진행 중'), go('계약 진행 중'), '클라이언트·분석파트너 계약서 등록'],
      ['보고서 검토 대기', cntOf('보고서 검토'), go('보고서 검토'), '분석파트너가 등록한 보고서 확인']
    ];
    var PH = [['견적 중개', ['의뢰접수', '의뢰확인', '견적 협의']], ['계약 · 분석', ['계약 진행 중', '분석 진행 중']], ['보고서', ['보고서 등록', '보고서 검토', '보고서 승인']]];
    var tile = function (t) { var inner = '<b>' + t[1] + '</b><span>' + t[0] + '</span><small>' + t[3] + '</small>'; return t[1] ? '<a href="' + t[2] + '">' + inner + '</a>' : '<div aria-disabled="true">' + inner + '</div>'; };
    var total = AS.filter(function (x) { return x !== '프로젝트 완료'; }).length;
    $('#pipeCard').hidden = false; $('#pipeH').textContent = '프로젝트 진행 현황'; $('#pipeMore').href = 'mypage-request.html'; $('#pipeMore').textContent = '전체 보기';
    $('#pipe').className = '';
    $('#pipe').innerHTML = '<p class="sec-t">지금 처리할 일</p><div class="todo4">' + TODO.map(tile).join('') + '</div>' +
      '<p class="sec-t">전체 현황 · 진행 중 ' + total + '건</p><div class="phase">' + PH.map(function (g) {
        var n = g[1].reduce(function (a, t) { return a + cntOf(t); }, 0);
        return '<div class="ph"><div class="ph-h"><span>' + g[0] + '</span><b' + (n ? '' : ' class="zero"') + '>' + n + '</b></div><ul>' + g[1].map(function (t) {
          var c = cntOf(t); return '<li>' + (c ? '<a href="' + go(t) + '"><span>' + t + '</span><span>' + c + '</span></a>' : '<span class="off"><span>' + t + '</span><span>0</span></span>') + '</li>';
        }).join('') + '</ul></div>';
      }).join('') + '<a class="done" href="' + go('프로젝트 완료') + '"><b>' + cntOf('프로젝트 완료') + '</b><span>프로젝트 완료</span></a></div>';
    pipe = null;
  }
  if (pipe) {
    $('#pipeCard').hidden = false; $('#pipeH').textContent = pipe[0]; $('#pipeMore').href = pipe[1]; $('#pipeMore').textContent = '전체 보기';
    $('#pipe').style.setProperty('--n', pipe[2].length);
    $('#pipe').innerHTML = pipe[2].map(function (a, i) {
      return a[1] ? '<a href="' + pipe[1] + a[2] + '"><b class="has' + (i === 0 ? ' hot' : '') + '">' + a[1] + '</b><span>' + a[0] + '</span></a>' : '<div aria-disabled="true"><b>0</b><span>' + a[0] + '</span></div>';
    }).join('');
  }

  // 분석파트너: 셀키 매칭 후 계약된 프로젝트의 단계 (견적 요청·제출은 견적관리에서)
  var PP = D.partnerProjects();
  // 칸: [이름, 개수, 주소, 아래 작은 글, 주황 강조]
  var cells;
  if (client) {
    // 클라이언트: 견적 중개 단계(의뢰접수 → 견적 비교 → 계약 → 분석 진행)
    cells = ['의뢰접수', '견적 비교', '계약', '분석 진행', '결과 수령'].map(function (t) { return [t, P.filter(function (p) { return F.clientStage(p.id) === t; }).length, 'mypage-project.html?stage=' + encodeURIComponent(t)]; });
  } else {
    // 분석파트너: 견적(견적관리) → 프로젝트(프로젝트 관리). 보고서 검토·승인은 '보고서 등록'에 묶어 '확인 대기 n'
    var IN = OP.canQuote() ? F.inbox(me.s.email).map(function (o) { return F.pst(o.s, me.s.email); }) : [];
    var cnt = function (re) { return IN.filter(function (t) { return re.test(t); }).length; };
    var wait = PP.filter(D.pWaiting).length;
    cells = [['견적 작성', cnt(/작성 대기|임시저장|수정 요청/), 'mypage-quote.html?t=' + encodeURIComponent('작성 필요'), '', true],
             ['견적 제출', cnt(/제출 완료|클라이언트 검토 중/), 'mypage-quote.html?t=' + encodeURIComponent('제출 완료')]]
      .concat(D.P4.map(function (t, i) { return [t, PP.filter(function (p) { return D.pStage(p) === t; }).length, 'mypage-project.html?stage=' + encodeURIComponent(t), t === '보고서 등록' && wait ? '확인 대기 ' + wait : '']; }));
    var ended = cnt(/미선정|거절/);
    if (ended) $('#flow').insertAdjacentHTML('afterend', '<a class="flow-end" href="mypage-quote.html?t=' + encodeURIComponent('종료') + '">미선정·거절 ' + ended + '건 ›</a>');
  }
  $('#flow').style.setProperty('--n', cells.length);
  $('#flow').innerHTML = cells.map(function (c) {
    // 0건인 단계는 누를 수 없다
    var inner = '<b class="' + (c[1] ? 'has' + (c[4] ? ' hot' : '') : '') + '">' + c[1] + '</b><span>' + c[0] + '</span>' + (c[3] ? '<em>' + c[3] + '</em>' : '');
    return c[1] ? '<a href="' + c[2] + '">' + inner + '</a>' : '<div aria-disabled="true">' + inner + '</div>';
  }).join('');

  if (!client && PP.length) {
    $('#plist').innerHTML = '<div class="plist">' + PP.slice(0, 3).map(function (p) {
      var ps = admin ? p.stage : D.pStage(p);
      return '<a href="mypage-project.html?id=' + p.id + '"><span class="badges"><span class="badge tag">' + esc(p.svc) + '</span><span class="badge ' + (ps === '완료' ? 'done' : 'state') + '">' + ps + '</span>' + (!admin && D.pWaiting(p) ? '<span class="badge wait">확인 대기</span>' : '') + '</span>' +
        '<h4>' + esc(p.title) + '</h4><span class="dt">' + esc(p.client) + '</span></a>';
    }).join('') + '</div>';
  } else
  $('#plist').innerHTML = client && P.length
    ? '<div class="plist">' + P.slice(0, 3).map(function (p) {
        var t = F.clientStage(p.id);
        return '<a href="mypage-project.html?id=' + encodeURIComponent(p.id) + (t === '견적 비교' ? '&tab=quote' : '') + '"><span class="badges"><span class="badge tag">' + esc(p.svc) + '</span><span class="badge ' + (t === '계약' ? 'ok' : t === '견적 비교' ? 'wait' : 'state') + '">' + t + '</span></span>' +
          '<h4>' + esc(p.title) + '</h4><span class="dt">' + D.ymd(p.at) + '</span></a>';
      }).join('') + '</div>'
    : '<div class="empty"><b>' + (client ? '의뢰한 프로젝트가 없습니다' : '진행 중인 프로젝트가 없습니다') + '</b>' +
      '<p>' + (client ? '분석 의뢰를 등록하면 분석파트너들의 견적을 비교해 받아볼 수 있습니다.' : !OP.partnerVerified() && OP.isPartner() ? '인증된 분석파트너만 프로젝트 매칭·계약이 가능합니다. OmicsPharm이 기관·서비스 정보를 확인한 뒤 인증해 드립니다.' : 'OmicsPharm이 분석 의뢰에 맞는 파트너로 선정해 견적을 요청하면 여기에서 확인할 수 있습니다.') + '</p>' +
      (client ? '<a class="btn primary lg" href="omicspharm-register.html" data-client-only>프로젝트 의뢰하기</a>' : '') + '</div>';

  var A = D.alarms().slice(0, 4);
  $('#alarms').innerHTML = A.map(function (a) {
    return '<a href="' + a.href + '" data-id="' + a.id + '"><i class="dot' + (a.read ? ' read' : '') + '"></i><span class="tx"><span class="t">' + esc(a.t) + '</span><span class="d">' + D.ymdhm(a.at) + '</span></span></a>';
  }).join('') || '<p class="mini-empty">새 알림이 없습니다.</p>';
  $('#alarms').addEventListener('click', function (e) { var a = e.target.closest('[data-id]'); if (a) D.markRead([a.dataset.id]); });

  var Q = D.inquiries().slice(0, 4);
  $('#inqs').innerHTML = Q.map(function (q) {
    return '<a href="mypage-inquiry.html?id=' + q.id + '">' + (q.answer ? '<span class="badge done">답변완료</span>' : '<span class="badge wait">답변대기</span>') +
      '<span class="tx"><span class="t">' + esc(q.title) + '</span><span class="d">' + esc(q.type) + ' · ' + D.ymd(q.at) + '</span></span></a>';
  }).join('') || '<p class="mini-empty">문의 내역이 없습니다.</p>';
})();
</script>
</body>
</html>
