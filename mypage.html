<!-- 마이페이지 > 대시보드 (Figma 시안 없음 — 프로젝트 관리 화면과 같은 틀로 구성)
     진행 현황 / 최근 프로젝트 / 최근 알림 / 최근 문의. 데이터는 이 브라우저에서 제출한 의뢰·문의 기준 -->
<link rel="stylesheet" href="assets/common/site.css?v=20261028zs">
<link rel="stylesheet" href="assets/common/mypage.css?v=20261028zs">

<style>
  /* 진행 현황: 단계별 개수 */
  .flow { display:grid; grid-template-columns:repeat(var(--n,5), minmax(0,1fr)); border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; }
  .flow > * { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px 8px; text-align:center; }
  .flow > * + * { border-left:1px solid var(--gray-200); }
  .flow a:hover { background:var(--gray-50); }
  .flow b { font-size:28px; font-weight:700; line-height:36px; color:var(--gray-300); }
  .flow b.has { color:var(--teal-600); }
  .flow b.has.hot { color:var(--orange-600); }
  .flow em { margin-top:-4px; font-style:normal; font-size:12px; line-height:16px; color:var(--orange-600); }
  .flow-end { align-self:flex-end; margin-top:-12px; font-size:13px; font-weight:500; color:var(--gray-500); }
  .flow-end:hover { color:var(--teal-600); }
  .flow.wide { grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); }
  .flow.wide > * + * { border-left:0; } .flow.wide > * { border-right:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200); margin:0 -1px -1px 0; }
  .flow span { font-size:14px; font-weight:500; line-height:20px; color:var(--gray-600); }
  .flow div span { color:var(--gray-400); }

  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:24px; }

  /* 진행 현황 (묶음형): 묶음 카드마다 색 제목 + 연한 색 칸(단계 이름 · n건). 칸 수만큼 너비 비율 */
  .fgrid { display:grid; gap:12px; }
  .fg { display:flex; flex-direction:column; gap:10px; padding:14px 12px; border:1px solid var(--gray-200); border-radius:12px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.04); min-width:0; } /* 묶음 카드 */
  /* 진행 현황은 바깥 큰 상자 없이 제목 + 묶음 카드 (레퍼런스처럼) */
  .card.bare { padding:0; gap:14px; background:none; border:0; border-radius:0; }
  .card.bare .card-head h3 { font-size:22px; font-weight:700; line-height:30px; letter-spacing:-.22px; }
  /* 진행 현황: 단계별 박스 → 큰 박스 하나 + 묶음 사이 세로선 (2026-10-23, 칸 배경은 유지). PC 화이트 디자인에서만 */
  .ui-white .fgrid { gap:0 !important; padding:8px 0; border:1px solid var(--gray-200); border-radius:16px; background:#fff; }
  .ui-white .fgrid .fg { border:0 !important; border-radius:0 !important; box-shadow:none !important; background:transparent !important; padding:8px 16px !important; } /* 묶음 흰 배경이 큰 박스 둥근 모서리 테두리를 덮지 않게 */ /* 묶음 그림자 없앰 (박스 아래 선처럼 보였음) */
  .ui-white .fgrid .fg + .fg { border-left:1px solid var(--gray-200) !important; }
  @media (max-width:960px) { .ui-white .fgrid .fg + .fg { border-left:0 !important; border-top:1px solid var(--gray-200) !important; } } /* 묶음이 세로로 쌓이면 왼쪽 선 대신 위 선 (왼쪽 선이 박스 테두리와 겹쳐 2px로 보였음) */
  .card-head h3 .h-cnt { margin-left:12px; font-size:16px; font-weight:500; line-height:22px; letter-spacing:0; color:var(--gray-500); vertical-align:1px; }
  .card-head h3 .h-cnt b { font-weight:600; color:var(--teal-600); }
  .fg h4 { font-size:16px; font-weight:700; line-height:22px; text-align:center; color:#000; } /* 묶음 제목(견적·진행·완료)은 검정 (2026-10-23). 숫자만 묶음 색 */
  .fg .cells { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:8px; flex:1; }
  .fg .cells > * { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:14px 6px; border-radius:8px; background:var(--fb); text-align:center; }
  .fg .cells a:hover { box-shadow:inset 0 0 0 1px var(--fs); } /* hover 테두리는 묶음 색의 연한 단계 */
  .fg .cells span { font-size:13px; font-weight:500; line-height:18px; color:var(--gray-700); word-break:keep-all; }
  .fg .cells b { font-size:20px; font-weight:700; line-height:28px; color:#000; }
  .fg .cells a b { color:var(--fc); }
  .fg .cells em { font-style:normal; font-size:12px; line-height:16px; color:var(--orange-600); }
  .fg.red { --fc:#f00011; --fb:#fff5f5; --fs:#ffc7c9; } .fg.teal { --fc:var(--teal-600); --fb:#f2fbf9; --fs:#a6e3d9; } .fg.gray { --fc:#000; --fb:#f7f7f7; --fs:#d4d4d4; } .fg.blue { --fc:#0065f4; --fb:#f2f7ff; --fs:#b8dcff; }
  @media (max-width:960px) { .fgrid { grid-template-columns:1fr !important; } } /* 모바일 배치(960 이하)와 같은 기준으로 세로로 쌓음 (901~960에서 가로 배치가 박스 밖으로 넘쳤음) */


  /* 최근 프로젝트 */
  .plist { display:flex; flex-direction:column; }
  .plist a { display:flex; align-items:center; gap:16px; min-height:55px; padding:11px 4px; border-bottom:1px solid var(--gray-200); } /* 버튼(32) 있는 줄도 높이 같게 */
  .plist a:first-child { border-top:1px solid var(--gray-200); }
  .plist a:hover h4 { color:var(--teal-700); text-decoration:underline; text-underline-offset:3px; }
  .plist .badges { display:flex; gap:6px; flex:none; }
  .plist h4 { flex:1; min-width:0; font-size:16px; font-weight:600; line-height:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plist .nx { flex:none; font-size:13px; font-weight:600; line-height:18px; color:var(--gray-600); }
  .plist .nxb { flex:none; height:32px; padding:0 12px; font-size:13px; line-height:18px; } /* 처리할 일 = 낮은 outline 버튼 (2026-10-23, 주황 글씨 대신) */
  .plist a:hover .nxb { background:var(--gray-50); }
  .plist .dt { flex:none; font-size:13px; line-height:18px; color:var(--gray-500); }

  /* 알림·문의 짧은 목록 */
  .mini { display:flex; flex-direction:column; }
  .mini a { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--gray-100); } /* 글자 세로 가운데 (2026-10-27) */
  .mini a:last-child { border-bottom:0; }
  .mini a:hover .t { color:var(--teal-700); }
  .mini .tx { flex:1; min-width:0; min-height:40px; display:flex; flex-direction:column; justify-content:center; } /* 둘째 줄이 없는 알림(공지 등)도 같은 높이 64, 글자는 가운데 */ /* 둘째 줄(프로젝트명)이 없는 알림(공지 등)도 같은 높이 64 (2026-10-27) */
  .mini .t { display:block; font-size:14px; font-weight:500; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini .d { display:block; margin-top:2px; font-size:12px; line-height:18px; color:var(--gray-500); }
  .mini .badge { flex:none; margin-top:1px; }
  .mini .at { flex:none; font-size:13px; line-height:20px; color:var(--gray-500); } /* 날짜는 오른쪽 (최근 프로젝트와 같은 위치) */
  /* 읽음 = 흐리게 (Body/Small/R gray-500, 아래·날짜 gray-400), 안 읽음 = Body/Small/M 검정 (2026-10-23, 별도 표시 없이 대비로 구분) */
  #alarms .t { font-weight:400; color:var(--gray-500); } #alarms .d, #alarms .at { color:var(--gray-400); }
  #alarms a.unread .t { font-weight:500; color:#000; } #alarms a.unread .d, #alarms a.unread .at { color:var(--gray-500); }
  .mini-empty { padding:32px 0; text-align:center; font-size:14px; color:var(--gray-500); }

  @media (max-width:1180px) { .grid2 { grid-template-columns:minmax(0,1fr); } }
  @media (max-width:640px) {
    .flow { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .flow > :nth-child(4) { border-left:0; }
    .flow > :nth-child(n+4) { border-top:1px solid var(--gray-200); }
    .flow b { font-size:22px; line-height:30px; }
    .flow span { font-size:13px; }
    .plist a { flex-wrap:wrap; gap:6px 12px; }
    .plist h4 { flex-basis:100%; order:2; white-space:normal; }
    .plist .dt, .plist .nx, .plist .nxb { margin-left:auto; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in">
  <h1>마이페이지</h1>
</div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>

  <div class="main">
    <section class="card bare" id="pipeCard" hidden>
      <div class="card-head"><h3 id="pipeH"></h3><a class="more" id="pipeMore"></a></div>
      <div class="flow" id="pipe"></div>
    </section>

    <section class="card bare">
      <div class="card-head"><h3>프로젝트 진행 현황</h3><a class="more" href="mypage-project.html">전체 보기</a></div>
      <div class="flow" id="flow"></div>
    </section>

    <section class="card box">
      <div class="card-head"><h3>최근 프로젝트</h3><a class="more" href="mypage-project.html" aria-label="최근 프로젝트 전체 보기">전체 보기</a></div>
      <div id="plist"></div>
    </section>

    <div class="grid2">
      <section class="card box">
        <div class="card-head"><h3>최근 알림</h3><a class="more" href="mypage-alarm.html">전체 보기</a></div>
        <div class="mini" id="alarms"></div>
      </section>
      <section class="card box">
        <div class="card-head"><h3>최근 문의</h3><a class="more" href="mypage-consult.html">전체 보기</a></div>
        <div class="mini" id="inqs"></div>
      </section>
    </div>
  </div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var me = OP.mypage('dash'); if (!me) return;
  var D = OP.my, esc = D.esc, $ = function (s) { return document.querySelector(s); };
  var client = me.s.role === 'client';
  var P = D.myProjects();

  var F = OP.flow, admin = me.s.role === 'admin';
  // 진행 현황 묶음형 그리기: G = [[묶음 이름, 색, [[단계, 건수, 주소, 아래 작은 글], …]], …]
  function groupFlow(el, G) {
    el.className = 'fgrid';
    el.style.gridTemplateColumns = G.map(function (g) { return 'minmax(0,' + g[2].length + 'fr)'; }).join(' '); // minmax(0,…): 좁아져도 박스 밖으로 넘치지 않게
    el.innerHTML = G.map(function (g) {
      return '<div class="fg ' + g[1] + '"><h4>' + g[0] + '</h4><div class="cells">' + g[2].map(function (c) {
        var inner = '<span>' + c[0] + '</span><b>' + c[1] + '건</b>' + (c[3] ? '<em>' + c[3] + '</em>' : '');
        return c[1] ? '<a href="' + c[2] + '">' + inner + '</a>' : '<div aria-disabled="true">' + inner + '</div>'; // 0건은 누를 수 없음
      }).join('') + '</div></div>';
    }).join('');
  }
  var pick = function (cells, names) { return names.map(function (n) { return cells.filter(function (c) { return c[0] === n; })[0]; }); };

  // 견적 중개 현황: 컨설턴트 = 의뢰 처리 단계, 분석파트너 = 받은 견적 요청 상태
  var pipe = null;
  if (admin) {
    // 컨설턴트: 의뢰접수 ~ 프로젝트 완료 전 단계 (프로젝트 관리와 같은 단계)
    var AS = F.requests().map(function (r) { return F.adminStage(r.id); }).concat(D.partnerProjects().filter(function (p) { return !p.flow; }).map(function (p) { return F.P2A[p.stage] || p.stage; }));
    pipe = ['프로젝트 진행 현황', 'mypage-request.html', F.ADMIN_STAGES.map(function (t) {
      return [t, AS.filter(function (x) { return x === t; }).length, '?stage=' + encodeURIComponent(t)];
    })];
  }
  if (admin) { $('#flow').closest('.card').hidden = true; $('#pipe').classList.add('wide'); }
  if (pipe) {
    $('#pipeCard').hidden = false; $('#pipeH').textContent = pipe[0]; $('#pipeMore').href = pipe[1]; $('#pipeMore').textContent = '전체 보기';
    var AC = pipe[2].map(function (a) { return [a[0], a[1], pipe[1] + a[2]]; });
    var SHORT = {}; // 2026-10-26 단계 이름을 시트 이름 그대로 (줄이지 않음)
    groupFlow($('#pipe'), [['견적', 'red', pick(AC, ['의뢰접수', '의뢰확인', '견적 협의'])], ['진행', 'teal', pick(AC, ['계약 진행 중', '분석 진행 중'])],
      ['보고서', 'gray', pick(AC, ['보고서 등록', '보고서 검토'])], ['완료', 'blue', pick(AC, ['프로젝트 완료'])]].map(function (g) {
        return [g[0], g[1], g[2].map(function (c) { return [SHORT[c[0]] || c[0], c[1], c[2]]; })];
      }));
  }

  // 분석파트너: 견적 요청부터 완료까지 프로젝트 관리 한 메뉴 (2026-10-27)
  var PP = D.partnerProjects();
  // 칸: [이름, 개수, 주소, 아래 작은 글, 주황 강조]
  var cells;
  if (client) {
    // 클라이언트: flow.js CLIENT_STEPS (시트 기준, 2026-10-26)
    cells = F.CLIENT_STEPS.map(function (t) { return [t, P.filter(function (p) { return F.clientStage(p.id) === t; }).length, 'mypage-project.html?stage=' + encodeURIComponent(t)]; });
  } else {
    // 분석파트너: 견적(요청·제출) → 프로젝트 진행 → 보고서(등록·검토·승인) → 완료. 모두 프로젝트 관리 목록의 단계
    var IN = OP.canQuote() ? F.inbox(me.s.email).map(function (o) { return F.pstMe(o.s, me.s.email); }) : [];
    var cnt = function (re) { return IN.filter(function (t) { return re.test(t); }).length; };
    cells = [['견적 요청', cnt(/작성 대기|임시저장|수정 요청/), 'mypage-project.html?stage=' + encodeURIComponent('견적 요청'), '', true],
             ['견적 제출', cnt(/제출 완료|클라이언트 검토 중/), 'mypage-project.html?stage=' + encodeURIComponent('견적 제출')]]
      .concat(D.P4.map(function (t, i) { return [t, PP.filter(function (p) { return D.pStage(p) === t; }).length, 'mypage-project.html?stage=' + encodeURIComponent(t)]; }));
    var ended = cnt(/미선정|거절/);
    if (ended) $('#flow').insertAdjacentHTML('afterend', '<a class="flow-end" href="mypage-project.html?stage=' + encodeURIComponent('미선정·거절') + '">미선정·거절 ' + ended + '건 ›</a>');
  }
  // 묶음: 클라이언트 = 견적(의뢰접수·의뢰승인·견적 확인) / 진행(계약 진행 중·분석 진행 중) / 보고서(보고서 검토) / 완료(프로젝트 완료)
  //       분석파트너 = 견적(작성·제출) / 프로젝트 진행(계약 진행 중·분석 진행 중) / 보고서(보고서 등록·검토) / 완료(프로젝트 완료)
  groupFlow($('#flow'), client
    ? [['견적', 'red', pick(cells, ['의뢰접수', '의뢰승인', '견적 확인'])], ['진행', 'teal', pick(cells, ['계약 진행 중', '분석 진행 중'])], ['보고서', 'gray', pick(cells, ['보고서 검토'])], ['완료', 'blue', pick(cells, ['프로젝트 완료'])]]
    : [['견적', 'red', pick(cells, ['견적 요청', '견적 제출'])], ['진행', 'teal', pick(cells, ['계약 진행 중', '분석 진행 중'])], ['보고서', 'gray', pick(cells, ['보고서 검토'])], ['완료', 'blue', pick(cells, ['프로젝트 완료'])]]);

  // 최근 프로젝트 (2026-10-22): 내가 처리할 게 있는 프로젝트를 위로 + 오른쪽에 다음 할 일. 할 게 없으면 최근 순. 제목은 그대로
  // 항목: { href, svc, st, stCls, title, sub, next, urgent, at }
  var IT = [];
  if (client) {
    IT = P.map(function (p) {
      var x = F.state(p.id), t = F.clientStage(p.id), rep = (x.rep || []).length;
      var nx = t === '견적 확인' ? '최종 견적 확인 필요' : rep && !x.fin ? '결과보고서 확인 필요' : x.fin && !F.done(x) ? '만족도 평가 남기기' : ''; // 완료 후 평가는 선택 (남기거나 건너뛰면 사라짐)
      return { href: 'mypage-project.html?id=' + encodeURIComponent(p.id) + (t === '견적 확인' ? '&tab=quote' : rep ? '&tab=report' : ''), svc: p.svc, st: t, stCls: t === '견적 확인' || t === '보고서 검토' ? 'wait' : t === '프로젝트 완료' ? 'done' : 'state', title: p.title, sub: D.ymd(p.at), next: nx, urgent: !!nx, at: p.at };
    });
  } else if (admin) {
    // 컨설턴트: 프로젝트 관리 목록과 같은 다음 할 일 (mypage-request.html)
    IT = F.requests().map(function (r) {
      var x = F.state(r.id), sub = Object.keys(x.P || {}).filter(function (k) { return x.P[k].status === 'sub'; }).length, rw = (x.raw || []).some(function (v) { return !v.sent; });
      if (x.cancel) return null;
      var nx = x.st === 'review' ? (x.ok ? '견적 요청 가능' : '의뢰 승인 필요') : x.st === 'quoting' ? (sub ? '견적 ' + sub + '건 도착 · 전달 가능' : '') : x.st === 'matched' && !x.ct ? '계약서 등록 필요' : rw ? 'AI 보고서 초안 검토 필요' : '';
      var urgent = (x.st === 'review' && !x.ok) || (x.st === 'matched' && !x.ct) || rw || (x.st === 'quoting' && sub > 0);
      return { href: 'mypage-request.html?id=' + encodeURIComponent(r.id), svc: r.svc, st: F.adminStage(r.id), stCls: F.adminStage(r.id) === '의뢰접수' ? 'wait' : F.adminStage(r.id) === '프로젝트 완료' ? 'done' : 'state', title: r.title, sub: r.org || '-', next: nx, urgent: urgent, at: r.at };
    }).filter(Boolean);
  } else {
    // 분석파트너: 견적 작성이 필요한 요청 + 계약된 프로젝트 (분석 중이면 결과 등록)
    var MY = me.s.email;
    IT = (OP.canQuote() ? F.inbox(MY) : []).map(function (o) {
      var t = F.pstMe(o.s, MY); if (!/작성 대기|임시저장|수정 요청/.test(t)) return null;
      return { href: 'mypage-quote.html?rid=' + encodeURIComponent(o.r.id), svc: o.r.svc, st: '견적 요청', stCls: 'wait', title: o.r.title, sub: o.r.org || '-', next: t === '수정 요청' ? '견적 수정 필요' : t === '임시저장' ? '이어서 작성 필요' : '견적 작성 필요', urgent: true, at: o.x.at };
    }).filter(Boolean).concat(PP.map(function (p) {
      // 오른쪽 할 일·기다림 = 프로젝트 관리 목록(pNext)과 같은 이름
      var ps = D.pStage(p), fs = p.flow ? F.state(p.id) : null, up = p.flow && (fs.raw || []).length;
      var nx = ps === '계약 진행 중' ? (p.flow && !fs.ct ? '계약서 준비 중' : '계약서 확인') : ps === '분석 진행 중' ? (up ? 'OmicsPharm 검토 중' : '결과 등록 필요') : ps === '보고서 검토' ? (fs && fs.reReq && !fs.fin ? '결과 재등록 필요' : p.stage === '보고서 등록' ? 'OmicsPharm 검토 중' : '클라이언트 확인 중') : '';
      return { href: 'mypage-project.html?id=' + encodeURIComponent(p.id), svc: D.svcKo(p.svc), st: ps, stCls: ps === '프로젝트 완료' ? 'done' : 'state', title: p.title, sub: p.client, next: nx, urgent: /필요$/.test(nx), at: p.at };
    }));
  }
  // 버튼 이름은 할 일 그대로, '필요'·'가능'만 뺌 (예: 최종 견적 확인 필요 → 최종 견적 확인)
  var btnLabel = function (t) { return t.replace(/^견적 (\d+)건 도착 · 전달 가능$/, '견적 $1건 전달').replace(/ (필요|가능)$/, ''); };
  IT.sort(function (a, b) { return (b.urgent - a.urgent) || (b.at - a.at); });
  $('#plist').innerHTML = IT.length
    ? '<div class="plist">' + IT.slice(0, 5).map(function (o) {
        return '<a href="' + o.href + '"><span class="badges"><span class="badge tag">' + esc(o.svc) + '</span><span class="badge ' + o.stCls + '">' + esc(o.st) + '</span></span>' +
          '<h4>' + esc(o.title) + '</h4>' + (o.next ? (o.urgent ? '<span class="btn line nxb">' + esc(btnLabel(o.next)) + '</span>' : '<span class="nx">' + esc(o.next) + '</span>') : '<span class="dt">' + esc(o.sub) + '</span>') + '</a>';
      }).join('') + '</div>'
    : '<div class="empty"><b>' + (client ? '의뢰한 프로젝트가 없습니다' : '진행 중인 프로젝트가 없습니다') + '</b>' +
      '<p>' + (client ? '분석 의뢰를 등록하면 OmicsPharm이 분석파트너 견적을 받아 정리해 드립니다.' : admin ? '접수된 의뢰가 없습니다.' : !OP.partnerVerified() && OP.isPartner() ? '인증된 분석파트너만 프로젝트 매칭·계약이 가능합니다. OmicsPharm이 기관 정보 및 사업자등록증을 확인한 뒤 인증해 드립니다.' : 'OmicsPharm이 분석 의뢰에 맞는 파트너로 선정해 견적을 요청하면 여기에서 확인할 수 있습니다.') + '</p>' +
      (client ? '<a class="btn primary lg" href="omicspharm-register.html" data-client-only>프로젝트 의뢰하기</a>' : '') + '</div>';

  // 진행 현황 제목 옆 '전체 N건' (2026-10-23): 아래 칸 숫자 합계. 컨설턴트는 #pipe, 그 외는 #flow
  [['#flow', '.card.bare:not(#pipeCard) .card-head h3'], ['#pipe', '#pipeH']].forEach(function (p) {
    var g = $(p[0]), h = $(p[1]); if (!g || !h || g.closest('[hidden]') || !g.children.length) return;
    var n = [].reduce.call(g.querySelectorAll('.cells b'), function (a, b) { return a + (parseInt(b.textContent, 10) || 0); }, 0);
    h.insertAdjacentHTML('beforeend', '<span class="h-cnt">전체 <b>' + n + '</b>건</span>');
  });
  // 최근 알림 (2026-10-23): 제목 = 무슨 일인지 짧게, 아래 = 프로젝트명(상담·문의는 제목), 오른쪽 = 날짜. 앞의 점은 뺌 (안 읽은 건 제목만 굵게)
  var HEAD = { '의뢰접수': '새 의뢰서가 접수되었습니다', '의뢰승인': '프로젝트가 승인되었습니다', '의뢰수정': '의뢰서가 수정되었습니다', '의뢰취소': '프로젝트가 삭제되었습니다', '의뢰삭제': '프로젝트가 삭제되었습니다',
    '견적확인요청': '새 견적서가 도착했습니다', '견적등록': '새 견적서가 등록되었습니다', '견적제안': '새 견적 요청이 도착했습니다', '견적수정요청': '견적서 수정 요청이 도착했습니다', '견적거절': '견적 요청이 거절되었습니다',
    '견적확정': admin ? '최종 견적이 확정되었습니다' : '견적이 최종 선정되었습니다', '계약': '계약서가 등록되었습니다', '결과등록': '분석 결과가 등록되었습니다', '보고서등록': '결과보고서가 등록되었습니다', '보고서 등록': '결과보고서가 등록되었습니다',
    '보고서 최종 확인': '결과보고서가 최종 확인되었습니다', '프로젝트완료': '프로젝트가 완료되었습니다', '리뷰등록': '만족도 평가가 등록되었습니다',
    '사업자등록증재제출요청': '사업자등록증을 다시 제출해주세요', '사업자등록증재제출': '사업자등록증이 다시 제출되었습니다', '파트너인증요청': '파트너 인증 요청이 도착했습니다', '파트너인증': '파트너 인증이 완료되었습니다', '분석서비스정보요청': '분석 서비스 정보를 입력해주세요',
    '상담 답변': '상담 답변이 등록되었습니다', '상담 접수': '새 상담이 접수되었습니다', '상담 추가 문의': '상담에 추가 문의가 등록되었습니다', '문의 답변': '문의 답변이 등록되었습니다', '문의 접수': '문의가 접수되었습니다' };
  var A = D.alarms().slice(0, 5);
  $('#alarms').innerHTML = A.map(function (a) {
    var head = HEAD[a.k] || a.t, sub = HEAD[a.k] ? a.pj || '' : a.sub || ''; // 공지 등 구분이 없는 알림은 원래 문장 그대로
    return '<a href="' + a.href + '" data-id="' + a.id + '"' + (a.read ? '' : ' class="unread"') + '><span class="tx"><span class="t">' + esc(head) + '</span>' + (sub ? '<span class="d">' + esc(sub) + '</span>' : '') + '</span><span class="at">' + D.ymd(a.at) + '</span></a>';
  }).join('') || '<p class="mini-empty">새 알림이 없습니다.</p>';
  $('#alarms').addEventListener('click', function (e) { var a = e.target.closest('[data-id]'); if (a) D.markRead([a.dataset.id]); });

  // 최근 문의 = 상담내역 + 프로젝트 문의내역 (consult.js). 챗봇 문의는 대시보드에 보이지 않음. 컨설턴트는 답변대기 먼저
  var CS = OP.consult ? (admin ? OP.consult.all() : OP.consult.mine()) : [];
  CS.sort(function (a, b) { return (admin ? OP.consult.waiting(b) - OP.consult.waiting(a) : 0) || (OP.consult.lastAt(b) - OP.consult.lastAt(a)); });
  $('#inqs').innerHTML = CS.slice(0, 5).map(function (c) {
    return '<a href="mypage-consult.html?id=' + encodeURIComponent(c.id) + '">' + (c.link ? '<span class="badge done">의뢰 연결</span>' : OP.consult.waiting(c) ? '<span class="badge wait">답변대기</span>' : '<span class="badge done">답변완료</span>') +
      '<span class="tx"><span class="t">' + esc(c.title) + '</span><span class="d">' + (admin ? esc(c.name) + '<i class="dv" aria-hidden="true"></i>' : '') + (OP.consult.isProj(c) ? '프로젝트 문의' : esc(c.type)) + '</span></span><span class="at">' + D.ymd(OP.consult.lastAt(c)) + '</span></a>';
  }).join('') || '<p class="mini-empty">상담 내역이 없습니다.</p>';
})();
</script>
