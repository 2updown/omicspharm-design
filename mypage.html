<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>마이페이지 · OmicsPharm</title>
<!-- 마이페이지 > 대시보드 (Figma 시안 없음 — 프로젝트 관리 화면과 같은 틀로 구성)
     진행 현황 / 최근 프로젝트 / 최근 알림 / 최근 문의. 데이터는 이 브라우저에서 제출한 의뢰·문의 기준 -->

<link rel="stylesheet" href="assets/common/mypage.css?v=20261022l">

<style>
  /* 진행 현황: 단계별 개수 */
  .flow { display:grid; grid-template-columns:repeat(var(--n,5), minmax(0,1fr)); border:1px solid var(--gray-200); border-radius:12px; overflow:hidden; }
  .flow > * { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px 8px; text-align:center; }
  .flow > * + * { border-left:1px solid var(--gray-200); }
  .flow a:hover { background:var(--gray-50); }
  .flow b { font-size:28px; font-weight:700; line-height:36px; color:var(--gray-300); }
  .flow b.has { color:var(--teal-600); }
  .flow b.has.hot { color:var(--orange-600); }
  .flow em { margin-top:-4px; font-style:normal; font-size:12px; line-height:16px; color:var(--orange-600); }
  .flow-end { align-self:flex-end; margin-top:-12px; font-size:13px; font-weight:500; color:var(--gray-500); }
  .flow-end:hover { color:var(--teal-600); }
  .flow.wide { grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); }
  .flow.wide > * + * { border-left:0; } .flow.wide > * { border-right:1px solid var(--gray-200); border-bottom:1px solid var(--gray-200); margin:0 -1px -1px 0; }
  .flow span { font-size:14px; font-weight:500; line-height:20px; color:var(--gray-600); }
  .flow div span { color:var(--gray-400); }

  .grid2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:24px; }

  /* 진행 현황 (묶음형): 묶음 카드마다 색 제목 + 연한 색 칸(단계 이름 · n건). 칸 수만큼 너비 비율 */
  .fgrid { display:grid; gap:12px; }
  .fg { display:flex; flex-direction:column; gap:10px; padding:14px 12px; border:1px solid var(--gray-200); border-radius:12px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.04); min-width:0; } /* 묶음 카드 */
  /* 진행 현황은 바깥 큰 상자 없이 제목 + 묶음 카드 (레퍼런스처럼) */
  .card.bare { padding:0; gap:14px; background:none; border:0; border-radius:0; }
  .card.bare .card-head h3 { font-size:22px; font-weight:700; line-height:30px; letter-spacing:-.22px; }
  .fg h4 { font-size:16px; font-weight:700; line-height:22px; text-align:center; color:var(--fc); }
  .fg .cells { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:8px; flex:1; }
  .fg .cells > * { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:14px 6px; border-radius:8px; background:var(--fb); text-align:center; }
  .fg .cells a:hover { box-shadow:inset 0 0 0 1px var(--fs); } /* hover 테두리는 묶음 색의 연한 단계 */
  .fg .cells span { font-size:13px; font-weight:500; line-height:18px; color:var(--gray-700); word-break:keep-all; }
  .fg .cells b { font-size:20px; font-weight:700; line-height:28px; color:#000; }
  .fg .cells a b { color:var(--fc); }
  .fg .cells em { font-style:normal; font-size:12px; line-height:16px; color:var(--orange-600); }
  .fg.red { --fc:#f00011; --fb:#fff5f5; --fs:#ffc7c9; } .fg.teal { --fc:var(--teal-600); --fb:#f2fbf9; --fs:#a6e3d9; } .fg.gray { --fc:#000; --fb:#f7f7f7; --fs:#d4d4d4; } .fg.blue { --fc:#0065f4; --fb:#f2f7ff; --fs:#b8dcff; }
  @media (max-width:900px) { .fgrid { grid-template-columns:1fr !important; } }


  /* 최근 프로젝트 */
  .plist { display:flex; flex-direction:column; }
  .plist a { display:flex; align-items:center; gap:16px; padding:16px 4px; border-bottom:1px solid var(--gray-200); }
  .plist a:first-child { border-top:1px solid var(--gray-200); }
  .plist a:hover h4 { color:var(--teal-700); text-decoration:underline; text-underline-offset:3px; }
  .plist .badges { display:flex; gap:6px; flex:none; }
  .plist h4 { flex:1; min-width:0; font-size:16px; font-weight:600; line-height:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .plist .nx { flex:none; font-size:13px; font-weight:600; line-height:18px; color:var(--gray-600); }
  .plist .nx.hot { color:var(--orange-600, #ea580c); }
  .plist .dt { flex:none; font-size:13px; line-height:18px; color:var(--gray-500); }

  /* 알림·문의 짧은 목록 */
  .mini { display:flex; flex-direction:column; }
  .mini a { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--gray-100); }
  .mini a:last-child { border-bottom:0; }
  .mini a:hover .t { color:var(--teal-700); }
  .mini .dot { flex:none; width:6px; height:6px; margin-top:8px; border-radius:50%; background:var(--orange-600); }
  .mini .dot.read { background:transparent; }
  .mini .tx { flex:1; min-width:0; }
  .mini .t { display:block; font-size:14px; font-weight:500; line-height:20px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini .d { display:block; margin-top:2px; font-size:12px; line-height:18px; color:var(--gray-500); }
  .mini .badge { flex:none; margin-top:1px; }
  .mini-empty { padding:32px 0; text-align:center; font-size:14px; color:var(--gray-500); }

  @media (max-width:1180px) { .grid2 { grid-template-columns:minmax(0,1fr); } }
  @media (max-width:640px) {
    .flow { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .flow > :nth-child(4) { border-left:0; }
    .flow > :nth-child(n+4) { border-top:1px solid var(--gray-200); }
    .flow b { font-size:22px; line-height:30px; }
    .flow span { font-size:13px; }
    .plist a { flex-wrap:wrap; gap:6px 12px; }
    .plist h4 { flex-basis:100%; order:2; white-space:normal; }
    .plist .dt, .plist .nx { margin-left:auto; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in">
  <h1>마이페이지</h1>
</div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>

  <div class="main">
    <section class="card bare" id="pipeCard" hidden>
      <div class="card-head"><h3 id="pipeH"></h3><a class="more" id="pipeMore"></a></div>
      <div class="flow" id="pipe"></div>
    </section>

    <section class="card bare">
      <div class="card-head"><h3>프로젝트 진행 현황</h3><a class="more" href="mypage-project.html">전체 보기</a></div>
      <div class="flow" id="flow"></div>
    </section>

    <section class="card box">
      <div class="card-head"><h3>최근 프로젝트</h3><a class="more" href="mypage-project.html">전체 보기</a></div>
      <div id="plist"></div>
    </section>

    <div class="grid2">
      <section class="card box">
        <div class="card-head"><h3>최근 알림</h3><a class="more" href="mypage-alarm.html">전체 보기</a></div>
        <div class="mini" id="alarms"></div>
      </section>
      <section class="card box">
        <div class="card-head"><h3>최근 문의</h3><a class="more" href="mypage-consult.html">전체 보기</a></div>
        <div class="mini" id="inqs"></div>
      </section>
    </div>
  </div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var me = OP.mypage('dash'); if (!me) return;
  var D = OP.my, esc = D.esc, $ = function (s) { return document.querySelector(s); };
  var client = me.s.role === 'client';
  var P = D.myProjects();

  var F = OP.flow, admin = me.s.role === 'admin';
  // 진행 현황 묶음형 그리기: G = [[묶음 이름, 색, [[단계, 건수, 주소, 아래 작은 글], …]], …]
  function groupFlow(el, G) {
    el.className = 'fgrid';
    el.style.gridTemplateColumns = G.map(function (g) { return g[2].length + 'fr'; }).join(' ');
    el.innerHTML = G.map(function (g) {
      return '<div class="fg ' + g[1] + '"><h4>' + g[0] + '</h4><div class="cells">' + g[2].map(function (c) {
        var inner = '<span>' + c[0] + '</span><b>' + c[1] + '건</b>' + (c[3] ? '<em>' + c[3] + '</em>' : '');
        return c[1] ? '<a href="' + c[2] + '">' + inner + '</a>' : '<div aria-disabled="true">' + inner + '</div>'; // 0건은 누를 수 없음
      }).join('') + '</div></div>';
    }).join('');
  }
  var pick = function (cells, names) { return names.map(function (n) { return cells.filter(function (c) { return c[0] === n; })[0]; }); };

  // 견적 중개 현황: 컨설턴트 = 의뢰 처리 단계, 분석파트너 = 받은 견적 요청 상태
  var pipe = null;
  if (admin) {
    // 컨설턴트: 의뢰접수 ~ 프로젝트 완료 전 단계 (프로젝트 관리와 같은 단계)
    var AS = F.requests().map(function (r) { return F.adminStage(r.id); }).concat(D.partnerProjects().filter(function (p) { return !p.flow; }).map(function (p) { return F.P2A[p.stage]; }));
    pipe = ['프로젝트 진행 현황', 'mypage-request.html', F.ADMIN_STAGES.map(function (t) {
      return [t, AS.filter(function (x) { return x === t; }).length, '?stage=' + encodeURIComponent(t)];
    })];
  }
  if (admin) { $('#flow').closest('.card').hidden = true; $('#pipe').classList.add('wide'); }
  if (pipe) {
    $('#pipeCard').hidden = false; $('#pipeH').textContent = pipe[0]; $('#pipeMore').href = pipe[1]; $('#pipeMore').textContent = '전체 보기';
    var AC = pipe[2].map(function (a) { return [a[0], a[1], pipe[1] + a[2]]; });
    var SHORT = { '계약 진행 중': '계약 진행', '분석 진행 중': '분석 진행', '프로젝트 완료': '완료' }; // 칸이 좁아 표시 이름만 짧게 (묶음 제목이 맥락)
    groupFlow($('#pipe'), [['견적 중개', 'red', pick(AC, ['의뢰접수', '견적 대기', '견적 협의'])], ['계약 · 분석', 'teal', pick(AC, ['계약 진행 중', '분석 진행 중'])],
      ['보고서', 'gray', pick(AC, ['보고서 등록', '보고서 검토', '보고서 승인'])], ['완료', 'blue', pick(AC, ['프로젝트 완료'])]].map(function (g) {
        return [g[0], g[1], g[2].map(function (c) { return [SHORT[c[0]] || c[0], c[1], c[2]]; })];
      }));
  }

  // 분석파트너: 셀키 매칭 후 계약된 프로젝트의 단계 (견적 요청·제출은 견적관리에서)
  var PP = D.partnerProjects();
  // 칸: [이름, 개수, 주소, 아래 작은 글, 주황 강조]
  var cells;
  if (client) {
    // 클라이언트: 견적 중개 단계(의뢰접수 → 견적 확인 → 계약 → 분석 진행)
    cells = ['의뢰접수', '견적 확인', '계약', '분석 진행', '결과 수령'].map(function (t) { return [t, P.filter(function (p) { return F.clientStage(p.id) === t; }).length, 'mypage-project.html?stage=' + encodeURIComponent(t)]; });
  } else {
    // 분석파트너: 견적(견적관리) → 프로젝트(프로젝트 관리). 보고서는 실제 단계(등록·검토·승인) 그대로
    var IN = OP.canQuote() ? F.inbox(me.s.email).map(function (o) { return F.pst(o.s, me.s.email); }) : [];
    var cnt = function (re) { return IN.filter(function (t) { return re.test(t); }).length; };
    cells = [['견적 작성', cnt(/작성 대기|임시저장|수정 요청/), 'mypage-quote.html?t=' + encodeURIComponent('작성 필요'), '', true],
             ['견적 제출', cnt(/제출 완료|클라이언트 검토 중/), 'mypage-quote.html?t=' + encodeURIComponent('제출 완료')]]
      .concat(D.P4.map(function (t, i) { return [t, PP.filter(function (p) { return D.pStage(p) === t; }).length, 'mypage-project.html?stage=' + encodeURIComponent(t)]; }));
    var ended = cnt(/미선정|거절/);
    if (ended) $('#flow').insertAdjacentHTML('afterend', '<a class="flow-end" href="mypage-quote.html?t=' + encodeURIComponent('종료') + '">미선정·거절 ' + ended + '건 ›</a>');
  }
  // 묶음: 클라이언트 = 견적(의뢰접수·견적 확인) / 진행(계약·분석 진행) / 완료(결과 수령)
  //       분석파트너 = 견적(작성·제출) / 프로젝트 진행(계약·분석) / 보고서(보고서 등록) / 완료
  groupFlow($('#flow'), client
    ? [['견적', 'red', pick(cells, ['의뢰접수', '견적 확인'])], ['진행', 'teal', pick(cells, ['계약', '분석 진행'])], ['완료', 'blue', pick(cells, ['결과 수령'])]]
    : [['견적', 'red', pick(cells, ['견적 작성', '견적 제출'])], ['프로젝트 진행', 'teal', pick(cells, ['계약', '분석'])], ['보고서', 'gray', pick(cells, ['보고서 등록', '보고서 검토', '보고서 승인'])], ['완료', 'blue', pick(cells, ['완료'])]]);

  // 최근 프로젝트 (2026-10-22): 내가 처리할 게 있는 프로젝트를 위로 + 오른쪽에 다음 할 일. 할 게 없으면 최근 순. 제목은 그대로
  // 항목: { href, svc, st, stCls, title, sub, next, urgent, at }
  var IT = [];
  if (client) {
    IT = P.map(function (p) {
      var x = F.state(p.id), t = F.clientStage(p.id), rep = (x.rep || []).length;
      var nx = t === '견적 확인' ? '최종 견적 확인 필요' : rep && !x.fin ? '결과보고서 확인 필요' : x.fin && !x.rate ? '만족도 평가 남기기' : '';
      return { href: 'mypage-project.html?id=' + encodeURIComponent(p.id) + (t === '견적 확인' ? '&tab=quote' : rep ? '&tab=report' : ''), svc: p.svc, st: t, stCls: t === '계약' ? 'ok' : t === '견적 확인' ? 'wait' : 'state', title: p.title, sub: D.ymd(p.at), next: nx, urgent: !!nx, at: p.at };
    });
  } else if (admin) {
    // 컨설턴트: 프로젝트 관리 목록과 같은 다음 할 일 (mypage-request.html)
    IT = F.requests().map(function (r) {
      var x = F.state(r.id), sub = Object.keys(x.P || {}).filter(function (k) { return x.P[k].status === 'sub'; }).length, rw = (x.raw || []).some(function (v) { return !v.sent; });
      if (x.cancel) return null;
      var nx = x.st === 'review' ? (x.ok ? '견적 요청 가능' : '의뢰 승인 필요') : x.st === 'quoting' ? (sub ? '견적 ' + sub + '건 도착 · 전달 가능' : '') : x.st === 'matched' && !x.ct ? '계약서 등록 필요' : rw ? 'AI 보고서 초안 검토 필요' : '';
      var urgent = (x.st === 'review' && !x.ok) || (x.st === 'matched' && !x.ct) || rw || (x.st === 'quoting' && sub > 0);
      return { href: 'mypage-request.html?id=' + encodeURIComponent(r.id), svc: r.svc, st: F.adminStage(r.id), stCls: 'state', title: r.title, sub: r.org || '-', next: nx, urgent: urgent, at: r.at };
    }).filter(Boolean);
  } else {
    // 분석파트너: 견적 작성이 필요한 요청 + 계약된 프로젝트 (분석 중이면 결과 등록)
    var MY = me.s.email;
    IT = (OP.canQuote() ? F.inbox(MY) : []).map(function (o) {
      var t = F.pst(o.s, MY); if (!/작성 대기|임시저장|수정 요청/.test(t)) return null;
      return { href: 'mypage-quote.html?rid=' + encodeURIComponent(o.r.id), svc: o.r.svc, st: '견적 요청', stCls: 'wait', title: o.r.title, sub: o.r.org || '-', next: t === '수정 요청' ? '견적 수정 요청' : '견적 작성 필요', urgent: true, at: o.x.at };
    }).filter(Boolean).concat(PP.map(function (p) {
      var ps = D.pStage(p), nx = ps === '분석' && !(p.flow && (F.state(p.id).raw || []).length) ? '결과 등록 필요' : '';
      return { href: 'mypage-project.html?id=' + encodeURIComponent(p.id), svc: D.svcKo(p.svc), st: ps, stCls: ps === '완료' ? 'done' : 'state', title: p.title, sub: p.client, next: nx, urgent: !!nx, at: p.at };
    }));
  }
  IT.sort(function (a, b) { return (b.urgent - a.urgent) || (b.at - a.at); });
  $('#plist').innerHTML = IT.length
    ? '<div class="plist">' + IT.slice(0, 3).map(function (o) {
        return '<a href="' + o.href + '"><span class="badges"><span class="badge tag">' + esc(o.svc) + '</span><span class="badge ' + o.stCls + '">' + esc(o.st) + '</span></span>' +
          '<h4>' + esc(o.title) + '</h4>' + (o.next ? '<span class="nx' + (o.urgent ? ' hot' : '') + '">' + esc(o.next) + '</span>' : '<span class="dt">' + esc(o.sub) + '</span>') + '</a>';
      }).join('') + '</div>'
    : '<div class="empty"><b>' + (client ? '의뢰한 프로젝트가 없습니다' : '진행 중인 프로젝트가 없습니다') + '</b>' +
      '<p>' + (client ? '분석 의뢰를 등록하면 OmicsPharm이 분석파트너 견적을 받아 정리해 드립니다.' : admin ? '접수된 의뢰가 없습니다.' : !OP.partnerVerified() && OP.isPartner() ? '인증된 분석파트너만 프로젝트 매칭·계약이 가능합니다. OmicsPharm이 기관 정보 및 사업자등록증을 확인한 뒤 인증해 드립니다.' : 'OmicsPharm이 분석 의뢰에 맞는 파트너로 선정해 견적을 요청하면 여기에서 확인할 수 있습니다.') + '</p>' +
      (client ? '<a class="btn primary lg" href="omicspharm-register.html" data-client-only>프로젝트 의뢰하기</a>' : '') + '</div>';

  var A = D.alarms().slice(0, 4);
  $('#alarms').innerHTML = A.map(function (a) {
    return '<a href="' + a.href + '" data-id="' + a.id + '"><i class="dot' + (a.read ? ' read' : '') + '"></i><span class="tx"><span class="t">' + esc(a.t) + '</span><span class="d">' + D.ymdhm(a.at) + '</span></span></a>';
  }).join('') || '<p class="mini-empty">새 알림이 없습니다.</p>';
  $('#alarms').addEventListener('click', function (e) { var a = e.target.closest('[data-id]'); if (a) D.markRead([a.dataset.id]); });

  // 최근 문의 = 상담내역 (consult.js, 2026-10-22). 챗봇 문의는 대시보드에 보이지 않음. 컨설턴트는 답변대기 먼저
  var CS = OP.consult ? (admin ? OP.consult.all() : OP.consult.mine()) : [];
  CS.sort(function (a, b) { return (admin ? OP.consult.waiting(b) - OP.consult.waiting(a) : 0) || (OP.consult.lastAt(b) - OP.consult.lastAt(a)); });
  $('#inqs').innerHTML = CS.slice(0, 4).map(function (c) {
    return '<a href="mypage-consult.html?id=' + encodeURIComponent(c.id) + '">' + (OP.consult.waiting(c) ? '<span class="badge wait">답변대기</span>' : '<span class="badge done">답변완료</span>') +
      '<span class="tx"><span class="t">' + esc(c.title) + '</span><span class="d">' + (admin ? esc(c.name) + ' · ' : '') + esc(c.type) + ' · ' + D.ymd(OP.consult.lastAt(c)) + '</span></span></a>';
  }).join('') || '<p class="mini-empty">상담 내역이 없습니다.</p>';
})();
</script>
</body>
</html>
