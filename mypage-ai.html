  /* 오른쪽 패널로 띄운 경우: 왼쪽 메뉴는 접힌 상태(아이콘 줄)로 시작 + 위에 로고 줄 (오른쪽 위 X는 바깥 창에 있음, 2026-10-26 메뉴 추가) */

        document.body.insertAdjacentHTML('beforeend', '<div class="fpop" id="fpop" role="listbox" data-for="' + pi + '" style="top:' + (rc.bottom + 4) + 'px;left:' + rc.left + 'px;width:' + rc.width + 'px">' + PRJ[pi][4].map(function (t, j) { return '<button type="button" role="option" data-ro="' + pi + ':' + j + '"' + (j === cur0 ? ' class="on" aria-selected="true"' : '') + '>' + esc(t) + '</button>'; }).join('') + '</div>');
        return; }
      var ro = e.target.closest('[data-ro]'); if (ro) { var v = ro.dataset.ro.split(':'); repPick[+v[0]] = +v[1]; plPick = +v[0]; fpopClose(); plDraw(); return; } // 보고서를 고르면 그 줄도 선택
      var tr = e.target.closest('[data-pick]'); if (tr) { var k = +tr.dataset.pick; plPick = plPick === k ? -1 : k; plDraw(); return; } // 단일 선택: 다른 줄을 고르면 바뀜, 같은 줄을 다시 누르면 해제
      var pg = e.target.closest('[data-pg]'); if (pg) { plPage = pg.dataset.pg === '+' ? Math.min(10, plPage + 1) : +pg.dataset.pg; plDraw(); return; }
      if (e.target.closest('#plSel')) { plQ = ''; var r = plRows().filter(function (x) { return x.i === plPick; })[0]; if (r) sel = r.label; plClose(); draw(); $('#q').focus(); return; }
      if (e.target.closest('#plCancel') || e.target.id === 'plDim') { plClose(); return; }
      return;
    }
    if (e.target.closest('#fold')) { var f = document.documentElement.classList.toggle('folded'); e.target.closest('#fold').setAttribute('aria-expanded', !f); e.target.closest('#fold').setAttribute('aria-label', f ? '메뉴 펼치기' : '메뉴 접기'); if (!RAIL) try { localStorage.setItem('op.aiFold', f ? '1' : ''); } catch (er) {} return; }
    if (e.target.closest('#credit')) { toast('베타: 크레딧은 준비 중입니다.'); return; }
    if (e.target.closest('#setting')) { toast('베타: 설정은 준비 중입니다.'); return; }
  });
  try { if (RAIL || localStorage.getItem('op.aiFold')) { document.documentElement.classList.add('folded'); $('#fold').setAttribute('aria-expanded', 'false'); $('#fold').setAttribute('aria-label', '메뉴 펼치기'); } } catch (er) {} // 접힘 상태 기억 (이 브라우저)
  draw();
})();
</script>
