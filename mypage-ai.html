<style>
  :root { --p30:#1db3a4; --p40:#0ac4b2; --g0:#000; --g20:#333; --g30:#4d4d4d; --g40:#666; --g50:#808080; --g60:#999; --g90:#e5e5e5; --g95:#f2f2f2; --glass:0 4px 10px rgba(55,55,55,.05); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; font-weight:600; color:var(--g20); -webkit-font-smoothing:antialiased; background:#fff; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  a { color:inherit; text-decoration:none; }
  [hidden] { display:none !important; }
  /* Main Container: 가운데 연한 민트 원형 그라데이션 (Gradient/primary_05) */
  .app { display:flex; height:100vh; min-height:560px; background:radial-gradient(ellipse 51% 64% at 50.9% 49.2%, #c7efeb 0%, #fff 100%); }
  /* MenuBar */
  .bar { flex:none; display:flex; flex-direction:column; justify-content:space-between; height:100%; padding:24px 16px; border-right:1px solid var(--g90); background:rgba(252,252,252,.7); backdrop-filter:blur(2.5px); -webkit-backdrop-filter:blur(2.5px); }
  .bar-top { display:flex; flex-direction:column; gap:48px; }
  .brand { display:flex; align-items:center; gap:24px; }
  .logo { display:flex; align-items:center; width:132px; height:26px; padding-left:8px; }
  .logo .mark { position:relative; width:25.127px; height:26px; flex:none; }
  .logo .mark img { position:absolute; left:calc(50% + .12px); top:calc(50% - .32px); transform:translate(-50%, -50%); }
  .logo .word { margin-left:3.51px; margin-top:-0.3px; }
  .menubtn { position:relative; width:40px; height:40px; border-radius:4px; }
  .menubtn img { position:absolute; left:8px; top:11px; }
  .menubtn .i-on { display:none; }
  .logo img { display:block; }
  .ai-title { display:none; align-items:center; gap:6px; width:132px; padding-left:8px; font-size:18px; font-weight:700; line-height:26px; color:var(--g0); }
  .ai-title span { padding:0 6px; border-radius:6px; border:1px solid #cdeee8; background:#f4fbfa; font-size:11px; font-weight:600; line-height:18px; color:#00786e; }
  .emb-under .logo, .emb-inline .logo { display:none; } .emb-under .ai-title, .emb-inline .ai-title { display:flex; }
  .folded .ai-title { display:none !important; }
  /* 접힌 메뉴 (Figma 1700:18104): 폭 72, 위 = 메뉴 버튼(회색 배경·청록 아이콘) + 새 대화(+), 아래 = 크레딧·설정 */
  .rail-foot { display:none; flex-direction:column; align-items:center; gap:16px; }
  .rail-foot button { display:grid; place-items:center; width:24px; height:24px; }
  .folded .bar { width:72px; padding:24px 16px; align-items:center; background:#fcfcfc; }
  .folded .bar-top { gap:16px; }
  .folded .brand { gap:0; }
  .folded .logo, .folded .recent, .folded .bar .me { display:none; } /* .bar 안 프로필만 (대화의 .msg.me는 숨기지 않음, 2026-10-26 수정) */
  .folded .menubtn { background:var(--g95); }
  .folded .menubtn .i-off { display:none; } .folded .menubtn .i-on { display:block; }
  .folded .newchat { width:40px; padding:0; font-size:0; }
  .folded .newchat .ic img { width:24px; height:24px; }

  .lists { display:flex; flex-direction:column; gap:24px; }

  .newchat .ic { display:grid; place-items:center; width:40px; height:40px; }
  .recent { display:flex; flex-direction:column; gap:8px; padding:0 8px; }
  .recent h4 { font-size:16px; font-weight:600; line-height:23px; letter-spacing:.15px; color:var(--g0); }
  .recent ul { list-style:none; display:flex; flex-direction:column; }
  .recent li button { height:32px; padding-right:16px; font-size:14px; line-height:20px; color:var(--g50); text-align:left; white-space:nowrap; }
  .recent li button:hover, .recent li button.on { color:var(--g20); }
  .bar .me { display:flex; align-items:center; gap:8px; padding:0 8px 0 16px; font-size:16px; line-height:23px; letter-spacing:.15px; color:var(--g20); }
  .bar .me .av { display:grid; place-items:center; width:40px; height:40px; }
  /* Content */
  .content { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px 56px; }
  .foot { position:absolute; left:0; right:0; bottom:0; padding-bottom:16px; font-size:14px; line-height:23px; letter-spacing:.25px; color:var(--g60); text-align:center; }
  .prompt { display:flex; flex-direction:column; align-items:center; gap:28px; width:100%; }
  .prompt h1 { font-size:32px; font-weight:600; line-height:40px; color:var(--g20); text-align:center; }
  .pbox-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }
  .pbox { display:flex; flex-direction:column; gap:32px; width:724px; max-width:100%; padding:0 4px 4px; border-radius:16px; background:rgba(255,255,255,.5); box-shadow:var(--glass); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .pbox textarea { display:block; width:100%; min-height:39px; max-height:200px; padding:16px 20px 0; border:0; background:none; resize:none; outline:0; font:inherit; font-size:16px; line-height:23px; letter-spacing:.15px; color:var(--g20); }
  .pbox textarea::placeholder { color:var(--g50); }
  .ptools { display:flex; align-items:flex-start; justify-content:space-between; padding:0 8px 4px; }
  .ptools .l { display:flex; gap:8px; }
  .gbtn { display:grid; place-items:center; width:40px; height:40px; border-radius:8px; background:rgba(255,255,255,.5); box-shadow:var(--glass); }
  .gbtn:hover { background:#fff; }
  .send { width:40px; height:40px; border-radius:50%; }
  .send:disabled { cursor:default; } /* 시안과 같은 모양 유지 (빈 입력이면 눌러도 동작 안 함) */
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%; }
  .chips button { padding:10px 16px; border-radius:8px; background:rgba(255,255,255,.5); box-shadow:var(--glass); font-size:14px; line-height:23px; letter-spacing:.25px; color:var(--g20); }
  .chips button:hover { background:#fff; }
  /* 대화 (Figma 시안 없음 · 프로토타입용) */
  .chat { display:flex; flex-direction:column; width:100%; height:100%; padding:40px 0 56px; }
  .msgs { flex:1; overflow:auto; display:flex; flex-direction:column; gap:16px; width:724px; max-width:100%; margin:0 auto; padding-bottom:24px; }
  .msg { max-width:85%; padding:12px 16px; border-radius:16px; font-weight:500; font-size:15px; line-height:24px; white-space:pre-line; }
  .msg.me { align-self:flex-end; background:var(--p30); color:#fff; }
  .msg.bot { align-self:flex-start; background:rgba(255,255,255,.7); box-shadow:var(--glass); color:var(--g20); }
  .chat .pbox { margin:0 auto; }
  .toast { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); padding:10px 16px; border-radius:8px; background:rgba(51,51,51,.92); color:#fff; font-size:14px; line-height:20px; }
  /* 오른쪽 패널로 띄운 경우: 왼쪽 메뉴는 접힌 상태(아이콘 줄)로 시작 + 위에 로고 줄 (오른쪽 위 X는 바깥 창에 있음, 2026-10-26 메뉴 추가) */
  .emb-panel .content { padding:56px 20px 56px; }
  .emb-panel .prompt h1 { font-size:26px; line-height:34px; }
  .emb-panel .pnl-head { display:flex; }
  .pnl-head { display:none; position:absolute; top:0; left:72px; right:0; align-items:center; gap:8px; height:56px; padding:0 20px; z-index:1; }
  .emb-panel .chat { padding-top:64px; }
  .emb-panel:not(.folded) .pnl-head { display:none; }
  .emb-mob .bar { display:none !important; } .emb-mob .content { padding-top:56px; }
  /* 모바일 (2026-10-26, Figma 2011:22085 Icons/Large/menu bar): 왼쪽 위 메뉴 버튼 → 누르면 왼쪽에서 메뉴가 밀려 나옴 (ChatGPT·Claude 방식) */
  .mbtn { display:none; position:absolute; top:12px; left:12px; z-index:5; width:40px; height:40px; border-radius:4px; }
  .mbtn img { position:absolute; left:8px; top:11px; } .mbtn .i-on { display:none; }
  .drawer .mbtn { background:var(--g95); } .drawer .mbtn .i-off { display:none; } .drawer .mbtn .i-on { display:block; }
  @media (max-width:900px) { html:not(.emb-panel):not(.emb-inline) .mbtn { display:block; } html:not(.emb-panel):not(.emb-inline) .content { padding-top:64px; } }
  .emb-mob .mbtn { display:block; } .emb-mob .content { padding-top:64px; }
  .mdim { display:none; position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.32); }
  html.drawer .mdim { display:block; }
  html.drawer .brand { justify-content:space-between; } /* 제목 ↔ 메뉴 버튼 양쪽 정렬 */
  html.drawer .bar { display:flex !important; position:fixed; top:0; left:0; bottom:0; z-index:20; width:min(300px, 84vw); height:auto; background:#fff; box-shadow:8px 0 24px rgba(0,0,0,.12); animation:drawIn .22s ease-out; }
  @keyframes drawIn { from { transform:translateX(-100%); } to { transform:none; } }
  @media (prefers-reduced-motion:reduce) { html.drawer .bar { animation:none; } } /* 메뉴를 펼치면 메뉴에 로고가 있으니 위 로고 줄 숨김 */
  @media (max-width:900px) { .bar { display:none; } .prompt h1 { font-size:26px; line-height:34px; } .emb-panel .bar, .emb-inline .bar { display:flex; } }
</style>
</head>
<body>
<div class="app">
  <aside class="bar">
    <div class="bar-top">
      <div class="brand">
        <a class="logo" href="mypage.html" title="마이페이지로" aria-label="OmicsPharm · 마이페이지로"><img src="assets/ai/logo-omicspharm.svg" width="114" height="12" alt="OmicsPharm"></a>
        <!-- GNB 아래로 열릴 때(?embed=under)는 GNB에 로고가 있으니 로고 대신 제목 (2026-10-23) -->
        <p class="ai-title">AI Agent<span>beta</span></p>
        <button type="button" class="menubtn" id="fold" aria-label="메뉴 접기" aria-expanded="true"><img class="i-off" src="assets/ai/ic-sidebar.svg" width="24" height="18" alt=""><img class="i-on" src="assets/ai/ic-sidebar-on.svg" width="24" height="18" alt=""></button>
      </div>
      <div class="lists">
        <button type="button" class="newchat" id="newChat"><span class="ic"><img src="assets/ai/ic-add.svg" width="24" height="24" alt=""></span>New chat</button>
        <div class="recent"><h4>Recent</h4><ul id="recent"></ul></div>
      </div>
    </div>
    <div class="me"><span class="av"><img src="assets/ai/ic-profile.svg" width="32" height="32" alt=""></span><span id="meName"></span></div>
    <!-- 접힌 메뉴 (Figma 1700:18104): 아래쪽 크레딧·설정 -->
    <div class="rail-foot"><button type="button" id="credit" aria-label="크레딧"><img src="assets/ai/ic-credit.svg" width="20" height="20" alt=""></button><button type="button" id="setting" aria-label="설정"><img src="assets/ai/ic-setting.svg" width="24" height="24" alt=""></button></div>
  </aside>
  <button type="button" class="mbtn" id="mMenu" aria-label="메뉴 열기" aria-expanded="false"><img class="i-off" src="assets/ai/ic-sidebar.svg" width="24" height="18" alt=""><img class="i-on" src="assets/ai/ic-sidebar-on.svg" width="24" height="18" alt=""></button>
  <div class="mdim" id="mDim"></div>
  <div class="pnl-head"><img src="assets/ai/logo-omicspharm.svg" width="114" height="12" alt="OmicsPharm"></div>
  <main class="content" id="content"></main>
</div>
<script>
(function () {
  var me = OP.mypage('ai'); if (!me) return; // 로그인 확인
  // 마이페이지 위에 띄운 경우(?embed=overlay|panel): 로고·Esc = 닫기, panel은 좁아서 왼쪽 메뉴 숨김
  var EMB = (location.search.match(/[?&]embed=(overlay|panel|under|inline)/) || [])[1];
  var RAIL = EMB === 'panel' || EMB === 'inline'; // 좁은 자리(오른쪽 패널·마이페이지 콘텐츠 자리)는 왼쪽 메뉴를 접어서 시작, 접힘 기억도 안 함
  // inline으로 열었는데 창을 960 이하로 줄여 전체 화면이 된 경우: 모바일처럼 왼쪽 메뉴 숨김 (모바일 전용 화면은 아직 없음 → Copilot식 접기 예정)
  var mob = function () { try { document.documentElement.classList.toggle('emb-mob', EMB === 'inline' && parent !== window && parent.innerWidth <= 960); } catch (e) {} };
  if (EMB === 'inline') { mob(); window.addEventListener('resize', mob); }
  if (EMB) {
    document.documentElement.classList.add('emb', 'emb-' + EMB);
    document.querySelector('.logo').addEventListener('click', function (e) { e.preventDefault(); parent.postMessage('op-ai-close', '*'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') parent.postMessage('op-ai-close', '*'); });
  }
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var acc = OP.account(OP.session().email) || {};
  $('#meName').textContent = acc.name || OP.session().email.split('@')[0];
  var CHIPS = [['Search papers', 'Find recent papers on plasma glycoprotein biomarkers for early diagnosis'], ['Experimental design', 'Help me design a TMT quantitative proteomics study with 10 controls and 10 patients'], ['Interpretation of results', 'Interpret the top 20 differentially expressed proteins'], ['Smart prompt', '']];
  var CHATS = [
    { t: '조기 진단 Glycoprotein 후보', m: [['me', '조기 진단에 쓸 수 있는 혈장 Glycoprotein 후보를 알려줘'], ['bot', '최근 연구에서 반복적으로 보고된 후보는 AGP1, HPX, SERPINA3 등입니다. 각 후보의 근거 논문과 측정 방법을 정리해 드릴까요?\n(베타 예시 답변입니다)']] },
    { t: '단백질 발현 변화', m: [['me', '처리군에서 단백질 발현 변화가 큰 경로를 알려줘'], ['bot', '차등 발현 단백질 기준으로 PI3K-AKT, MAPK 경로가 가장 크게 바뀌었습니다.\n(베타 예시 답변입니다)']] },
    { t: 'KRAS mutation 관련 단백질', m: [['me', 'KRAS mutation과 관련된 단백질을 찾아줘'], ['bot', 'KRAS 하위 신호인 RAF1, MAP2K1, MAPK3의 인산화 변화가 자주 보고됩니다.\n(베타 예시 답변입니다)']] }
  ];
  var cur = -1, live = [];
  var toast = function (t) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2200); };
  function boxHTML() {
    return '<div class="pbox"><textarea id="q" rows="1" placeholder="Enter \'@\' for KB project explore or \'/\' for command."></textarea>' +
      '<div class="ptools"><div class="l"><button type="button" class="gbtn" id="att" aria-label="파일 첨부"><img src="assets/ai/ic-attach.svg" width="24" height="24" alt=""></button>' +
      '<button type="button" class="gbtn" id="opt" aria-label="옵션"><img src="assets/ai/ic-options.svg" width="24" height="24" alt=""></button></div>' +
      '<button type="button" class="send" id="send" aria-label="보내기" disabled><img src="assets/ai/ic-enter.svg" width="40" height="40" alt=""></button></div></div>';
  }
  function draw() {
    $('#recent').innerHTML = CHATS.map(function (c, i) { return '<li><button type="button" data-c="' + i + '"' + (i === cur ? ' class="on"' : '') + '>' + esc(c.t) + '</button></li>'; }).join('');
    var msgs = cur > -1 ? CHATS[cur].m : live;
    $('#content').innerHTML = (msgs.length
      ? '<div class="chat"><div class="msgs" id="msgs">' + msgs.map(function (m) { return '<div class="msg ' + m[0] + '">' + esc(m[1]) + '</div>'; }).join('') + '</div>' + boxHTML() + '</div>'
      : '<div class="prompt"><h1>How can I help you?</h1><div class="pbox-wrap">' + boxHTML() + '<div class="chips">' + CHIPS.map(function (c, i) { return '<button type="button" data-chip="' + i + '">' + c[0] + '</button>'; }).join('') + '</div></div></div>') +
      '<p class="foot">CellKey AI can make mistakes. Check again for important information.</p>';
    var box = $('#msgs'); if (box) box.scrollTop = 1e6;
    var q = $('#q'), send = $('#send');
    q.addEventListener('input', function () { send.disabled = !q.value.trim(); q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 200) + 'px'; });
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); go(q.value.trim()); } });
    send.addEventListener('click', function () { go(q.value.trim()); });
  }
  function go(text) {
    if (!text) return;
    var msgs = cur > -1 ? CHATS[cur].m : live;
    msgs.push(['me', text], ['bot', '베타 화면이라 실제 답변은 아직 연결되지 않았습니다. 연결되면 논문과 분석 결과를 근거로 답변합니다.']);
    if (cur < 0) { CHATS.unshift({ t: text.slice(0, 22), m: live }); cur = 0; live = []; }
    draw(); $('#q').focus();
  }
  // 모바일 메뉴 (drawer): 열 때는 접힘 상태를 잠시 풀어 전체 메뉴(새 대화·최근 대화·프로필)를 보여주고, 닫으면 원래대로
  var wasFold = false;
  var drawer = function (on) {
    var h = document.documentElement; if (on === h.classList.contains('drawer')) return;
    if (on) { wasFold = h.classList.contains('folded'); h.classList.remove('folded'); h.classList.add('drawer'); }
    else { h.classList.remove('drawer'); if (wasFold) h.classList.add('folded'); }
    try { if (parent !== window) parent.postMessage(on ? 'op-ai-drawer-on' : 'op-ai-drawer-off', '*'); } catch (e) {} // 바깥 창의 닫기(X)를 메뉴가 열린 동안 숨김
    $('#mMenu').setAttribute('aria-expanded', on); $('#mMenu').setAttribute('aria-label', on ? '메뉴 닫기' : '메뉴 열기');
  };
  window.addEventListener('resize', function () { if (getComputedStyle($('#mMenu')).display === 'none') drawer(false); }); // 넓어져서 메뉴 버튼이 사라지면 닫기
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.documentElement.classList.contains('drawer')) { e.stopImmediatePropagation(); drawer(false); } }, true);
  document.addEventListener('click', function (e) {
    if (e.target.closest('#mMenu')) { drawer(!document.documentElement.classList.contains('drawer')); return; }
    if (e.target.closest('#mDim')) { drawer(false); return; }
    if (document.documentElement.classList.contains('drawer') && e.target.closest('#fold')) { drawer(false); return; } // 메뉴 안의 접기 버튼 = 닫기
    if (document.documentElement.classList.contains('drawer') && e.target.closest('[data-c], #newChat')) drawer(false); // 대화를 고르면 닫힘
    var c = e.target.closest('[data-c]'); if (c) { cur = +c.dataset.c; draw(); return; }
    var ch = e.target.closest('[data-chip]'); if (ch) { var v = CHIPS[+ch.dataset.chip][1]; if (!v) { toast('베타: Smart prompt는 준비 중입니다.'); return; } var q = $('#q'); q.value = v; q.dispatchEvent(new Event('input')); q.focus(); return; }
    if (e.target.closest('#newChat')) { cur = -1; live = []; draw(); $('#q').focus(); return; }
    if (e.target.closest('#att')) { toast('베타: 파일·KB 프로젝트 첨부는 준비 중입니다.'); return; }
    if (e.target.closest('#opt')) { toast('베타: 답변 옵션은 준비 중입니다.'); return; }
    if (e.target.closest('#fold')) { var f = document.documentElement.classList.toggle('folded'); e.target.closest('#fold').setAttribute('aria-expanded', !f); e.target.closest('#fold').setAttribute('aria-label', f ? '메뉴 펼치기' : '메뉴 접기'); if (!RAIL) try { localStorage.setItem('op.aiFold', f ? '1' : ''); } catch (er) {} return; }
    if (e.target.closest('#credit')) { toast('베타: 크레딧은 준비 중입니다.'); return; }
    if (e.target.closest('#setting')) { toast('베타: 설정은 준비 중입니다.'); return; }
  });
  try { if (RAIL || localStorage.getItem('op.aiFold')) { document.documentElement.classList.add('folded'); $('#fold').setAttribute('aria-expanded', 'false'); $('#fold').setAttribute('aria-label', '메뉴 펼치기'); } } catch (er) {} // 접힘 상태 기억 (이 브라우저)
  draw();
})();
</script>
</body>
</html>
