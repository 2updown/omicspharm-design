<style>
  :root { --p30:#1db3a4; --p40:#0ac4b2; --g0:#000; --g20:#333; --g30:#4d4d4d; --g40:#666; --g50:#808080; --g60:#999; --g90:#e5e5e5; --g95:#f2f2f2; --glass:0 4px 10px rgba(55,55,55,.05); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }

  .folded .ai-title { display:none !important; }

  .recent { display:flex; flex-direction:column; gap:8px; padding:0 8px; }

  .recent ul { list-style:none; display:flex; flex-direction:column; }

  .recent .more { flex:none; display:grid; place-items:center; width:24px; height:24px; border-radius:4px; } .recent .more:hover { background:var(--g95); }

  .prompt h1 { font-size:32px; font-weight:600; line-height:40px; color:var(--g20); text-align:center; }
  .pbox-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; }

  .gbtn { display:grid; place-items:center; width:40px; height:40px; border-radius:8px; background:rgba(255,255,255,.5); box-shadow:var(--glass); }
  .gbtn:hover { background:#fff; }
  .send { width:40px; height:40px; border-radius:50%; }
  .send:disabled { cursor:default; } /* 시안과 같은 모양 유지 (빈 입력이면 눌러도 동작 안 함) */
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; width:100%; }
  .chips button { padding:10px 16px; border-radius:8px; background:rgba(255,255,255,.5); box-shadow:var(--glass); font-size:14px; line-height:23px; letter-spacing:.25px; color:var(--g20); }
  .chips button:hover { background:#fff; }
  /* 대화 (Figma 시안 없음 · 프로토타입용) */
  .chat { position:relative; z-index:1; display:flex; flex-direction:column; width:100%; height:100%; padding:40px 0 20px; } /* 아래 안내 문구 없이 입력칸이 바닥에서 20 */
  .msgs { flex:1; overflow:auto; display:flex; flex-direction:column; gap:16px; width:724px; max-width:100%; margin:0 auto; padding-bottom:24px; }
  .msg { max-width:85%; padding:12px 16px; border-radius:16px; font-weight:500; font-size:15px; line-height:24px; white-space:pre-line; }
  .msg.me { align-self:flex-end; display:flex; flex-direction:column; align-items:flex-start; gap:6px; border-radius:12px; background:rgba(255,255,255,.7); box-shadow:var(--glass); color:var(--g20); font-size:16px; } /* 2026-11-19 Figma Report_process 말풍선: 흰 카드, 위에 @칩·선택 표시, 폭은 내용에 맞춤(hug) */
  .msg.me .atchip { font-size:14px; line-height:20px; } .msg.me .seltag { font-size:14px; font-weight:600; color:#18988b; }
  .msg.bot, .msg.proc { align-self:flex-start; max-width:100%; padding:0; font-size:16px; font-weight:400; line-height:26px; color:var(--g20); } /* 답변: 말풍선 없이 글자 */
  .msg b { font-weight:600; } .msg .off { color:var(--g60); }
  .msg hr { margin:20px 0; border:0; border-top:1px solid var(--g90); }
  .msg h4 { margin-bottom:8px; font-size:18px; font-weight:600; line-height:28px; } .msg .sum p + p { margin-top:8px; }
  .chat .pbox { margin:0 auto; }
  /* 대화 중 입력칸은 한 줄 (2026-11-20, BioEOS 대화 화면·Figma Report_process): [첨부][옵션] 입력 [보내기], 선택 표시는 그 위 */
  .chat .pbox { display:grid; grid-template-columns:auto 1fr auto; grid-template-areas:"sel sel sel" "tools q send"; align-items:center; gap:0 12px; padding:8px 8px 8px 12px; }
  .chat .ptools { display:contents; }
  .chat .ptools .l { grid-area:tools; }
  .chat .pbox .qrow { grid-area:q; padding:0; align-items:center; }
  .chat .pbox .send { grid-area:send; }
  .chat .pbox .psel { grid-area:sel; margin:0; padding:6px 4px 8px; }
  .chat .pbox.has-sel .qrow { padding-top:0; }
  .chat .pbox textarea { padding:8px 0; }
  .toast { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); padding:10px 16px; border-radius:8px; background:rgba(51,51,51,.92); color:#fff; font-size:14px; line-height:20px; }
  /* 오른쪽 패널로 띄운 경우: 왼쪽 메뉴는 접힌 상태(아이콘 줄)로 시작 + 위에 로고 줄 (오른쪽 위 X는 바깥 창에 있음, 2026-10-26 메뉴 추가) */
  .emb-panel .content { padding:56px 20px 56px; }
  .emb-panel .prompt h1 { font-size:26px; line-height:34px; }
  .emb-panel .pnl-head { display:flex; }
  .pnl-head { display:none; position:absolute; top:0; left:72px; right:0; align-items:center; gap:8px; height:56px; padding:0 20px; z-index:1; }
  .emb-panel .chat { padding-top:64px; }
  .emb-panel:not(.folded) .pnl-head { display:none; }
  .emb-mob .bar { display:none !important; } .emb-mob .content { padding-top:56px; }
  /* 모바일 (2026-10-26, Figma 2011:22085 Icons/Large/menu bar): 왼쪽 위 메뉴 버튼 → 누르면 왼쪽에서 메뉴가 밀려 나옴 */
  .mbtn { display:none; position:absolute; top:12px; left:12px; z-index:5; width:40px; height:40px; border-radius:4px; }
  .mbtn img { position:absolute; left:8px; top:11px; } .mbtn .i-on { display:none; }
  .drawer .mbtn { background:var(--g95); } .drawer .mbtn .i-off { display:none; } .drawer .mbtn .i-on { display:block; }
  @media (max-width:900px) { html:not(.emb-panel):not(.emb-inline) .mbtn { display:block; } html:not(.emb-panel):not(.emb-inline) .content { padding-top:64px; } }
  .emb-mob .mbtn { display:block; } .emb-mob .content { padding-top:64px; }
  .mdim { display:none; position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.32); }
  html.drawer .mdim { display:block; }
  html.drawer .brand { justify-content:space-between; } /* 제목 ↔ 메뉴 버튼 양쪽 정렬 */
  html.drawer .bar { display:flex !important; position:fixed; top:0; left:0; bottom:0; z-index:20; width:min(300px, 84vw); height:auto; background:#fff; box-shadow:8px 0 24px rgba(0,0,0,.12); animation:drawIn .22s ease-out; }
  @keyframes drawIn { from { transform:translateX(-100%); } to { transform:none; } }
  @media (prefers-reduced-motion:reduce) { html.drawer .bar { animation:none; } } /* 메뉴를 펼치면 메뉴에 로고가 있으니 위 로고 줄 숨김 */
  @media (max-width:900px) { .bar { display:none; } .prompt h1 { font-size:26px; line-height:34px; } .emb-panel .bar, .emb-inline .bar { display:flex; } }
  /* 답변 옵션 팝오버 (Figma 2206:32572, 2026-11-17): SDF Job → Project list */
  .ptools .l { position:relative; }
  .gbtn.on { background:#fff; }
  .opop { position:absolute; top:44px; left:48px; z-index:10; overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:2px; width:220px; padding:8px 4px 12px; border-radius:8px; background:rgba(255,255,255,.95); box-shadow:var(--glass); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .opop.up { top:auto; bottom:44px; }
  .opop .row { display:flex; align-items:center; justify-content:space-between; width:100%; height:36px; padding:0 16px; font-size:14px; line-height:20px; color:var(--g20); }

  .opop .hr { width:100%; padding:6px 16px; } .opop .hr i { display:block; height:1px; background:var(--g90); }
  .opop h5 { width:100%; padding:0 16px; font-size:18px; font-weight:600; line-height:30px; letter-spacing:.15px; color:var(--g20); }
  .sw { position:relative; width:48px; height:36px; flex:none; }

  .sw[aria-checked="true"]::before { background:var(--p30); } .sw[aria-checked="true"]::after { left:24px; }
  .plist { display:flex; align-items:center; justify-content:space-between; width:180px; height:40px; padding:0 4px 0 16px; border:1px solid #3fd8c9; border-radius:8px; background:linear-gradient(171deg, #ecfcfa 14%, #fef9f7 50%, #fff 86%); font-size:14px; line-height:20px; color:var(--g20); }
  .plist:hover { background:#ecfcfa; }
  /* 선택한 프로젝트·보고서: 입력칸 위 청록 글자 + X (Figma 2736:21650) */
  .psel { display:flex; flex-wrap:wrap; gap:10px; padding:16px 20px 0; }

  .psel button { display:grid; place-items:center; width:18px; height:18px; color:#18988b; }
  .pbox.has-sel .psel { margin-bottom:-26px; } .pbox.has-sel .qrow { padding-top:4px; } /* 칩 ↔ 입력칸 간격 10 (pbox gap 32 상쇄) */
  /* @ 프로젝트 불러오기 (2026-11-18, Figma 2785:23512 · BioEOS @ 목록 참고): 입력칸에 @ → 위로 목록, 고르면 파란 칩 */
  .atchip { flex:none; padding:1px 10px; border:1px solid #b9d1ff; border-radius:16px; background:#e8f0ff; font-size:16px; font-weight:600; line-height:23px; letter-spacing:.15px; color:#276df4; white-space:nowrap; }
  .atpop { position:absolute; left:20px; bottom:calc(100% + 4px); z-index:12; display:flex; flex-direction:column; width:280px; max-height:260px; padding-bottom:4px; border-radius:8px; background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.1); }

  .atpop li b { font-size:14px; font-weight:500; line-height:20px; color:var(--g20); }
  .atpop li small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:500; line-height:18px; color:var(--g60); }
  .atpop li.on { background:var(--g95); }
  .atpop .none { padding:12px 16px; font-size:14px; font-weight:500; color:var(--g60); cursor:default; }
  /* Project list / Report list 모달 (Figma 2734:20558 A안, 2742:20636 B안). 단일 선택 */
  .pl-dim { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.3); }
  .pl > * { flex:none; } .pl > .pl-tbl { flex:0 1 auto; height:550px; min-height:200px; overflow:auto; } /* 표 칸 높이 고정(머리 50 + 10줄 × 50): 검색 결과가 적거나 없어도 모달 높이 그대로 */ /* 낮은 화면: 표만 스크롤(제목·버튼·검색·페이지 번호 고정), 표가 200보다 작아질 만큼 낮으면 모달 전체 스크롤 */
  .pl { display:flex; flex-direction:column; gap:24px; width:1190px; max-width:100%; max-height:100%; overflow:auto; padding:8px 0 24px; border-radius:10px; background:#fff; box-shadow:0 8px 32px rgba(0,0,0,.12); font-weight:500; }

  .pl .acts { display:flex; flex:none; gap:8px; }
  .pl-btn { height:40px; padding:0 24px; border-radius:4px; font-size:14px; font-weight:600; }
  .pl-btn.c { background:var(--g95); color:var(--g20); } .pl-btn.c:hover { background:var(--g90); }
  .pl-btn.s { background:var(--p40); color:#fff; } .pl-btn.s:hover { background:var(--p30); }

  function go(text) {

        if (r.length > 1) { pending = ctx.no; msgs.push(['bot', '이 프로젝트에는 보고서가 ' + r.length + '건 있습니다. 어떤 보고서를 기준으로 답변할까요?\n\n' + r.map(function (x, k) { return (k + 1) + '. ' + repLine(ctx.no, x); }).join('\n'), 'ask']); }
        else runProc(msgs, ctx.no, r[0]); }
    } else msgs.push(['bot', '베타 화면이라 실제 답변은 아직 연결되지 않았습니다. 연결되면 논문과 분석 결과를 근거로 답변합니다.']);
    draw(); $('#q').focus();
  }
  // 모바일 메뉴 (drawer): 열 때는 접힘 상태를 잠시 풀어 전체 메뉴(새 대화·최근 대화·프로필)를 보여주고, 닫으면 원래대로
  var wasFold = false;
  var drawer = function (on) {

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.documentElement.classList.contains('drawer')) { e.stopImmediatePropagation(); drawer(false); } }, true);
  document.addEventListener('click', function (e) {

      if (dd) { var had = $('#fpop'); fpopClose(); if (had && had.dataset.for === dd.dataset.dd) return; var pi = +dd.dataset.dd, rc = dd.getBoundingClientRect(), cur0 = repPick[pi] || 0;
        dd.classList.add('open');

        return; }
      var ro = e.target.closest('[data-ro]'); if (ro) { var v = ro.dataset.ro.split(':'); repPick[+v[0]] = +v[1]; plPick = +v[0]; fpopClose(); plDraw(); return; } // 보고서를 고르면 그 줄도 선택
      var tr = e.target.closest('[data-pick]'); if (tr) { var k = +tr.dataset.pick; plPick = plPick === k ? -1 : k; plDraw(); return; } // 단일 선택: 다른 줄을 고르면 바뀜, 같은 줄을 다시 누르면 해제
      var pg = e.target.closest('[data-pg]'); if (pg) { plPage = pg.dataset.pg === '+' ? Math.min(10, plPage + 1) : +pg.dataset.pg; plDraw(); return; }

    if (false) { var mc = CHATS[cur]; if (!mc) return; var dt = new Date(); mc.memo.unshift({ d: dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2) + ' ' + ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2), t: '' }); memoDraw(); var ta = document.querySelector('[data-memo="0"]'); if (ta) ta.focus(); return; }
