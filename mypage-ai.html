<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/common/favicon.png?v=2">
<title>AI Agent · 마이페이지 · OmicsPharm</title>
<!-- 마이페이지 > AI Agent (beta). 2026-10-21 내부 미팅: 로그인 회원용 AI 에이전트. 오른쪽 아래 CS 챗봇·[문의하기]와는 별개
     참고 화면: CellKey SpAC9 Data Foundry의 AI 탭 (+ 새 대화 · 최근 대화 목록 · 가운데 입력창 + 첨부·옵션 · 추천 버튼 · 약관 안내)
     프로토타입: 실제 답변 없음. 보내면 예시 답변을 보여주고, 대화는 이 화면에서만 유지 (새로고침하면 처음 상태) -->
<link rel="stylesheet" href="assets/common/site.css?v=20261021o">
<link rel="stylesheet" href="assets/common/mypage.css?v=20261021o">
<script src="assets/common/site.js?v=20261021o"></script>
<script src="assets/common/mypage.js?v=20261021o"></script>
<script src="assets/common/flow.js?v=20261021o"></script>
<style>
  .ai { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:640px; padding:0; overflow:hidden; gap:0; }
  .ai-side { display:flex; flex-direction:column; gap:12px; padding:16px 12px; border-right:1px solid var(--gray-200); background:var(--gray-50); }
  .ai-new { display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; border-radius:8px; font-size:14px; font-weight:600; color:#000; }
  .ai-new:hover { background:#fff; }
  .ai-new img { width:16px; height:16px; }
  .ai-side h4 { padding:0 12px; font-size:13px; font-weight:600; line-height:20px; color:var(--gray-600); }
  .ai-recent { display:flex; flex-direction:column; gap:2px; overflow:auto; }
  .ai-recent button { display:block; width:100%; padding:8px 12px; border-radius:8px; font-size:13px; line-height:20px; color:var(--gray-600); text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ai-recent button:hover { background:#fff; color:#000; }
  .ai-recent button.on { background:#fff; color:#000; font-weight:600; }
  .ai-main { position:relative; display:flex; flex-direction:column; min-width:0; background:radial-gradient(ellipse 60% 50% at 50% 48%, #e6f7f4 0%, #fff 70%); }
  .ai-body { flex:1; display:flex; flex-direction:column; padding:32px 40px 0; overflow:auto; }
  .ai-hello { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding-bottom:40px; }
  .ai-hello h2 { font-size:26px; font-weight:700; line-height:36px; }
  .ai-msgs { display:flex; flex-direction:column; gap:16px; max-width:720px; width:100%; margin:0 auto; padding-bottom:24px; }
  .ai-msg { max-width:85%; padding:12px 16px; border-radius:14px; font-size:14px; line-height:22px; white-space:pre-line; }
  .ai-msg.me { align-self:flex-end; background:var(--teal-600); color:#fff; border-bottom-right-radius:4px; }
  .ai-msg.bot { align-self:flex-start; background:#fff; border:1px solid var(--gray-200); border-bottom-left-radius:4px; }
  .ai-msg.bot b { display:flex; align-items:center; gap:4px; margin-bottom:4px; font-size:12px; color:var(--teal-700); }
  .ai-msg.bot b img { width:14px; height:14px; }
  .ai-box { width:100%; max-width:480px; display:flex; flex-direction:column; gap:10px; padding:14px 16px 12px; border:1px solid #cdeee8; border-radius:14px; background:#f4fbfa; }
  .ai-foot .ai-box { max-width:720px; margin:0 auto; }
  .ai-box textarea { width:100%; min-height:24px; max-height:160px; border:0; background:none; resize:none; font-size:14px; line-height:22px; outline:0; }
  .ai-box .row { display:flex; align-items:center; gap:6px; }
  .ai-ic { display:grid; place-items:center; width:30px; height:30px; border:1px solid var(--gray-200); border-radius:8px; background:#fff; }
  .ai-ic:hover { border-color:var(--gray-300); }
  .ai-ic img { width:16px; height:16px; }
  .ai-send { margin-left:auto; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--teal-600); }
  .ai-send:disabled { background:#a8e0d8; cursor:default; }
  .ai-send img { width:16px; height:16px; filter:brightness(0) invert(1); }
  .ai-chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  .ai-chips button { height:32px; padding:0 12px; border:1px solid var(--gray-200); border-radius:8px; background:#fff; font-size:13px; font-weight:500; color:var(--gray-700); }
  .ai-chips button:hover { border-color:var(--teal-600); color:var(--teal-700); }
  .ai-foot { padding:12px 40px 0; }
  .ai-terms { padding:12px 16px 16px; font-size:12px; line-height:18px; color:var(--gray-400); text-align:center; }
  .ai-terms a { color:var(--gray-500); text-decoration:underline; }
  @media (max-width:900px) { .ai { grid-template-columns:1fr; } .ai-side { border-right:0; border-bottom:1px solid var(--gray-200); } .ai-recent { flex-direction:row; overflow-x:auto; } .ai-recent button { width:auto; flex:none; } .ai-body, .ai-foot { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in">
  <h1>마이페이지</h1>
</div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>

  <div class="main">
    <section class="card ai">
      <div class="ai-side">
        <button type="button" class="ai-new" id="newChat"><img src="assets/auth/ic-plus.svg" alt="">새 대화</button>
        <h4>최근 대화</h4>
        <div class="ai-recent" id="recent"></div>
      </div>
      <div class="ai-main">
        <div class="ai-body" id="body"></div>
        <div class="ai-foot" id="foot" hidden></div>
        <p class="ai-terms">메시지를 보내면 CellKey AI <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의한 것으로 봅니다.</p>
      </div>
    </section>
  </div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var me = OP.mypage('ai'); if (!me) return;
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  // 추천 버튼 (참고 화면과 같은 4개)
  var CHIPS = [['논문 검색', 'Proteomics로 혈장 바이오마커를 찾은 최근 논문을 찾아줘'], ['실험 설계', '대조군 10명, 환자군 10명 혈장으로 정량 단백체 분석을 하려면 어떻게 설계해야 할까?'], ['결과 해석', '차등 발현 단백질 상위 20개의 의미를 해석해줘'], ['스마트 프롬프트', '']];
  // 예시 대화 (최근 대화 목록)
  var CHATS = [
    { t: 'DEP 상위 20개 해석', m: [['me', '간암 조직 인산화 단백체 결과에서 DEP 상위 20개를 해석해줘'], ['bot', '상위 20개 중 MAPK·PI3K-AKT 경로에 속한 단백질이 7개로 가장 많습니다.\n특히 인산화가 증가한 STMN1, MAPK3는 종양 증식과 관련이 보고되어 있어 후속 검증 후보로 볼 수 있습니다.\n(베타 예시 답변입니다)']] },
    { t: '혈장 단백체 실험 설계', m: [['me', '혈장 20개로 TMT 정량 단백체 분석 설계를 도와줘'], ['bot', 'TMT 16plex 기준으로 한 배치에 모두 들어갑니다. 고농도 단백질 제거(depletion) 여부와 풀링 샘플을 기준 채널로 둘지 먼저 정하는 것을 추천합니다.\n(베타 예시 답변입니다)']] },
    { t: 'SCFA 정량 관련 논문', m: [['me', '장내 미생물 단쇄지방산 정량 분석 논문 찾아줘'], ['bot', 'GC-MS 기반 SCFA 정량 논문 3편을 찾았습니다. 시료 전처리(유도체화) 방법이 서로 달라 비교표로 정리해 드릴까요?\n(베타 예시 답변입니다)']] }
  ];
  var cur = -1, live = [];
  function boxHTML(ph) {
    return '<div class="ai-box"><textarea id="q" rows="1" placeholder="' + ph + '"></textarea>' +
      '<div class="row"><button type="button" class="ai-ic" id="att" title="파일 첨부" aria-label="파일 첨부"><img src="assets/auth/ic-paperclip.svg" alt=""></button>' +
      '<button type="button" class="ai-ic" id="opt" title="옵션" aria-label="옵션"><img src="assets/service/ic-sliders-horizontal.svg" alt=""></button>' +
      '<button type="button" class="ai-send" id="send" aria-label="보내기" disabled><img src="assets/main/ic-arrow-up.svg" alt=""></button></div></div>';
  }
  function recent() {
    $('#recent').innerHTML = CHATS.map(function (c, i) { return '<button type="button" data-c="' + i + '"' + (i === cur ? ' class="on"' : '') + '>' + esc(c.t) + '</button>'; }).join('');
  }
  function draw() {
    recent();
    var msgs = cur > -1 ? CHATS[cur].m : live;
    if (!msgs.length) {
      $('#foot').hidden = true;
      $('#body').innerHTML = '<div class="ai-hello"><h2>무엇을 도와드릴까요?</h2>' + boxHTML('CellKey AI에게 물어보세요') +
        '<div class="ai-chips">' + CHIPS.map(function (c, i) { return '<button type="button" data-chip="' + i + '">' + c[0] + '</button>'; }).join('') + '</div></div>';
    } else {
      $('#body').innerHTML = '<div class="ai-msgs">' + msgs.map(function (m) { return '<div class="ai-msg ' + m[0] + '">' + (m[0] === 'bot' ? '<b><img src="assets/common/ic-sparkle-fill.svg" alt="">CellKey AI</b>' : '') + esc(m[1]) + '</div>'; }).join('') + '</div>';
      $('#foot').hidden = false; $('#foot').innerHTML = boxHTML('이어서 물어보세요');
      $('#body').scrollTop = 1e6;
    }
    bind();
  }
  function bind() {
    var q = $('#q'), send = $('#send');
    q.addEventListener('input', function () { send.disabled = !q.value.trim(); q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; });
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (q.value.trim()) go(q.value.trim()); } });
    send.addEventListener('click', function () { go(q.value.trim()); });
    $('#att').addEventListener('click', function () { OP.toast('베타: 파일·내 프로젝트 결과 첨부는 준비 중입니다.'); });
    $('#opt').addEventListener('click', function () { OP.toast('베타: 답변 옵션(모델·출처 등)은 준비 중입니다.'); });
  }
  function go(text) {
    if (!text) return;
    var msgs = cur > -1 ? CHATS[cur].m : live;
    msgs.push(['me', text]);
    msgs.push(['bot', '베타 화면이라 실제 답변은 아직 연결되지 않았습니다. 연결되면 질문에 맞춰 논문·분석 결과를 근거로 답변합니다.']);
    if (cur < 0) { CHATS.unshift({ t: text.slice(0, 20), m: live }); cur = 0; live = []; }
    draw();
  }
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-c]'); if (c) { cur = +c.dataset.c; draw(); return; }
    var ch = e.target.closest('[data-chip]'); if (ch) { var v = CHIPS[+ch.dataset.chip][1]; if (!v) { OP.toast('베타: 스마트 프롬프트는 준비 중입니다.'); return; } var q = $('#q'); q.value = v; q.dispatchEvent(new Event('input')); q.focus(); }
    if (e.target.closest('#newChat')) { cur = -1; live = []; draw(); $('#q').focus(); }
  });
  draw();
})();
</script>
</body>
</html>
