<title>견적관리 · 마이페이지 · OmicsPharm</title>
<!-- 마이페이지 > 견적관리 (분석파트너 전용). 현재 홈페이지 견적서 작성 화면(mypage/estimate-write)을 새 디자인으로 옮긴 초안.
     ?rid=프로젝트 번호 → 컨설턴트가 보낸 견적 요청: 의뢰내용 + 견적서 작성(고객사 / 공급자 / 제안가 / 소요 기간 / Notice) · 견적 거절 · 수정 요청 반영
     ?id=프로젝트번호 → 프로젝트 찾기에서 직접 쓰는 견적 (예전 방식, op.quotes2)
     ?id 없음 → 받은 견적 요청 목록. 데이터: assets/common/flow.js -->
<link rel="stylesheet" href="assets/common/site.css?v=20261008s">
<link rel="stylesheet" href="assets/common/mypage.css?v=20261008s">
<script src="assets/common/site.js?v=20261008s"></script>
<script src="assets/common/mypage.js?v=20261008s"></script>

<style>
  /* 탭 (상단에 붙음) */
  .qtabs { position:sticky; top:70px; z-index:5; display:flex; gap:8px; margin:-24px -24px 0; padding:16px 24px; background:#fff; border-radius:16px 16px 0 0; border-bottom:1px solid var(--gray-200); }
  .qtabs button { height:36px; padding:0 16px; border-radius:99px; background:var(--gray-100); font-size:14px; font-weight:500; color:var(--gray-500); }
  .qtabs button.on { background:#000; color:#fff; }
  .qhead-card { gap:16px; }
  #card .sec[hidden] { display:none; }
  .next { display:flex; justify-content:flex-end; padding-top:8px; }
  /* 수량: 분석 의뢰 등록의 '총 시료 수'와 같은 숫자 입력 (직접 입력 + 브라우저 기본 ▲▼) */
  .items .qty { padding:0 4px 0 12px; text-align:left; }

  /* 의뢰 요약 */
  .phead { display:flex; flex-direction:column; gap:12px; }
  .prow { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .badges { display:flex; gap:6px; }
  .reg { font-size:12px; line-height:18px; color:var(--gray-500); }
  .ptitle { display:flex; align-items:center; gap:8px; font-size:22px; font-weight:600; line-height:30px; letter-spacing:-.22px; word-break:keep-all; }
  .ptitle .back { display:flex; align-items:center; justify-content:center; width:32px; height:32px; margin-left:-6px; border-radius:8px; flex:none; }
  .ptitle .back:hover { background:var(--gray-100); }
  .ptitle img { width:22px; height:22px; }
  .period { display:inline-flex; align-items:center; gap:10px; height:36px; padding:0 14px; border:1px solid var(--gray-300); border-radius:99px; font-size:14px; white-space:nowrap; }
  .period b { font-weight:600; } .period em { font-style:normal; color:var(--teal-600); font-weight:500; }
  .summary { display:grid; grid-template-columns:repeat(4, auto); justify-content:space-between; gap:12px 24px; padding:18px 24px; border-radius:8px; background:var(--bg-green); }
  .summary div { display:flex; align-items:center; gap:8px; font-size:14px; line-height:20px; white-space:nowrap; }
  .summary img { width:20px; height:20px; filter:brightness(0); }
  .summary em { font-style:normal; color:var(--gray-500); }

  .sec { display:flex; flex-direction:column; gap:12px; min-width:0; scroll-margin-top:140px; }
  #card { min-width:0; }
  .sec h3 { font-size:18px; font-weight:600; line-height:24px; letter-spacing:-.18px; }
  .sec h4 { margin-top:8px; font-size:15px; font-weight:600; line-height:22px; }
  .kv { border-top:2px solid #000; }
  .kv > div { display:flex; border-bottom:1px solid var(--gray-200); font-size:14px; line-height:20px; }
  .kv dt { width:200px; flex:none; padding:12px 18px; background:var(--gray-100); font-weight:500; }
  .kv dd { flex:1; min-width:0; padding:12px 18px; word-break:break-word; }
  .note { padding:20px 24px; border-radius:8px; background:var(--bg-green); font-size:15px; line-height:24px; white-space:pre-line; }
  .divider { height:1px; background:var(--gray-200); }

  /* 고객사·공급자: 2열 표 */
  .grid2 { display:grid; grid-template-columns:140px 1fr 140px 1fr; border-top:2px solid #000; font-size:14px; line-height:20px; }
  .grid2 > * { display:flex; align-items:center; min-height:48px; padding:6px 14px; border-bottom:1px solid var(--gray-200); }
  .grid2 .k { background:var(--gray-100); font-weight:500; }
  .grid2 .wide { grid-column:2 / -1; }
  .inp { width:100%; height:36px; padding:0 12px; border:1px solid var(--gray-300); border-radius:8px; background:#fff; font-size:14px; }
  .inp:focus { outline:0; border-color:var(--teal-700); box-shadow:0 0 0 3px #00786e33; }
  .inp.num { text-align:right; }

  /* 제안가 */
  .unit { display:flex; align-items:center; justify-content:flex-end; gap:8px; font-size:13px; color:var(--gray-600); }
  .unit select { height:36px; padding:0 32px 0 12px; border:1px solid var(--gray-300); border-radius:8px; background:#fff url(assets/find/ic-chevron-down.svg) right 10px center/16px no-repeat; appearance:none; -webkit-appearance:none; font-size:14px; }
  .tblwrap { max-width:100%; overflow-x:auto; }
  .items { width:100%; min-width:760px; border-collapse:collapse; border-top:2px solid #000; font-size:14px; line-height:20px; }
  .items th { height:44px; padding:0 8px; background:var(--gray-100); border-bottom:1px solid var(--gray-200); font-weight:500; }
  .items th .add { margin-left:6px; height:22px; padding:0 8px; border-radius:6px; background:var(--gray-600); color:#fff; font-size:12px; }
  .items td { padding:6px 8px; border-bottom:1px solid var(--gray-200); vertical-align:middle; }
  .items td.name { width:22%; vertical-align:top; border-right:1px solid var(--gray-200); }
  .items td.amt { width:14%; text-align:right; font-weight:500; white-space:nowrap; }
  .items .c-qty { width:11%; } .items .c-unit { width:8%; } .items .c-price { width:15%; } .items .c-del { width:36px; }
  .items .namebox { display:flex; flex-direction:column; gap:6px; }
  .items .linkbtn { align-self:flex-start; font-size:12px; color:var(--teal-700); font-weight:500; }
  .items .del { width:28px; height:28px; border-radius:6px; color:var(--gray-400); font-size:18px; line-height:28px; }
  .items .del:hover { background:var(--gray-100); color:var(--red-600); }
  .items tr.sub td { background:var(--gray-50); font-weight:500; }
  .totals { width:100%; border-collapse:collapse; font-size:14px; line-height:20px; }
  .totals td { height:44px; padding:0 14px; border-bottom:1px solid var(--gray-200); }
  .totals td:first-child { text-align:center; color:var(--gray-700); }
  .totals td:last-child { width:220px; text-align:right; font-weight:500; white-space:nowrap; }
  .totals tr.minus td { color:var(--red-600); }
  .totals tr.minus .inp { width:130px; margin-left:6px; }
  .totals tr.final td { height:52px; background:var(--bg-green); font-size:16px; font-weight:700; color:#000; }
  .totals tr.final td:last-child { color:var(--teal-700); font-size:18px; }
  textarea.inp { height:120px; padding:12px; resize:vertical; line-height:22px; }
  /* 하단 버튼: 왼쪽 임시저장(button_outline tertiary) / 오른쪽 미리보기·최종 제출 묶음 (gap 8) */
  .acts { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
  .acts .right { display:flex; gap:8px; }
  .acts .btn { min-width:160px; }
  .acts .btn.tertiary { border-color:var(--gray-300); background:#fff; color:var(--gray-500); }
  .acts .btn.tertiary:hover { background:var(--gray-50); color:var(--gray-600); }

  /* 목록 */
  .qlist { border-top:2px solid #000; }
  .qrow { display:flex; align-items:center; gap:16px; padding:16px 12px; border-bottom:1px solid var(--gray-200); }
  .qrow:hover { background:var(--gray-50); }
  .qrow .t { flex:1; min-width:0; font-size:16px; font-weight:600; line-height:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qrow .t small { display:block; margin-top:2px; font-size:13px; font-weight:400; line-height:18px; color:var(--gray-500); }
  .qrow .badge { flex:none; }
  .qrow .m .due { font-style:normal; color:var(--orange-600); font-weight:500; }
  .hint { margin-top:-4px; font-size:13px; line-height:18px; color:var(--gray-500); }
  .weeks { display:flex; align-items:center; gap:8px; font-size:14px; }
  .weeks .inp { width:90px; }
  .req { color:var(--orange-600); }
  #req { gap:20px; }
  .qrow .m { flex:none; font-size:13px; color:var(--gray-500); white-space:nowrap; }
  .qrow .p { flex:none; width:140px; text-align:right; font-weight:600; }

  @media (max-width:900px) {
    .grid2 { grid-template-columns:110px 1fr; }
    .grid2 .wide { grid-column:2; }
    .summary { grid-template-columns:repeat(2, auto); justify-content:start; }
  }
  @media (max-width:640px) {
    .qtabs { margin:-16px -16px 0; padding:12px 16px; top:56px; }
    .prow { flex-direction:column; align-items:flex-start; }
    .ptitle { font-size:18px; line-height:26px; }
    .summary { grid-template-columns:1fr; }
    .kv dt { width:40%; }
    .totals td:last-child { width:auto; }
    .acts { flex-direction:column-reverse; align-items:stretch; }
    .acts .btn { min-width:0; } .acts .right .btn { flex:1; }
    .qrow { flex-wrap:wrap; gap:4px 12px; } .qrow .t { flex-basis:100%; } .qrow .p { width:auto; margin-left:auto; }
  }
</style>
</head>
<body>
<div data-op-gnb></div>

<section class="page-head"><div class="in"><h1>마이페이지</h1></div></section>

<main class="body"><div class="in">
  <aside class="side" data-op-side></aside>
  <div class="main"><section class="card qhead-card" id="head" hidden></section><section class="card" id="card"></section></div>
</div></main>

<div data-op-footer></div>

<script>
(function () {
  var me = OP.mypage('quote'); if (!me) return;
  if (me.s.role !== 'partner') { location.replace(me.s.role === 'admin' ? 'mypage-request.html' : 'mypage.html'); return; } // 견적관리는 분석파트너 전용 (컨설턴트는 의뢰 관리)
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var F = OP.flow, esc = F.esc;
  var P = OP_PROJECTS.DATA, card = $('#card');
  // 프로젝트 찾기에서 직접 쓴 견적(예전 방식): op.quotes2 { 이메일: { 프로젝트번호: {...} } }
  var KEY = 'op.quotes2', ME = me.s.email;
  try { localStorage.removeItem('op.quotes'); } catch (e) {}
  var all = function () { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  var read = function () { return all()[ME] || {}; };
  var write = function (v) { var a = all(); a[ME] = v; try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} };
  var CUR = { KRW: '₩', USD: '$', JPY: '¥' };
  var money = function (n, c) { n = Math.round(n || 0); return (CUR[c] || '₩') + ' ' + n.toLocaleString('ko-KR'); };
  var qs = new URLSearchParams(location.search), rid = qs.get('rid'), id = qs.get('id');
  var x = id !== null ? P[+id] : null;
  var dot = function (v) { return v ? String(v).replace(/-/g, '.') : '-'; };
  var dleft = function (v) { var n = Math.ceil((new Date(v + 'T23:59:59') - Date.now()) / 864e5); return n < 0 ? '마감' : 'D-' + n; };
  var BADGE = { '작성 대기': 'wait', '임시저장': 'wait', '수정 요청': 'red', '제출 완료': 'state', '클라이언트 검토 중': 'state', '선정': 'ok', '미선정': 'done', '거절': 'done' };

  // 미인증 분석파트너: 견적관리 이용 불가 (목록·작성 모두)
  if (!OP.canQuote()) {
    card.innerHTML = '<div class="empty"><b>인증된 분석파트너만 견적서를 작성할 수 있습니다</b><p>' + OP.verifyHint() + '<br>인증 전에는 공개 프로젝트 열람만 가능합니다.</p>' + (OP.hasBizDoc() ? '<a class="btn lg" href="mypage-account.html">내 정보 관리에서 확인</a>' : '<a class="btn lg primary" href="mypage-account.html#doc">사업자등록증 올리기</a>') + '</div>';
    return;
  }
  // ── 받은 견적 요청 목록 ──
  if (!x && !rid) {
    var IN = F.inbox(ME), Q = read(), cur = new URLSearchParams(location.search).get('t') || '전체'; // 대시보드에서 상태 눌러 들어오면 그 상태만
    var rows = IN.map(function (o) {
      var t = F.pst(o.s, ME);
      return { t: t, at: o.x.at, html: '<a class="qrow" href="mypage-quote.html?rid=' + encodeURIComponent(o.r.id) + '"><span class="badge ' + BADGE[t] + '">' + t + '</span>' +
        '<span class="t">' + esc(o.r.title) + '<small>' + (o.x.self ? '직접 신청' : 'OmicsPharm 요청') + ' · ' + esc(o.r.svc) + ' · ' + esc(o.r.org || '-') + '</small></span>' +
        '<span class="m">' + (/작성 대기|임시저장|수정 요청/.test(t) ? '<em class="due">마감 ' + dot(o.s.due).slice(5) + ' (' + dleft(o.s.due) + ')</em>' : '요청 ' + F.ymd(o.x.at)) + '</span>' +
        '<span class="p">' + (o.x.quote && o.x.status !== 'req' ? money(F.total(o.x.quote).final, o.x.quote.cur) : '-') + '</span></a>' };
    }).concat(Object.keys(Q).map(function (k) {
      var q = Q[k], p = P[+k] || {}, t = q.submitted ? '제출 완료' : '임시저장';
      return { t: t, at: q.at, self: 1, html: '<a class="qrow" href="mypage-quote.html?id=' + k + '"><span class="badge ' + BADGE[t] + '">' + t + '</span><span class="t">' + esc(p.title || '프로젝트') + '<small>프로젝트 찾기에서 직접 작성</small></span><span class="m">' + OP.my.ymd(q.at) + '</span><span class="p">' + money(q.final, q.cur) + '</span></a>' };
    }));
    var TABS = [['전체'], ['작성 필요', /작성 대기|임시저장|수정 요청/], ['제출 완료', /제출 완료|클라이언트 검토 중/], ['선정', /^선정/], ['종료', /미선정|거절/]];
    var todoN = rows.filter(function (o) { return !o.self && TABS[1][1].test(o.t); }).length;
    card.innerHTML = '<div class="card-head"><h3>견적관리</h3></div>' +
      (todoN ? '<div class="ftodo warn"><div><b>작성이 필요한 견적 요청 ' + todoN + '건</b><p>견적 마감일 전에 견적서를 제출해주세요. 참여가 어려우면 [견적 거절]로 알려주세요.</p></div></div>' : '') +
      '<div class="chips" id="chips" role="tablist"></div><div class="qlist" id="ql"></div>';
    var draw = function () {
      $('#chips').innerHTML = TABS.map(function (t) {
        var n = rows.filter(function (o) { return !t[1] || t[1].test(o.t); }).length;
        return '<button type="button" role="tab" data-t="' + t[0] + '"' + (cur === t[0] ? ' class="on" aria-selected="true"' : '') + '>' + t[0] + '<span>' + n + '</span></button>';
      }).join('');
      var re = (TABS.filter(function (t) { return t[0] === cur; })[0] || [])[1];
      var L = rows.filter(function (o) { return !re || re.test(o.t); });
      $('#ql').innerHTML = L.length ? L.map(function (o) { return o.html; }).join('')
        : '<div class="empty"><b>' + (cur === '전체' ? '받은 견적 요청이 없습니다' : '해당하는 견적 요청이 없습니다') + '</b><p>프로젝트 찾기에서 견적을 작성하거나, OmicsPharm 컨설턴트가 견적을 요청하면 여기에 표시됩니다.</p></div>' + (cur === '전체' ? '<div style="text-align:center"><a class="btn primary lg" href="projects.html">프로젝트 찾기</a></div>' : '');
    };
    $('#chips').addEventListener('click', function (e) { var b = e.target.closest('[data-t]'); if (b) { cur = b.dataset.t; draw(); } });
    draw();
    return;
  }

  // ── 견적서 작성 ── (rid: 컨설턴트가 보낸 견적 요청 / id: 프로젝트 찾기에서 직접 작성)
  var R, S, X, saved, locked = false, banner = '';
  if (rid) {
    R = F.req(rid); S = R && F.state(rid); X = S && S.P[ME];
    if (!X) { location.replace('mypage-quote.html'); return; } // 요청받지 않은 의뢰는 볼 수 없음
    saved = X.quote || null;
    var t = F.pst(S, ME);
    locked = !/작성 대기|임시저장|수정 요청/.test(t);
    var B = {
      '작성 대기': ['', '견적서를 작성해 제출해주세요.', '견적 마감일 ' + dot(S.due) + ' (' + dleft(S.due) + ')' + ((X.msg || S.memo) ? '\n컨설턴트 메시지: ' + (X.msg || S.memo) : ''), 1],
      '임시저장': ['', '임시저장된 견적서가 있습니다.', '견적 마감일 ' + dot(S.due) + ' (' + dleft(S.due) + ') 전에 최종 제출해주세요.' + ((X.msg || S.memo) ? '\n컨설턴트 메시지: ' + (X.msg || S.memo) : ''), 1],
      '수정 요청': ['warn', '컨설턴트가 견적 수정을 요청했습니다.', (X.rev ? X.rev.note : '') + '\n내용을 수정해 다시 제출해주세요.', 0],
      '제출 완료': ['gray', '견적서를 제출했습니다.', 'OmicsPharm 컨설턴트가 검토한 뒤 클라이언트에게 전달합니다. 수정이 필요하면 알림으로 알려드립니다.', 0],
      '클라이언트 검토 중': ['gray', '클라이언트가 견적을 검토하고 있습니다.', '컨설턴트가 견적을 클라이언트에게 전달했습니다. 선정 결과는 알림으로 알려드립니다.', 0],
      '선정': ['', '프로젝트에 선정되었습니다.', '클라이언트가 이 견적을 선택해 매칭이 완료되었습니다. 프로젝트 관리에서 계약 단계를 확인해주세요.', 0],
      '미선정': ['gray', '이번 견적은 선정되지 않았습니다.', '참여해주셔서 감사합니다.', 0],
      '거절': ['gray', '견적 요청을 거절했습니다.', '거절 사유: ' + (X.dec ? X.dec.why : '-'), 0]
    }[t];
    banner = '<div class="ftodo ' + B[0] + '"><div><b>' + esc(B[1]) + '</b><p>' + esc(B[2]) + '</p></div>' +
      (t === '선정' ? '<div class="acts"><a class="btn primary" href="mypage-project.html?id=' + encodeURIComponent(rid) + '">프로젝트 관리로 이동</a></div>' : B[3] && !X.self ? '<div class="acts"><button type="button" class="btn" id="decline">견적 거절</button></div>' : '') + '</div>';
  } else {
    // 예전 방식: 프로젝트 찾기 목록 데이터를 의뢰처럼 보여줌
    saved = read()[id] || null; locked = !!(saved && saved.submitted);
    var lo = Math.max(50, Math.round(x.price * 0.85 / 10) * 10);
    R = { id: 'P' + (x.id + 1), title: x.title, svc: x.cat, org: x.owner, samples: String(x.samples), due: x.due, budget: (lo * 10000).toLocaleString('ko-KR') + '원', open: x.priv ? '비공개' : '공개',
      sections: [{ title: '시료정보', rows: [['Taxonomy (Source)', 'Human'], ['종류', '혈장'], ['시료 수', String(x.samples)]] }, { title: '요청서류 양식', rows: [['요청서류 양식', '국문 리포트, 결과 이미지, Raw 데이터']] }, { title: '기타 분석 요구사항', note: '시료는 계약 후 냉동 상태로 발송 예정입니다.\n분석 방법과 일정에 대한 제안을 함께 부탁드립니다.' }] };
  }
  var acc = me.acc;

  // 위: 의뢰 제목·상태·안내 (항상 보임) / 아래: [의뢰내용] [견적서 작성] 탭 중 하나만 보임
  var head = $('#head'); head.hidden = false;
  head.innerHTML = '<div class="phead">' +
      '<div class="prow"><div class="badges"><span class="badge tag">' + esc(R.svc) + '</span>' + (rid ? '<span class="badge ' + BADGE[F.pst(S, ME)] + '">' + F.pst(S, ME) + '</span>' : '') + (R.open === '비공개' ? '<span class="badge done">비공개</span>' : '') + '</div><span class="reg">' + (rid ? (X.self ? '견적 신청일 : ' : '견적 요청일 : ') + F.ymd(X.at) : '등록일 : ' + dot(x.reg)) + '</span></div>' +
      '<div class="prow"><h2 class="ptitle"><a class="back" href="mypage-quote.html" aria-label="견적 목록으로"><img src="assets/detail/ic-caret-left.svg" alt=""></a>' + esc(R.title) + '</h2>' +
        (rid ? '<span class="period"><b>견적 마감</b>' + dot(S.due) + (locked ? '' : '<em>' + dleft(S.due) + '</em>') + '</span>' : '<span class="period"><b>모집기한</b>' + dot(x.from) + ' ~ ' + dot(x.to) + '<em>' + (x.open ? '모집중' : '모집마감') + '</em></span>') + '</div></div>' +
      banner;
  card.innerHTML =
    '<nav class="qtabs" role="tablist"><button type="button" role="tab" data-go="req">의뢰내용</button><button type="button" role="tab" data-go="quote">' + (locked ? '제출한 견적서' : '견적서 작성') + '</button></nav>' +
    // 의뢰내용
    '<section class="sec" id="req" role="tabpanel">' + F.reqHTML(R) +
      (locked ? '' : '<div class="next"><button type="button" class="btn primary lg" data-go="quote">견적서 작성하기</button></div>') +
    '</section>' +
    // 견적서
    '<section class="sec" id="quote" role="tabpanel">' +
      '<h4>고객사</h4><div class="grid2">' +
        '<div class="k">기업명</div><div>' + esc(R.org || '-') + '</div><div class="k">대표자성명</div><div>-</div>' +
        '<div class="k">연락처</div><div>-</div><div class="k">사업자등록번호</div><div>-</div>' +
        '<div class="k">담당자</div><div>' + esc(R.manager || '-') + '</div><div class="k">이메일</div><div>-</div>' +
        '<div class="k">주소</div><div class="wide">-</div></div>' +
      '<p class="hint">고객사 연락처는 매칭이 완료된 뒤 OmicsPharm 컨설턴트를 통해 안내됩니다.</p>' +
      '<h4>공급자</h4><div class="grid2" id="supplier">' +
        '<div class="k">기업명</div><div><input class="inp" name="s_org"></div><div class="k">대표자성명</div><div><input class="inp" name="s_ceo"></div>' +
        '<div class="k">연락처</div><div><input class="inp" name="s_tel"></div><div class="k">사업자등록번호</div><div><input class="inp" name="s_biz" inputmode="numeric" placeholder="000-00-00000"></div>' +
        '<div class="k">담당자</div><div><input class="inp" name="s_mgr"></div><div class="k">이메일</div><div><input class="inp" name="s_mail" type="email"></div>' +
        '<div class="k">주소</div><div class="wide"><input class="inp" name="s_addr"></div></div>' +
      '<div class="prow"><h4>제안가</h4><label class="unit">금액 단위 <select id="cur"><option value="KRW">원화, 공급가 (VAT 별도)</option><option value="USD">달러</option><option value="JPY">엔화</option></select></label></div>' +
      '<div class="tblwrap"><table class="items"><thead><tr><th>시험명<button type="button" class="add" id="addGroup">추가</button></th><th>세부내용</th><th class="c-qty">수량</th><th class="c-unit">Unit</th><th class="c-price">단가</th><th>금액</th><th class="c-del"></th></tr></thead><tbody id="rows"></tbody></table></div>' +
      '<table class="totals"><tbody>' +
        '<tr><td>분석료 합계</td><td id="tSum"></td></tr>' +
        '<tr class="minus"><td>할인</td><td>-<input class="inp num" id="sale" inputmode="numeric" placeholder="0"></td></tr>' +
        '<tr class="minus"><td>추가 할인</td><td>-<input class="inp num" id="addSale" inputmode="numeric" placeholder="0"></td></tr>' +
        '<tr><td>분석료 총계</td><td id="tNet"></td></tr>' +
        '<tr><td>VAT 10%</td><td id="tVat"></td></tr>' +
        '<tr class="final"><td>최종</td><td id="tFinal"></td></tr>' +
      '</tbody></table>' +
      '<h4>분석 소요 기간 <span class="req">*</span></h4><label class="weeks">시료 수령 후 <input class="inp num" id="weeks" inputmode="numeric" placeholder="0"> 주 이내 결과 전달</label>' +
      '<h4>Notice</h4><textarea class="inp" id="memo" placeholder="분석 방법, 시료 발송 조건 등 클라이언트에게 전달할 내용을 입력해주세요."></textarea>' +
      '<div class="acts"><button type="button" class="btn lg tertiary" id="saveTmp">임시저장</button>' +
        '<div class="right"><button type="button" class="btn lg" id="preview">견적서 미리보기</button><button type="button" class="btn primary lg" id="submit"' + (rid || x.open ? '' : ' disabled') + '>' + (rid && X.status === 'rev' ? '수정 견적 제출' : '견적서 최종 제출') + '</button></div></div>' +
    '</section>';

  // 공급자: 저장본 → 없으면 내 계정 정보로 채움
  var Sup = (saved && saved.supplier) || { s_org: acc.org || '', s_tel: acc.phone || '', s_mgr: acc.name || '', s_mail: me.s.email };
  [].forEach.call(document.querySelectorAll('#supplier input'), function (i) { i.value = Sup[i.name] || ''; });

  // 제안가: 시험명(그룹)마다 세부내용 여러 줄
  var G = (saved && saved.groups) ? JSON.parse(JSON.stringify(saved.groups)) : [{ name: '', lines: [{ d: '', q: 1, u: 'EA', p: '' }] }];
  var num = F.num;
  function drawRows() {
    var cur = $('#cur').value, h = '';
    G.forEach(function (g, gi) {
      g.lines.forEach(function (l, li) {
        h += '<tr data-g="' + gi + '" data-l="' + li + '">' +
          (li === 0 ? '<td class="name" rowspan="' + (g.lines.length + 1) + '"><div class="namebox"><input class="inp" data-k="name" value="' + esc(g.name) + '" placeholder="예) LC-MS/MS 정량 분석"><button type="button" class="linkbtn" data-add-line>+ 세부내용 추가</button>' + (G.length > 1 ? '<button type="button" class="linkbtn" data-del-group style="color:var(--gray-500)">시험 삭제</button>' : '') + '</div></td>' : '') +
          '<td><input class="inp" data-k="d" value="' + esc(l.d) + '" placeholder="세부내용"></td>' +
          '<td><input type="number" class="inp qty" data-k="q" min="1" step="1" value="' + esc(l.q) + '" aria-label="수량"></td>' +
          '<td><input class="inp" data-k="u" value="' + esc(l.u) + '"></td>' +
          '<td><input class="inp num" data-k="p" inputmode="numeric" value="' + esc(l.p) + '" placeholder="0"></td>' +
          '<td class="amt" data-amt>' + money(num(l.q) * num(l.p), cur) + '</td>' +
          '<td>' + (g.lines.length > 1 ? '<button type="button" class="del" data-del-line aria-label="이 줄 삭제">×</button>' : '') + '</td></tr>';
      });
      h += '<tr class="sub" data-g="' + gi + '"><td colspan="4" style="text-align:right">분석료 소계</td><td class="amt" data-subtotal>' + money(sub(g), cur) + '</td><td></td></tr>';
    });
    $('#rows').innerHTML = h;
    calc(); if (locked) lock();
  }
  function sub(g) { return g.lines.reduce(function (s, l) { return s + num(l.q) * num(l.p); }, 0); }
  function calc() {
    var cur = $('#cur').value, sum = G.reduce(function (s, g) { return s + sub(g); }, 0);
    var net = Math.max(0, sum - num($('#sale').value) - num($('#addSale').value)), vat = cur === 'KRW' ? Math.round(net * 0.1) : 0;
    $('#tSum').textContent = money(sum, cur); $('#tNet').textContent = money(net, cur);
    $('#tVat').textContent = cur === 'KRW' ? money(vat, cur) : '-'; $('#tFinal').textContent = money(net + vat, cur);
    [].forEach.call(document.querySelectorAll('#rows tr[data-l]'), function (tr) { var l = G[tr.dataset.g].lines[tr.dataset.l]; tr.querySelector('[data-amt]').textContent = money(num(l.q) * num(l.p), cur); });
    [].forEach.call(document.querySelectorAll('#rows tr.sub'), function (tr) { tr.querySelector('[data-subtotal]').textContent = money(sub(G[tr.dataset.g]), cur); });
    return net + vat;
  }
  $('#rows').addEventListener('input', function (e) {
    var i = e.target, tr = i.closest('tr'); if (!i.dataset.k || !tr) return;
    var g = G[tr.dataset.g];
    if (i.dataset.k === 'name') g.name = i.value;
    else { if (i.dataset.k === 'q' || i.dataset.k === 'p') i.value = i.value.replace(/[^\d.]/g, ''); g.lines[tr.dataset.l][i.dataset.k] = i.value; }
    calc();
  });
  $('#rows').addEventListener('click', function (e) {
    var tr = e.target.closest('tr'); if (!tr) return; var gi = +tr.dataset.g;
    if (e.target.closest('[data-add-line]')) { G[gi].lines.push({ d: '', q: 1, u: 'EA', p: '' }); drawRows(); }
    else if (e.target.closest('[data-del-line]')) { G[gi].lines.splice(+tr.dataset.l, 1); drawRows(); }
    else if (e.target.closest('[data-del-group]')) { G.splice(gi, 1); drawRows(); }
  });
  $('#addGroup').addEventListener('click', function () { G.push({ name: '', lines: [{ d: '', q: 1, u: 'EA', p: '' }] }); drawRows(); });
  ['#sale', '#addSale', '#weeks'].forEach(function (s) { $(s).addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); calc(); }); });
  $('#cur').addEventListener('change', calc);

  if (saved) { $('#cur').value = saved.cur || 'KRW'; $('#sale').value = saved.sale || ''; $('#addSale').value = saved.addSale || ''; $('#memo').value = saved.memo || ''; $('#weeks').value = saved.weeks || ''; }
  drawRows();

  function collect(submitted) {
    var sup = {}; [].forEach.call(document.querySelectorAll('#supplier input'), function (i) { sup[i.name] = i.value.trim(); });
    return { at: Date.now(), submitted: submitted, supplier: sup, groups: G, cur: $('#cur').value, sale: $('#sale').value, addSale: $('#addSale').value, weeks: $('#weeks').value, memo: $('#memo').value, final: calc() };
  }
  function save(submitted) {
    if (rid) F.partnerSave(rid, ME, collect(submitted), submitted);
    else { var a = read(); a[id] = collect(submitted); write(a); }
  }
  $('#saveTmp').addEventListener('click', function () { save(false); OP.toast('임시저장되었습니다.'); });
  $('#submit').addEventListener('click', function () {
    var filled = G.some(function (g) { return g.name.trim() && g.lines.some(function (l) { return num(l.p) > 0; }); });
    if (!filled) { OP.toast('시험명과 단가를 1개 이상 입력해주세요.'); return; }
    if (!num($('#weeks').value)) { OP.toast('분석 소요 기간을 입력해주세요.'); $('#weeks').focus(); return; }
    var re = rid && X.status === 'rev';
    OP.flow.ask({ title: re ? '수정한 견적을 제출하시겠습니까?' : '견적서를 제출하시겠습니까?', desc: '제출한 견적은 OmicsPharm 컨설턴트가 확인한 뒤 클라이언트에게 그대로 전달되며, 제출 후에는 수정할 수 없습니다.', label: false, yes: '제출' }, function () {
      save(true); OP.flash(re ? '수정 견적이 제출되었습니다.' : '견적서가 제출되었습니다.'); location.href = 'mypage-quote.html';
    });
  });
  // 견적 거절
  var dec = $('#decline');
  if (dec) dec.addEventListener('click', function () {
    OP.flow.ask({ title: '견적 요청을 거절하시겠습니까?', desc: '거절하면 이 의뢰에 견적을 제출할 수 없습니다. 사유는 OmicsPharm 컨설턴트에게 전달됩니다.', label: '거절 사유', ph: '예) 요청하신 기간에 장비 일정이 맞지 않습니다.', yes: '거절하기', required: true }, function (v) {
      F.decline(rid, ME, v); OP.flash('견적 요청을 거절했습니다.'); location.href = 'mypage-quote.html';
    });
  });
  function lock() { // 제출한 견적은 보기 전용
    [].forEach.call(card.querySelectorAll('#quote input, #quote select, #quote textarea, #rows button, #addGroup'), function (el) { el.disabled = true; });
    $('#saveTmp').hidden = true; $('#submit').hidden = true;
  }

  // 견적서 미리보기: 지금 입력한 내용으로 A4 견적서 (컨설턴트·클라이언트가 보는 것과 같은 문서)
  $('#preview').addEventListener('click', function () { F.showDoc(R, collect(locked), rid ? ME : '', '견적서 미리보기'); });

  // 탭: 한 번에 하나만 보임. 작성 대기면 의뢰내용부터, 그 외(임시저장·수정 요청·제출 후)는 견적서부터
  var tabs = [].slice.call(card.querySelectorAll('.qtabs button'));
  function show(k, scroll) {
    tabs.forEach(function (b) { var on = b.dataset.go === k; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    $('#req').hidden = k !== 'req'; $('#quote').hidden = k !== 'quote';
    if (scroll) { var y = card.getBoundingClientRect().top + scrollY - 90; if (scrollY > y) scrollTo({ top: y, behavior: 'smooth' }); }
  }
  card.addEventListener('click', function (e) { var b = e.target.closest('[data-go]'); if (b) show(b.dataset.go, true); });
  document.title = R.title + ' · 견적서 · OmicsPharm';
  show(location.hash === '#quote' || (rid && X.status !== 'req') || (!rid && saved) ? 'quote' : 'req');
})();
</script>
</body>
</html>
